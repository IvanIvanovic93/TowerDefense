<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#a8581c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Fallenfürst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Pixel-UI im hellen Jump-n-Run-Look: 8px-Raster, dieselbe feste Palette wie im Spiel, Blockränder, harte Schatten, keine Verläufe */
:root{
  --ink:#1a1020;--stoneD:#3a3a4a;--stone:#6e6e82;--stoneL:#a8a8b8;--pale:#e0e0ec;--white:#ffffff;
  --sky:#6cb4ff;--skyL:#a8d8ff;--greenD:#1e7a1e;--green:#3cb043;--greenL:#8be04a;
  --brickD:#6b3a1a;--brick:#a8581c;--brickL:#e0903c;--tan:#f8c890;--paper:#fff4dc;
  --purple:#7a2fb0;--lilac:#c080ff;--red:#e8303a;--redD:#9a1a24;--gold:#ffd02a;--orange:#ff8a1a;--goldD:#b86a00;--ice:#7fe0ff;
  --px:"Press Start 2P",ui-monospace,"Courier New",monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
html,body{height:100%;background:var(--sky);color:var(--ink);font-family:var(--px);font-size:8px;line-height:16px;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
.ico{display:inline-block;width:16px;height:16px;flex:none;background:center/16px 16px no-repeat;image-rendering:pixelated;vertical-align:-4px}
/* Fenster: schwarzer Rand, heller Papiergrund, harter Schatten */
.box{background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:inset 0 0 0 2px var(--tan),4px 4px 0 var(--ink)}
.btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 16px;
  background:var(--green);color:var(--white);border:2px solid var(--ink);
  box-shadow:inset -2px -2px 0 var(--greenD),inset 2px 2px 0 var(--greenL),2px 2px 0 var(--ink);font-size:8px;line-height:16px}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:inset 2px 2px 0 var(--greenD)}
.btn:disabled{background:var(--stoneL);color:var(--stone);box-shadow:inset -2px -2px 0 var(--stone),inset 2px 2px 0 var(--pale)}
.btn.pri{background:var(--gold);color:var(--ink)!important;box-shadow:inset -2px -2px 0 var(--orange),inset 2px 2px 0 var(--white),2px 2px 0 var(--ink)}
.btn.pri:active{box-shadow:inset 2px 2px 0 var(--orange)}
.btn.alt{background:var(--stone);box-shadow:inset -2px -2px 0 var(--stoneD),inset 2px 2px 0 var(--stoneL),2px 2px 0 var(--ink)}
.btn.alt:active{box-shadow:inset 2px 2px 0 var(--stoneD)}
.btn.danger{background:var(--red);box-shadow:inset -2px -2px 0 var(--redD),inset 2px 2px 0 #ff9a8a,2px 2px 0 var(--ink)}
.btn.lordb{background:var(--purple);box-shadow:inset -2px -2px 0 #4a1a70,inset 2px 2px 0 var(--lilac),2px 2px 0 var(--ink)}
.btn small{font-size:8px;line-height:8px;margin-top:4px}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* Leisten aus Ziegeln */
#top,#bottom{background-color:var(--brick);
  background-image:linear-gradient(var(--brickD) 2px,transparent 2px),linear-gradient(90deg,var(--brickD) 2px,transparent 2px);
  background-size:24px 16px}
#top{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:2px solid var(--ink);box-shadow:inset 0 2px 0 var(--brickL);overflow:hidden}
.stat{display:flex;align-items:center;gap:8px;height:24px;padding:0 8px;background:var(--ink);color:var(--white);font-size:16px;line-height:16px;white-space:nowrap;box-shadow:2px 2px 0 var(--brickD)}
.stat.g{color:var(--gold)}
.stat.r{color:#ff6a6a}
.sp{flex:1}
.ib{height:32px;min-width:32px;padding:0 8px;flex-direction:row;gap:8px;font-size:8px}
.lordb{position:relative}
.lordb.pts::after{content:'';position:absolute;top:-4px;right:-4px;width:8px;height:8px;background:var(--gold);box-shadow:0 0 0 2px var(--ink)}
#stage{flex:1;position:relative;min-height:0;overflow:hidden;background:var(--sky)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#bottom{height:80px;flex:none;display:flex;align-items:stretch;gap:8px;padding:8px;border-top:2px solid var(--ink);box-shadow:inset 0 2px 0 var(--brickL)}
#palette{flex:1;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;padding:0 4px 4px 0}
#palette *{touch-action:pan-x}
#palette::-webkit-scrollbar{display:none}
.tb{flex:none;width:80px;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:inset 0 0 0 2px var(--tan),2px 2px 0 var(--ink);font-size:8px;line-height:8px}
.tb canvas{width:32px;height:32px;image-rendering:pixelated}
.tb .c{color:var(--goldD)}
.tb.sel{background:var(--gold);box-shadow:inset 0 0 0 2px var(--orange),2px 2px 0 var(--ink)}
.tb.poor{color:var(--stone)}
.tb.poor .c{color:var(--red)}
.tb.poor canvas{opacity:.45}
#bStart{min-width:176px;font-size:16px;line-height:16px}
#waveinfo{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 8px;color:var(--white);text-shadow:2px 2px 0 var(--ink)}
/* Balken aus Blöcken */
.bar{height:16px;background:var(--ink);border:2px solid var(--ink);padding:4px 2px}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 8px)}
.bar.xp i{background:repeating-linear-gradient(90deg,var(--lilac) 0 6px,transparent 6px 8px)}
.hide{display:none!important}
#popup{position:absolute;left:50%;top:32px;transform:translateX(-50%);width:min(400px,calc(100% - 16px));padding:16px;display:flex;flex-direction:column;gap:8px}
#popup .ph{display:flex;align-items:center;gap:8px;font-size:16px;line-height:16px}
#popup .ph .x{width:32px;height:32px;padding:0}
#popup .pd{color:var(--stone)}
#popup .pb{display:flex;gap:8px}
#popup .pb .btn{flex:1;flex-direction:row;gap:8px}
#toast{position:absolute;left:50%;top:32px;transform:translateX(-50%);max-width:calc(100% - 16px);padding:8px 16px;text-align:center;
  background:var(--ink);color:var(--white);border:2px solid var(--gold);box-shadow:4px 4px 0 var(--brickD);display:none;pointer-events:none}
#toast.on{display:block}
/* Abdunkeln per Dithering (Schachbrett) statt Transparenz */
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;
  background:repeating-conic-gradient(var(--ink) 0 25%,transparent 0 50%) 0 0/4px 4px}
.card{width:min(512px,100%);max-height:100%;overflow:auto;touch-action:pan-y;padding:16px 24px;display:flex;flex-direction:column;gap:16px}
.card *{touch-action:pan-y}
.card h1{font-size:24px;line-height:32px;color:var(--red);text-shadow:4px 4px 0 var(--ink)}
.card h1 span{color:var(--purple)}
.card h2{font-size:16px;line-height:24px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.card p{color:var(--ink)}
.card ul{margin-left:16px;display:flex;flex-direction:column;gap:8px}
.card ul li::marker{color:var(--red);content:'> '}
.card b{color:var(--ink);font-weight:normal;background:var(--tan)}
.card .row{display:flex;gap:16px}
.card .row .btn{flex:1;min-height:48px;font-size:16px;line-height:16px}
.res{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:8px;background:var(--ink);color:var(--white)}
.res span{color:var(--pale)}
.res b{text-align:right;color:var(--white);background:none}
.res .good{color:var(--greenL)!important}.res .gold{color:var(--gold)!important}.res .bad{color:#ff6a6a!important}
.big{font-size:16px;line-height:24px;display:flex;align-items:center;gap:8px}
.stars{display:inline-flex;gap:4px}
.stars .ico{width:24px;height:24px;background-size:24px 24px}
.lrow{display:flex;align-items:center;gap:16px;padding-top:16px;border-top:2px solid var(--tan)}
.lrow>div{flex:1}
.muted{color:var(--stone)!important}
.ibtn{width:32px;height:32px;padding:0;font-size:16px;line-height:16px;flex:none}
.hrow{display:flex;align-items:flex-start;gap:16px}
.hrow>:first-child{flex:1}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:4px 8px;background:var(--ink);color:var(--white)}
.tag.b{background:var(--red)}
.tag.l{background:var(--purple)}
.lup{width:48px;height:40px;font-size:16px;flex:none;padding:0}
.good{color:var(--greenD)!important}.bad{color:var(--red)!important}.gold{color:var(--goldD)!important}
#rotate{position:fixed;inset:0;z-index:20;background:var(--sky);color:var(--ink);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:24px;font-size:16px;line-height:24px}
#rotate .ico{width:64px;height:64px;background-size:64px 64px;animation:rot 2s steps(4) infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){#rotate .ico{animation:none}}
@media (orientation:portrait){body:not(.forceportrait) #rotate{display:flex}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="stat g" title="Gold"><i class="ico i-coin"></i><span id="gold">0</span></div>
    <div class="stat" title="Runde"><i class="ico i-sword"></i><span id="wave">1</span></div>
    <div class="stat" title="Getötet"><i class="ico i-skull"></i><span id="kills">0</span></div>
    <div class="stat r" title="Durchgekommen"><i class="ico i-run"></i><span id="leaks">0</span></div>
    <div class="sp"></div>
    <button class="btn ib lordb" id="bLord" aria-label="Dunkler Lord"><i class="ico i-lord"></i><span id="lordLv">1</span></button>
    <button class="btn ib alt" id="bSpeed" aria-label="Tempo">1x</button>
    <button class="btn ib alt" id="bPause" aria-label="Pause"><i class="ico i-pause"></i></button>
    <button class="btn ib alt" id="bMenu" aria-label="Menü"><i class="ico i-menu"></i></button>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="toast"></div>
    <div id="popup" class="box hide"></div>
  </div>
  <div id="bottom">
    <div id="palette"></div>
    <div id="waveinfo" class="hide">
      <div id="wiText"></div>
      <div class="bar"><i id="wiBar"></i></div>
    </div>
    <button class="btn pri" id="bStart">Runde 1<small>0 Helden</small></button>
  </div>
</div>
<div id="overlay"><div class="card box" id="card"></div></div>
<div id="rotate">
  <i class="ico i-phone"></i>
  <div>Bitte Handy quer halten</div>
  <button class="btn alt" onclick="document.body.classList.add('forceportrait');window.dispatchEvent(new Event('resize'))">Trotzdem hochkant spielen</button>
</div>

<script>
(() => {
'use strict';

// ================= Konstanten =================
const TILE = 48, NT_MAX = 64, H = 380, GY = 320, BUILD_MIN = 3;
// Die Strecke wächst mit der Runde: kurz am Anfang, lang später
const roadTiles = w => Math.min(NT_MAX, 22 + (w - 1) * 2);
let NT, WORLD_W, BUILD_MAX, CASTLE_L, LEAK_X;
function applyLength(w) {
  NT = roadTiles(w); WORLD_W = NT * TILE; BUILD_MAX = NT - 7;
  CASTLE_L = (NT - 6) * TILE; LEAK_X = CASTLE_L + 40;
}
const G = 1600, JV = 520, AIRT = 2 * JV / G;
const WALL_H = 104;
const FLAME_P = 3.2, FLAME_ON = 1.2;
const SAVE_KEY = 'fallenfuerst_v1';

const TRAPS = {
  spikes:  { name: 'Stacheln', cost: 30, danger: true, col: '#c9ced6',
             desc: 'Schaden am Boden. Clevere Helden springen drüber.',
             lv: [{ dps: 35 }, { dps: 60 }, { dps: 95 }] },
  pit:     { name: 'Grube', cost: 60, danger: true, col: '#000',
             desc: 'Wer reinfällt, ist tot. Aber: gefallene Helden füllen die Grube, bis man drüberlaufen kann. Upgrade = tiefer + getarnt.',
             lv: [{ camo: 1, cap: 4 }, { camo: .78, cap: 6 }, { camo: .58, cap: 9 }] },
  wall:    { name: 'Barrikade', cost: 40, col: '#8a5a2b',
             desc: 'Blockiert den Weg. Helden müssen sie zerschlagen. Wird jede Runde repariert.',
             lv: [{ hp: 160 }, { hp: 340 }, { hp: 620 }] },
  frost:   { name: 'Frostrune', cost: 45, danger: true, col: '#6fd6ff',
             desc: 'Verlangsamt stark. Verlangsamte Helden springen zu kurz.',
             lv: [{ slow: .5, dps: 6 }, { slow: .38, dps: 12 }, { slow: .26, dps: 20 }] },
  spring:  { name: 'Katapult', cost: 70, danger: true, col: '#d08a3a',
             desc: 'Schleudert Helden zurück - direkt nochmal durch deine Fallen.',
             lv: [{ cd: 2.2, push: 4 }, { cd: 1.6, push: 5.5 }, { cd: 1.1, push: 7 }] },
  flame:   { name: 'Flammen', cost: 90, col: '#ff7a1a',
             desc: 'Feuersäule im Takt. Trifft auch Springer und Magier.',
             lv: [{ dps: 70 }, { dps: 110 }, { dps: 165 }] },
  crusher: { name: 'Stampfer', cost: 110, col: '#7d8794',
             desc: 'Zerquetscht alles darunter im Takt - auch in der Luft.',
             lv: [{ dmg: 75, per: 2.6 }, { dmg: 130, per: 2.2 }, { dmg: 210, per: 1.8 }] },
  tower:   { name: 'Pfeilturm', cost: 120, col: '#b33b3b',
             desc: 'Schießt auf den vordersten Helden in Reichweite.',
             lv: [{ dmg: 14, rate: 1.3, rng: 4.5 }, { dmg: 22, rate: 1.7, rng: 5.5 }, { dmg: 34, rate: 2.1, rng: 6.5 }] },
};
const ORDER = ['spikes', 'pit', 'wall', 'frost', 'spring', 'flame', 'crusher', 'tower'];

const HT = {
  squire:  { name: 'Knappe',     hp: 30,  spd: 58, skill: .35, rng: 2.0,  gold: 3,  dps: 8,  col: '#3f7fe0', s: 1 },
  rogue:   { name: 'Schurke',    hp: 22,  spd: 82, skill: .85, rng: 3.1,  gold: 4,  dps: 6,  col: '#2f9a58', s: .95 },
  knight:  { name: 'Ritter',     hp: 95,  spd: 38, skill: .25, rng: 1.35, gold: 7,  dps: 16, col: '#aab4c0', s: 1.1, armor: .35 },
  cleric:  { name: 'Klerikerin', hp: 40,  spd: 48, skill: .5,  rng: 2.0,  gold: 6,  dps: 6,  col: '#efe4c4', s: 1, heal: true },
  mage:    { name: 'Magier',     hp: 30,  spd: 42, skill: .6,  rng: 2.0,  gold: 8,  dps: 5,  col: '#8a4fd0', s: 1, float: true },
  paladin: { name: 'Paladin',    hp: 520, spd: 31, skill: .55, rng: 1.6,  gold: 45, dps: 45, col: '#e2b53a', s: 1.6, armor: .3, boss: true },
};

// ================= Zustand =================
let S;                // gespeicherter Spielstand
let phase = 'build';  // 'build' | 'wave'
let heroes = [], spawnQ = [], arrows = [], parts = [], texts = [];
let waveT = 0, waveTotal = 0, W = null; // W = Statistik der laufenden Runde
let hpMul = 1;
let speed = 1, paused = false, menuOpen = true;
let selType = null, selTile = -1;
let camX = 0, time = 0, shake = 0;
let lordLaugh = 0;

// ================= Dunkler Lord (bleibt dauerhaft, auch bei neuem Spiel) =================
const LORD_KEY = 'fallenfuerst_lord_v1', LORD_MAX = 10;
const LORD_SKILLS = {
  dmg: { name: 'Wurfkraft', txt: l => `${stoneDmg(l)} Schaden` },
  cd:  { name: 'Nachladen', txt: l => `alle ${stoneCd(l).toFixed(2)} s` },
  rad: { name: 'Einschlag', txt: l => `${stoneRad(l)} Radius` },
};
const stoneDmg = (l = lord.pts.dmg) => 18 + l * 10;
const stoneCd = (l = lord.pts.cd) => 1.5 - l * .11;
const stoneRad = (l = lord.pts.rad) => 22 + l * 5;
const lordXpFor = lv => Math.round(25 * Math.pow(lv - 1, 1.6)); // XP, ab der Stufe lv erreicht ist
function lordLevel() { let l = 1; while (lordXpFor(l + 1) <= lord.xp) l++; return l; }
const lordSpent = () => lord.pts.dmg + lord.pts.cd + lord.pts.rad;
const lordFree = () => Math.max(0, lordLevel() - 1 - lordSpent());
function loadLord() {
  try { const d = JSON.parse(localStorage.getItem(LORD_KEY)); if (d && d.pts) return { xp: d.xp || 0, pts: { dmg: 0, cd: 0, rad: 0, ...d.pts } }; } catch (e) {}
  return { xp: 0, pts: { dmg: 0, cd: 0, rad: 0 } };
}
function saveLord() { try { localStorage.setItem(LORD_KEY, JSON.stringify(lord)); } catch (e) {} }
let lord = loadLord();
let stones = [], stoneT = 0, lordThrow = 0;

const stat = tr => TRAPS[tr.type].lv[tr.lvl - 1];
const tileAt = x => Math.floor(x / TILE);
const trapAt = i => (i >= 0 && i < NT_MAX) ? S.grid[i] : null;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function newState() {
  return { gold: budget(1), wave: 1, grid: new Array(NT_MAX).fill(null), kills: 0, leaks: 0, stars: {}, retry: 0, best: 0 };
}

function save() {
  try {
    const g = S.grid.map(t => t ? { type: t.type, lvl: t.lvl, spent: t.spent } : null);
    localStorage.setItem(SAVE_KEY, JSON.stringify({ ...S, grid: g }));
  } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    const s = { ...newState(), ...d };
    s.stars = d.stars || {};
    s.grid = new Array(NT_MAX).fill(null);
    (d.grid || []).forEach((t, i) => { if (t && TRAPS[t.type] && i < NT_MAX) s.grid[i] = makeTrap(t.type, i, t.lvl, t.spent, false); });
    return s;
  } catch (e) { return null; }
}

function makeTrap(type, i, lvl = 1, spent = TRAPS[type].cost, fresh = true) {
  const tr = { type, i, lvl, spent, fresh, t: Math.random() * 3, cd: 0, anim: 0, hit: 0, hp: 0, max: 0, ph: 0 };
  resetTrap(tr);
  return tr;
}
function resetTrap(tr) {
  if (tr.type === 'wall') { tr.max = stat(tr).hp; tr.hp = tr.max; }
  tr.cd = 0; tr.fill = 0;
}

// ================= Wellen =================
function waveHpMul(w) { return 1 + (w - 1) * .3 + Math.max(0, w - 5) * .3 + Math.max(0, w - 10) * .4; }
// Helden lernen dazu: sie erkennen Fallen öfter und springen weiter
const waveSkill = w => .15 + Math.min(.35, (w - 1) * .03);
const waveRng = w => 1 + Math.min(.4, (w - 1) * .03);
function waveCount(w) { return Math.min(32 + w * 6, 150); }
function waveList(w) {
  const pool = [['squire', 10]];
  if (w >= 2) pool.push(['rogue', 3 + w * .5]);
  if (w >= 3) pool.push(['knight', 2 + w * .4]);
  if (w >= 4) pool.push(['cleric', 1.5 + w * .2]);
  if (w >= 5) pool.push(['mage', 1 + w * .6]);
  const tot = pool.reduce((a, p) => a + p[1], 0);
  const list = [];
  for (let n = waveCount(w); n > 0; n--) {
    let r = Math.random() * tot;
    for (const p of pool) { r -= p[1]; if (r <= 0) { list.push(p[0]); break; } }
    if (list.length < waveCount(w) - n + 1) list.push('squire');
  }
  // Jede 5. Runde ist eine Bossrunde mit Paladin(en)
  const bosses = isBoss(w) ? w / 5 : 0;
  for (let k = 0; k < bosses; k++) list.splice(Math.floor(list.length * (.3 + .4 * Math.random())), 0, 'paladin');
  return list;
}

function startWave() {
  if (phase !== 'build') return;
  closePopup(); selType = null; refreshPalette();
  phase = 'wave';
  hpMul = waveHpMul(S.wave);
  const list = planned(S.wave);
  spawnQ = [];
  let t = 0;
  list.forEach((type, k) => {
    // in Gruppen: dichte Pulks mit kurzen Pausen
    t += (k % 8 === 0 && k > 0) ? rnd(1.2, 2) : rnd(.12, .38);
    spawnQ.push({ t, type });
  });
  waveT = 0; waveTotal = list.length;
  W = { kills: 0, leaks: 0, gold: 0 };
  stones = []; stoneT = 0;
  if (lord.xp < 40) setTimeout(() => toast('Tippe auf die Strecke: der Lord wirft Steine!', 2600), 400);
  S.grid.forEach(tr => { if (tr) { tr.fresh = false; resetTrap(tr); } });
  heroes = []; arrows = [];
  updateUI();
}

function spawnHero(type) {
  const d = HT[type];
  heroes.push({
    type, def: d, x: rnd(40, 90), y: GY, vx: 0, vy: 0,
    skill: Math.min(.95, d.skill + waveSkill(S.wave)), rng: d.rng * waveRng(S.wave),
    hp: d.hp * hpMul, max: d.hp * hpMul, st: 'run', plans: {}, anim: Math.random() * 20,
    slowT: 0, slowF: 1, flash: 0, healT: rnd(1, 3), bob: Math.random() * 6, spin: 0,
    knock: false, blocked: null, waiting: false, waitT: 0, fallT: 0, dead: false
  });
}

// Sterne: 3 = keiner durch, 2 = höchstens 5 %, 1 = unter 10 % (bestanden), 0 = nicht bestanden
function starsFor(leaks, total) {
  const r = leaks / total;
  return leaks === 0 ? 3 : r <= .05 ? 2 : r < .1 ? 1 : 0;
}
// Festes Budget pro Runde. Restgold verfällt beim Weiterkommen, die Fallen bleiben stehen.
const isBoss = w => w % 5 === 0;
// Nach einer Bossrunde wird das Feld geräumt, deshalb gibt es dann ein größeres Startbudget
// (alles, was man bis dahin an Rundenbudget bekommen hätte)
const baseBudget = w => 150 + (w - 1) * 20;
function budget(w) {
  if (w === 1 || !isBoss(w - 1)) return baseBudget(w);
  let sum = 0; for (let k = 1; k <= w; k++) sum += baseBudget(k);
  return Math.round(sum / 10) * 10;
}

function endWave() {
  phase = 'build';
  const done = S.wave, stars = starsFor(W.leaks, waveTotal);
  if (stars > 0) {
    S.stars[done] = Math.max(S.stars[done] || 0, stars);
    S.best = Math.max(S.best, done);
    if (isBoss(done)) S.grid = new Array(NT_MAX).fill(null);
    S.wave++; S.retry = 0; S.gold = budget(S.wave);
    applyLength(S.wave);
  } else S.retry = (S.retry || 0) + 1;
  S.grid.forEach(tr => tr && resetTrap(tr));
  arrows = []; stones = [];
  save(); saveLord();
  showResult(done, stars);
  updateUI();
}

// ================= Helden-Logik =================
const pitOpen = tr => tr.type === 'pit' && tr.fill < stat(tr).cap;
function isDanger(tr, h) { return !!tr && !!TRAPS[tr.type].danger && !h.def.float && (tr.type !== 'pit' || pitOpen(tr)); }

// Oberkante des Stampfer-Blocks (26 hoch + Zacken)
function crushY(tr) {
  const P = stat(tr).per, ph = tr.t % P, top = GY - 165, bot = GY - 30;
  if (ph < .35) return bot;
  if (ph < 1) return bot + (top - bot) * ((ph - .35) / .65);
  if (ph < P - .22) return top;
  const f = (ph - (P - .22)) / .22; return top + (bot - top) * f * f;
}

function moveX(h, dx) {
  let nx = h.x + dx;
  h.halted = false;
  if (h.y > GY - WALL_H) {
    const a = Math.min(h.x, nx) - 8, b = Math.max(h.x, nx) + 8;
    for (let k = tileAt(a); k <= tileAt(b); k++) {
      const tr = trapAt(k);
      // Ein unten stehender Stampfer ist eine Wand: keiner läuft durch
      if (tr && tr.type === 'crusher' && crushY(tr) + 30 > h.y - 26 * h.def.s) {
        const L = k * TILE + 4, R = k * TILE + 44;
        if (dx > 0 && h.x + 7 <= L + .01 && nx + 7 > L) { nx = L - 7; h.halted = true; if (h.st === 'air') h.vx = 0; }
        else if (dx < 0 && h.x - 7 >= R - .01 && nx - 7 < R) { nx = R + 7; h.vx = 0; }
        continue;
      }
      if (!tr || tr.type !== 'wall' || tr.hp <= 0) continue;
      // Helden bleiben im Feld VOR der Barrikade stehen, damit Fallen dort sie treffen
      const L = k * TILE, R = k * TILE + 34;
      if (dx > 0 && h.x + 7 <= L + .01 && nx + 7 > L) { nx = L - 7; h.blocked = tr; if (h.st === 'air') h.vx = 0; }
      else if (dx < 0 && h.x - 7 >= R - .01 && nx - 7 < R) { nx = R + 7; h.vx = 0; }
    }
  }
  h.x = Math.max(8, nx);
}

function dangerAt(tr, t) {
  if (tr.type === 'flame') return (t % FLAME_P) < FLAME_ON;
  if (tr.type === 'crusher') { const P = stat(tr).per, ph = t % P; return ph > P - .32 || ph < .06; }
  return false;
}
function hazardIn(tr, win) {
  for (let s = 0; s <= win; s += .05) if (dangerAt(tr, tr.t + s)) return true;
  return false;
}

function shouldWait(h, sp) {
  const k0 = tileAt(h.x + 8);
  for (let k = k0; k <= k0 + 1; k++) {
    const tr = trapAt(k);
    if (!tr || (tr.type !== 'flame' && tr.type !== 'crusher')) continue;
    const d = k * TILE - (h.x + 8);
    if (d < 0 || d > 26) continue;
    const key = 'h' + k;
    if (h.plans[key] === undefined) h.plans[key] = Math.random() < h.skill;
    if (!h.plans[key]) continue;
    // Geduld: wer zu lange gewartet hat, entscheidet sich fest zu laufen (nur noch warten, solange es gerade gefährlich ist)
    const go = 'g' + k;
    if (!h.plans[go] && h.waitT >= 2.2) h.plans[go] = true;
    if (dangerAt(tr, tr.t) || (!h.plans[go] && hazardIn(tr, (d + TILE + 18) / sp))) return true;
  }
  return false;
}

function planJump(h) {
  const d = h, k0 = tileAt(h.x), look = Math.ceil(d.rng) + 2;
  for (let k = k0; k <= k0 + look; k++) {
    // Steht eine Barrikade davor, gibt es nichts zu überspringen: erst hinlaufen und zerschlagen
    const t = trapAt(k);
    if (t && t.type === 'wall' && t.hp > 0 && k * TILE >= h.x) return;
    if (!isDanger(t, h)) continue;
    let s = k; while (isDanger(trapAt(s - 1), h)) s--;
    let e = k; while (isDanger(trapAt(e + 1), h)) e++;
    const x0 = s * TILE, x1 = (e + 1) * TILE;
    if (h.x > x1) { k = e; continue; }
    let p = h.plans[s];
    if (!p) {
      let camo = 1;
      for (let q = s; q <= e; q++) if (pitOpen(S.grid[q])) camo = Math.min(camo, stat(S.grid[q]).camo);
      const see = Math.random() < Math.min(.97, (d.skill + .12) * camo);
      const R = d.rng * TILE, Wd = x1 - x0;
      const err = (Math.random() - .5) * (1 - d.skill) * 56;
      p = h.plans[s] = { jump: see, tx: x0 - Math.max(4, (R - Wd) / 2) + err, done: false };
    }
    if (p.jump && !p.done && h.x >= p.tx) { p.done = true; doJump(h); }
    return;
  }
}

function doJump(h) {
  h.st = 'air';
  h.vy = -JV;
  const f = h.slowT > 0 ? (.45 + .55 * h.slowF) : 1;
  h.vx = h.rng * TILE / AIRT * f;
}

function launch(h, push) {
  h.st = 'air'; h.knock = true;
  h.vy = -600;
  h.vx = -(push * TILE) / (2 * 600 / G);
  h.plans = {};
}

const openPitAt = i => { const t = trapAt(i); return !!t && pitOpen(t); };
function pitBounds(i) {
  let s = i; while (openPitAt(s - 1)) s--;
  let e = i; while (openPitAt(e + 1)) e++;
  return [s * TILE, (e + 1) * TILE];
}
function startFall(h, i) {
  const [L, R] = pitBounds(i);
  h.st = 'fall'; h.pitC = clamp(h.x, L + 10, R - 10); h.pitEnd = R;
  h.vy = Math.max(h.vy, 0); h.vx = 0; h.fallT = 0;
}

function damage(h, amt, src) {
  if (h.dead) return;
  if (h.def.armor && src !== 'pit') amt *= (1 - h.def.armor);
  h.hp -= amt;
  if (amt > 3 || Math.random() < .15) h.flash = .08;
  if (Math.random() < Math.min(.9, amt * .08)) spark(h.x, h.y - 14 * h.def.s, src === 'fire' ? '#ffb13d' : '#ff4d5e', 1);
  if (h.hp <= 0) kill(h, src);
}

function kill(h, src) {
  if (h.dead) return;
  h.dead = true;
  // Wiederholte Runden geben nur halbes Gold
  const g = Math.max(1, Math.round(h.def.gold * (1 + (S.wave - 1) * .025) * (S.retry ? .5 : 1)));
  S.gold += g; S.kills++; W.kills++; W.gold += g;
  const lvBefore = lordLevel();
  lord.xp += h.def.boss ? 10 : 1;
  if (lordLevel() > lvBefore) { saveLord(); texts.push({ x: CASTLE_L + 88, y: GY - 220, txt: 'Lord Stufe ' + lordLevel() + '!', col: '#c38bff', life: 2, max: 2 }); }
  lordLaugh = 1.2;
  const y = src === 'pit' ? GY - 6 : h.y - 14;
  for (let k = 0; k < 10; k++) parts.push({ x: h.x, y, vx: rnd(-60, 60), vy: rnd(-120, -20), life: rnd(.4, .8), max: .8, col: k < 3 ? '#ffd24a' : '#d9c8e8', sz: rnd(2, 4), g: 200 });
  parts.push({ ghost: true, x: h.x, y, vx: 0, vy: -40, life: 1.2, max: 1.2 });
  texts.push({ x: h.x, y: y - 14, txt: '+' + g, col: '#ffd24a', life: 1, max: 1 });
  if (h.def.boss) { shake = .4; texts.push({ x: h.x, y: y - 34, txt: 'Paladin besiegt!', col: '#fff', life: 1.8, max: 1.8 }); }
}

function leak(h) {
  h.dead = true;
  S.leaks++; W.leaks++;
  texts.push({ x: LEAK_X, y: GY - 60, txt: 'Durchgekommen!', col: '#ff5a5a', life: 1.1, max: 1.1 });
  shake = Math.max(shake, .15);
}

function updHero(h, dt) {
  const d = h.def;
  if (h.slowT > 0) h.slowT -= dt;
  if (h.flash > 0) h.flash -= dt;
  if (d.heal) {
    h.healT -= dt;
    if (h.healT <= 0) {
      h.healT = 3.2;
      let any = false;
      for (const o of heroes) if (!o.dead && o !== h && Math.abs(o.x - h.x) < 100 && o.hp < o.max) { o.hp = Math.min(o.max, o.hp + 10 * hpMul); any = true; }
      if (any) parts.push({ ring: true, x: h.x, y: h.y - 12, life: .6, max: .6 });
    }
  }
  const sp = d.spd * (h.slowT > 0 ? h.slowF : 1);

  if (h.st === 'fall') {
    h.fallT += dt;
    h.vy += G * dt; h.y += h.vy * dt;
    h.x += (h.pitC - h.x) * Math.min(1, dt * 5);
    if (h.y > GY + 70) {
      if (d.boss && h.hp > h.max * .36) {
        h.hp -= h.max * .35;
        h.st = 'run'; h.y = GY; h.x = h.pitEnd + 1; h.plans = {};
        texts.push({ x: h.x, y: GY - 50, txt: 'klettert raus!', col: '#ffd24a', life: 1.2, max: 1.2 });
      } else {
        const tr = trapAt(tileAt(h.pitC));
        if (tr && tr.type === 'pit') { tr.fill++; if (tr.fill === stat(tr).cap) texts.push({ x: tr.i * TILE + 24, y: GY - 30, txt: 'Grube voll!', col: '#ff9a3d', life: 1.4, max: 1.4 }); }
        kill(h, 'pit');
      }
    }
    return;
  }

  if (h.st === 'air') {
    h.vy += G * dt;
    if (h.knock) h.spin += dt * 9;
    h.blocked = null;
    moveX(h, h.vx * dt);
    h.y += h.vy * dt;
    if (h.y >= GY && h.vy > 0) {
      const i = tileAt(h.x), tr = trapAt(i);
      if (tr && pitOpen(tr) && !d.float) { h.y = GY; startFall(h, i); }
      else { h.y = GY; h.vy = 0; h.st = 'run'; h.knock = false; h.spin = 0; h.plans = {}; }
    }
    return;
  }

  // Bodenlauf / Schweben
  if (d.float) { h.bob += dt * 3; h.y = GY - 16 + Math.sin(h.bob) * 3; }
  h.blocked = null;
  h.waiting = shouldWait(h, sp);
  h.waitT = h.waiting ? h.waitT + dt : 0;
  if (!h.waiting && !d.float) { planJump(h); if (h.st === 'air') return; }
  if (!h.waiting) { moveX(h, sp * dt); h.anim += sp * dt * (h.blocked || h.halted ? 0 : 1); }
  if (h.blocked) {
    const w = h.blocked;
    w.hp -= d.dps * hpMul * dt; w.hit = .12; h.anim += dt * 30;
    if (w.hp <= 0) { w.hp = 0; wallBreak(w); }
  }

  // Bodeneffekte
  const i = tileAt(h.x), tr = trapAt(i);
  if (tr) {
    const st = stat(tr);
    if (tr.type === 'pit' && pitOpen(tr) && !d.float) { startFall(h, i); return; }
    if (tr.type === 'spikes' && !d.float) damage(h, st.dps * dt, 'spike');
    if (tr.type === 'frost') { h.slowT = 1.4; h.slowF = st.slow; damage(h, st.dps * dt, 'frost'); }
    if (tr.type === 'spring' && !d.float && tr.cd <= 0) { launch(h, st.push); tr.cd = st.cd; tr.anim = .35; }
  }
  if (h.x >= LEAK_X) leak(h);
}

function wallBreak(w) {
  for (let k = 0; k < 16; k++) parts.push({ x: w.i * TILE + 24 + rnd(-14, 14), y: GY - rnd(10, 90), vx: rnd(-90, 90), vy: rnd(-200, -40), life: rnd(.5, 1), max: 1, col: '#8a5a2b', sz: rnd(3, 6), g: 700 });
  shake = Math.max(shake, .2);
}

// ================= Fallen-Logik =================
function updTraps(dt) {
  for (const tr of S.grid) {
    if (!tr) continue;
    const st = stat(tr), x = tr.i * TILE;
    const prevT = tr.t;
    tr.t += dt;
    if (tr.cd > 0) tr.cd -= dt;
    if (tr.anim > 0) tr.anim -= dt;
    if (tr.hit > 0) tr.hit -= dt;
    if (phase !== 'wave') continue;
    if (tr.type === 'flame' && dangerAt(tr, tr.t)) {
      for (const h of heroes) if (!h.dead && h.st !== 'fall' && h.x > x + 2 && h.x < x + 46 && h.y > GY - 175) damage(h, st.dps * dt, 'fire');
    } else if (tr.type === 'crusher') {
      const P = st.per;
      if ((prevT % P) > (tr.t % P)) { // Aufprall
        for (const h of heroes) if (!h.dead && h.st !== 'fall' && h.x > x + 2 && h.x < x + 46 && h.y > GY - 150) damage(h, st.dmg, 'crush');
        for (let k = 0; k < 6; k++) parts.push({ x: x + 24 + rnd(-20, 20), y: GY - 2, vx: rnd(-80, 80), vy: rnd(-90, -20), life: .5, max: .5, col: '#9b8f84', sz: rnd(2, 4), g: 400 });
        if (Math.abs(x + 24 - (camX + viewW / 2)) < viewW) shake = Math.max(shake, .08);
      }
    } else if (tr.type === 'tower' && tr.cd <= 0) {
      const cx = x + 24, R = st.rng * TILE;
      let best = null;
      for (const h of heroes) if (!h.dead && h.st !== 'fall' && Math.abs(h.x - cx) <= R && (!best || h.x > best.x)) best = h;
      if (best) { arrows.push({ x: cx, y: GY - 88, tg: best, dmg: st.dmg, vx: 0, vy: 0, life: 2 }); tr.cd = 1 / st.rate; tr.anim = .15; }
    }
  }
}

function updArrows(dt) {
  for (const a of arrows) {
    a.life -= dt;
    if (a.tg && !a.tg.dead) {
      const tx = a.tg.x + a.tg.def.spd * .05, ty = a.tg.y - 14 * a.tg.def.s;
      const dx = tx - a.x, dy = ty - a.y, dist = Math.hypot(dx, dy);
      if (dist < 10) { damage(a.tg, a.dmg, 'arrow'); a.life = 0; continue; }
      a.vx = dx / dist * 560; a.vy = dy / dist * 560;
    } else { a.vy += G * .5 * dt; }
    a.x += a.vx * dt; a.y += a.vy * dt;
    if (a.y > GY) a.life = 0;
  }
  arrows = arrows.filter(a => a.life > 0);
}

const lordPos = () => ({ x: CASTLE_L + 88, y: GY - 196 });
function throwStone(wx, wy) {
  if (stoneT > 0) return;
  const o = lordPos(), tx = clamp(wx, 0, WORLD_W), ty = clamp(wy, GY - 140, GY - 6);
  stones.push({ x0: o.x, y0: o.y, tx, ty, x: o.x, y: o.y, t: 0, T: .35 + Math.abs(tx - o.x) / 1400, arc: 70 + Math.abs(tx - o.x) * .12 });
  stoneT = stoneCd(); lordThrow = .3;
}
function updStones(dt) {
  if (stoneT > 0) stoneT -= dt;
  if (lordThrow > 0) lordThrow -= dt;
  for (const st of stones) {
    st.t += dt;
    const f = Math.min(1, st.t / st.T);
    st.x = st.x0 + (st.tx - st.x0) * f;
    st.y = st.y0 + (st.ty - st.y0) * f - Math.sin(f * Math.PI) * st.arc;
    if (f >= 1) {
      st.done = true;
      const R = stoneRad();
      for (const h of heroes) if (!h.dead && h.st !== 'fall' && Math.hypot(h.x - st.tx, h.y - 12 * h.def.s - st.ty) <= R + 6) damage(h, stoneDmg(), 'stone');
      for (let k = 0; k < 10; k++) parts.push({ x: st.tx, y: st.ty, vx: rnd(-110, 110), vy: rnd(-160, -30), life: rnd(.3, .6), max: .6, col: k % 2 ? '#8d8193' : '#5d5266', sz: rnd(2, 4), g: 600 });
      parts.push({ ring: true, rock: true, x: st.tx, y: st.ty, r: R, life: .3, max: .3 });
      shake = Math.max(shake, .06);
    }
  }
  stones = stones.filter(s => !s.done);
}

function updFx(dt) {
  for (const p of parts) {
    p.life -= dt;
    if (p.ghost) { p.y += p.vy * dt; continue; }
    if (p.ring) continue;
    p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts) { t.life -= dt; t.y -= 26 * dt; }
  texts = texts.filter(t => t.life > 0);
  if (parts.length > 600) parts.splice(0, parts.length - 600);
}

function spark(x, y, col, n) {
  for (let k = 0; k < n; k++) parts.push({ x, y, vx: rnd(-50, 50), vy: rnd(-90, -10), life: rnd(.2, .45), max: .45, col, sz: rnd(1.5, 3), g: 500 });
}

function update(dt) {
  time += dt;
  if (lordLaugh > 0) lordLaugh -= dt;
  if (shake > 0) shake -= dt;
  updTraps(dt);
  if (phase === 'wave') {
    waveT += dt;
    while (spawnQ.length && spawnQ[0].t <= waveT) spawnHero(spawnQ.shift().type);
    for (const h of heroes) if (!h.dead) updHero(h, dt);
    heroes = heroes.filter(h => !h.dead);
    updArrows(dt);
    updStones(dt);
    if (!spawnQ.length && !heroes.length) endWave();
  }
  updFx(dt);
}

// ================= Rendering =================
const cv = document.getElementById('game');
const mainC = cv.getContext('2d');
// Die Welt wird in niedriger Auflösung gezeichnet (1 Pixel = PIX Welt-Einheiten),
// auf die feste Palette reduziert (mit Bayer-Dithering statt Verläufen) und pixelgenau hochskaliert.
const PIX = 2;
const off = document.createElement('canvas');
const oc = off.getContext('2d', { willReadFrequently: true });
let c = oc;
let dpr = 1, cssW = 0, cssH = 0, scale = 1, viewW = 800;

const PAL = ['#1a1020', '#3a3a4a', '#6e6e82', '#a8a8b8', '#e0e0ec', '#ffffff', '#6cb4ff', '#a8d8ff',
  '#1e7a1e', '#3cb043', '#8be04a', '#c8f07a', '#6b3a1a', '#a8581c', '#e0903c', '#f8c890',
  '#7a2fb0', '#c080ff', '#e8303a', '#9a1a24', '#ffd02a', '#ff8a1a', '#b86a00', '#2f64d8', '#7fe0ff', '#ffc8a0'];
const PAL_RGB = PAL.map(h => [1, 3, 5].map(k => parseInt(h.slice(k, k + 2), 16)));
const LUT = new Uint8Array(32768);
for (let q = 0; q < 32768; q++) {
  const r = (q >> 10) * 8 + 4, g = ((q >> 5) & 31) * 8 + 4, b = (q & 31) * 8 + 4;
  let best = 0, bd = 1e9;
  PAL_RGB.forEach(([pr, pg, pb], k) => { const d = 3 * (r - pr) ** 2 + 4 * (g - pg) ** 2 + 2 * (b - pb) ** 2; if (d < bd) { bd = d; best = k; } });
  LUT[q] = best;
}
const DITH = 30, BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v / 16 - .5) * DITH);
function quantize(ctx, w, h) {
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  for (let y = 0, i = 0; y < h; y++) {
    const row = (y & 3) * 4;
    for (let x = 0; x < w; x++, i += 4) {
      if (d[i + 3] < 128) { d[i + 3] = 0; continue; }
      const e = PAL_RGB[LUT[(d[i] >> 3) << 10 | (d[i + 1] >> 3) << 5 | (d[i + 2] >> 3)]];
      if (Math.abs(e[0] - d[i]) + Math.abs(e[1] - d[i + 1]) + Math.abs(e[2] - d[i + 2]) < 10) { d[i] = e[0]; d[i + 1] = e[1]; d[i + 2] = e[2]; d[i + 3] = 255; continue; }
      const t = BAYER[row + (x & 3)];
      const r = clamp(d[i] + t, 0, 255), g = clamp(d[i + 1] + t, 0, 255), b = clamp(d[i + 2] + t, 0, 255);
      const p = PAL_RGB[LUT[(r >> 3) << 10 | (g >> 3) << 5 | (b >> 3)]];
      d[i] = p[0]; d[i + 1] = p[1]; d[i + 2] = p[2]; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

// 8x8-Pixel-Icons für die Oberfläche

function resize() {

  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cssW = r.width; cssH = r.height;
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  scale = cssH / H;
  viewW = cssW / scale;
  off.width = Math.ceil(viewW / PIX) + 1; off.height = H / PIX;
  clampCam();
}
function clampCam() { camX = clamp(camX, 0, Math.max(0, WORLD_W - viewW)); }

// Parallax-Berge (deterministisch)
// Hintergrund: heller Tag mit Wolken, runden Hügeln und Büschen (je eigene Parallax-Ebene)
const CLOUDS = Array.from({ length: 8 }, (_, k) => [k * 300 + (k * 97) % 140, 40 + (k * 53) % 80, 1 + (k % 3)]);
const HILLS = Array.from({ length: 7 }, (_, k) => [k * 230 + (k * 61) % 90, 70 + (k * 37) % 60]);
const BUSHES = Array.from({ length: 10 }, (_, k) => [k * 170 + (k * 83) % 70, 2 + (k % 3)]);
const wrap = (x, span) => ((x % span) + span) % span;

function drawBg() {
  const g = c.createLinearGradient(0, 0, 0, GY);
  g.addColorStop(0, '#6cb4ff'); g.addColorStop(1, '#a8d8ff');
  c.fillStyle = g; c.fillRect(0, 0, viewW + 4, H);
  // Wolken
  for (const [x, y, n] of CLOUDS) {
    const cx = wrap(x - camX * .08 - time * 6, 2400) - 200;
    if (cx < -200 || cx > viewW + 200) continue;
    cloud(cx, y, n);
  }
  // Hügel
  for (const [x, r] of HILLS) {
    const hx = wrap(x - camX * .25, 1610) - 250;
    if (hx < -r - 20 || hx > viewW + r + 20) continue;
    c.fillStyle = '#1e7a1e'; c.beginPath(); c.arc(hx, GY + 10, r + 3, Math.PI, 0); c.fill();
    c.fillStyle = '#8be04a'; c.beginPath(); c.arc(hx, GY + 10, r, Math.PI, 0); c.fill();
    c.fillStyle = '#c8f07a'; c.beginPath(); c.arc(hx - r * .35, GY + 10 - r * .55, r * .18, 0, 7); c.fill();
    c.fillStyle = '#3cb043'; for (let k = 0; k < 3; k++) c.fillRect(hx - r * .4 + k * r * .35, GY - r * .35 + (k % 2) * 14, 8, 3);
  }
  // Büsche
  for (const [x, n] of BUSHES) {
    const bx = wrap(x - camX * .55, 1700) - 150;
    if (bx < -120 || bx > viewW + 120) continue;
    bush(bx, GY + 2, n);
  }
}
function cloud(x, y, n) {
  const parts = [[0, 0, 16]]; for (let k = 1; k <= n; k++) parts.push([k * 20, -8 * (k % 2), 20], [-k * 18, 2, 14]);
  c.fillStyle = '#1a1020'; for (const [dx, dy, r] of parts) { c.beginPath(); c.arc(x + dx, y + dy, r + 2, 0, 7); c.fill(); }
  c.fillStyle = '#ffffff'; for (const [dx, dy, r] of parts) { c.beginPath(); c.arc(x + dx, y + dy, r, 0, 7); c.fill(); }
  c.fillStyle = '#a8d8ff'; c.fillRect(x - n * 18 - 8, y + 10, n * 38 + 20, 6);
}
function bush(x, y, n) {
  const parts = []; for (let k = 0; k < n; k++) parts.push([k * 22 - n * 11, k % 2 ? -18 : -12, k % 2 ? 18 : 15]);
  c.fillStyle = '#1a1020'; for (const [dx, dy, r] of parts) { c.beginPath(); c.arc(x + dx, y + dy, r + 2, Math.PI, 0); c.fill(); }
  c.fillStyle = '#3cb043'; for (const [dx, dy, r] of parts) { c.beginPath(); c.arc(x + dx, y + dy, r, Math.PI, 0); c.fill(); }
  c.fillStyle = '#8be04a'; for (const [dx, dy, r] of parts) c.fillRect(x + dx - r * .5, y + dy - r * .6, 6, 4);
}

function drawGround(x0, x1) {
  // Erde mit Ziegelmuster
  c.fillStyle = '#a8581c'; c.fillRect(x0, GY, x1 - x0, H - GY);
  c.fillStyle = '#6b3a1a';
  const top = GY + 12;
  for (let row = 0; top + row * 16 < H; row++) {
    const y = top + row * 16;
    c.fillRect(x0, y, x1 - x0, 2);
    const off = row % 2 ? 12 : 0;
    for (let x = Math.floor((x0 - off) / 24) * 24 + off; x < x1; x += 24) c.fillRect(x, y, 2, 16);
  }
  c.fillStyle = '#e0903c';
  for (let row = 0; top + row * 16 < H; row++) {
    const y = top + row * 16 + 2, off = row % 2 ? 12 : 0;
    for (let x = Math.floor((x0 - off) / 24) * 24 + off; x < x1; x += 24) c.fillRect(x + 2, y, 20, 2);
  }
  // Gras
  c.fillStyle = '#1e7a1e'; c.fillRect(x0, GY, x1 - x0, 12);
  c.fillStyle = '#3cb043'; c.fillRect(x0, GY, x1 - x0, 9);

}

// layer 0 = hinter den Helden, 1 = davor
function drawTrap(tr, x, layer) {
  const st = stat(tr), lv = tr.lvl;
  switch (tr.type) {
    case 'spikes': if (layer) return;
      c.fillStyle = '#3b3440'; c.fillRect(x + 2, GY - 4, 44, 5);
      c.fillStyle = lv === 1 ? '#aeb4bd' : lv === 2 ? '#e2e6ee' : '#d8dde6';
      for (let k = 0; k < 5; k++) { const sx = x + 5 + k * 8.4, hgt = 12 + lv * 3; c.beginPath(); c.moveTo(sx, GY - 3); c.lineTo(sx + 4, GY - 3 - hgt); c.lineTo(sx + 8, GY - 3); c.fill(); }
      if (lv === 3) { c.fillStyle = '#b3202e'; for (let k = 0; k < 5; k++) { const sx = x + 5 + k * 8.4; c.beginPath(); c.moveTo(sx + 2.6, GY - 13); c.lineTo(sx + 4, GY - 18); c.lineTo(sx + 5.4, GY - 13); c.fill(); } }
      break;
    case 'pit': if (layer) return; {
      const lp = trapAt(tr.i - 1), rp = trapAt(tr.i + 1);
      const lo = lp && lp.type === 'pit', ro = rp && rp.type === 'pit';
      const g = c.createLinearGradient(0, GY, 0, H); g.addColorStop(0, '#0b0510'); g.addColorStop(1, '#000');
      c.fillStyle = g; c.fillRect(x, GY, TILE, H - GY);
      c.fillStyle = '#1a1020'; if (!lo) c.fillRect(x, GY, 4, H - GY); if (!ro) c.fillRect(x + TILE - 4, GY, 4, H - GY);
      c.fillStyle = '#4b4050';
      for (let k = 0; k < 4; k++) { const sx = x + 4 + k * 10; c.beginPath(); c.moveTo(sx, H); c.lineTo(sx + 5, H - 16); c.lineTo(sx + 10, H); c.fill(); }
      if (tr.fill > 0) { // Heldenhaufen füllt die Grube
        const f = Math.min(1, tr.fill / st.cap), top = H - (H - GY) * f;
        c.fillStyle = '#4a3f5a'; c.fillRect(x, top, TILE, H - top);
        c.fillStyle = '#d9d2c4';
        for (let k = 0; k < tr.fill; k++) { const bx = x + 6 + (k * 17) % 36, by = top + 4 + (k * 11) % Math.max(4, H - top - 6); c.beginPath(); c.arc(bx, by, 2.6, 0, 7); c.fill(); c.fillRect(bx + 2, by - .6, 6, 1.4); }
        if (f >= 1) { c.fillStyle = '#3cb043'; c.fillRect(x, GY, TILE, 3); }
      }
      if (lv > 1 && tr.fill < st.cap) { // Tarnung: für Spieler halb sichtbar
        c.fillStyle = lv === 2 ? 'rgba(60,176,67,.45)' : 'rgba(60,176,67,.75)';
        c.fillRect(x, GY, TILE, 5);
        c.strokeStyle = 'rgba(120,160,90,.6)'; c.lineWidth = 1.5;
        for (let k = 0; k < 6; k++) { c.beginPath(); c.moveTo(x + k * 8 + 2, GY + 1); c.lineTo(x + k * 8 + 6, GY - 5); c.stroke(); }
      }
    } break;
    case 'frost': if (layer) return; {
      const p = .6 + .4 * Math.sin(time * 3 + tr.i);
      const g = c.createRadialGradient(x + 24, GY - 2, 2, x + 24, GY - 2, 30);
      g.addColorStop(0, `rgba(160,235,255,${.5 * p})`); g.addColorStop(1, 'rgba(160,235,255,0)');
      c.fillStyle = g; c.fillRect(x - 8, GY - 30, 64, 36);
      c.strokeStyle = lv === 3 ? '#e8fbff' : '#8fe3ff'; c.lineWidth = 2;
      c.beginPath(); c.ellipse(x + 24, GY - 1, 18, 4, 0, 0, 7); c.stroke();
      for (let k = 0; k < 3 + lv; k++) {
        const a = time * .8 + k * 2.1 + tr.i;
        c.fillStyle = 'rgba(220,250,255,.8)';
        c.fillRect(x + 24 + Math.cos(a) * 16, GY - 6 - ((time * 18 + k * 9) % 26), 2, 2);
      }
    } break;
    case 'spring': if (layer) return; {
      const up = tr.anim > 0 ? tr.anim / .35 : 0;
      c.fillStyle = '#5a3a20'; c.fillRect(x + 4, GY - 6, 40, 7);
      c.strokeStyle = '#c9ced6'; c.lineWidth = 2; c.beginPath();
      for (let k = 0; k <= 6; k++) c.lineTo(x + 24 + (k % 2 ? 6 : -6), GY - 6 - k * (2 + up * 3));
      c.stroke();
      c.save(); c.translate(x + 8, GY - 8 - up * 16); c.rotate(-up * .6);
      c.fillStyle = lv === 3 ? '#e8a84a' : '#b8742e'; c.fillRect(0, -4, 34, 5);
      c.restore();
      if (tr.cd > 0 && phase === 'wave') { c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(x + 8, GY + 4, 32, 3); c.fillStyle = '#ffd24a'; c.fillRect(x + 8, GY + 4, 32 * (1 - tr.cd / st.cd), 3); }
    } break;
    case 'wall': if (layer) return; {
      x -= 6; // Palisade steht am linken Feldrand
      if (tr.hp <= 0) {
        c.fillStyle = '#5a3a20';
        for (let k = 0; k < 5; k++) { c.save(); c.translate(x + 8 + k * 7, GY - 3); c.rotate(k * .7); c.fillRect(-6, -2, 12, 4); c.restore(); }
        break;
      }
      const hx = tr.hit > 0 ? rnd(-1.2, 1.2) : 0;
      const col = lv === 3 ? '#77767c' : '#8a5a2b', dark = lv === 3 ? '#4c4b52' : '#5a3a20';
      for (let k = 0; k < 4; k++) {
        const sx = x + 8 + k * 8 + hx, top = GY - WALL_H + (k % 2) * 6;
        c.fillStyle = col; c.fillRect(sx, top + 6, 8, GY - top - 6);
        c.fillStyle = dark; c.fillRect(sx + 6, top + 6, 2, GY - top - 6);
        c.fillStyle = col; c.beginPath(); c.moveTo(sx, top + 6); c.lineTo(sx + 4, top); c.lineTo(sx + 8, top + 6); c.fill();
      }
      if (lv >= 2) { c.fillStyle = '#3d3d44'; c.fillRect(x + 6 + hx, GY - 80, 36, 5); c.fillRect(x + 6 + hx, GY - 30, 36, 5); }
      const r = tr.hp / tr.max;
      if (r < .66) { c.strokeStyle = '#1a0f08'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x + 14, GY - 70); c.lineTo(x + 20, GY - 55); c.lineTo(x + 16, GY - 44); c.stroke(); }
      if (r < .33) { c.beginPath(); c.moveTo(x + 32, GY - 50); c.lineTo(x + 28, GY - 34); c.lineTo(x + 34, GY - 20); c.stroke(); }
      if (phase === 'wave' && r < 1) hpBar(x + 24, GY - WALL_H - 10, 34, r, '#ffb13d');
    } break;
    case 'flame': {
      const on = dangerAt(tr, tr.t), ph = tr.t % FLAME_P, warm = ph > FLAME_P - .5;
      if (!layer) {
        c.fillStyle = '#4a4550'; c.fillRect(x + 10, GY - 10, 28, 11);
        c.fillStyle = '#2a262e'; c.fillRect(x + 14, GY - 13, 20, 4);
        c.fillStyle = lv === 3 ? '#ffd24a' : lv === 2 ? '#ff9a3d' : '#b35a20'; c.fillRect(x + 12, GY - 6, 24, 2);
        if (warm) spark(x + 24 + rnd(-8, 8), GY - 12, '#ffb13d', Math.random() < .3 ? 1 : 0);
        return;
      }
      if (!on) return;
      const k = Math.min(1, ph / .12, (FLAME_ON - ph) / .12);
      const hgt = 170 * k;
      for (let q = 0; q < 3; q++) {
        const w = (18 - q * 5) + Math.sin(time * 30 + q) * 3;
        const g = c.createLinearGradient(0, GY - 12, 0, GY - 12 - hgt);
        g.addColorStop(0, ['rgba(255,90,20,.85)', 'rgba(255,170,40,.9)', 'rgba(255,245,180,.95)'][q]);
        g.addColorStop(1, 'rgba(255,60,20,0)');
        c.fillStyle = g; c.beginPath(); c.moveTo(x + 24 - w, GY - 12);
        c.quadraticCurveTo(x + 24 - w * 1.2 + Math.sin(time * 20 + q) * 4, GY - 12 - hgt * .5, x + 24 + Math.sin(time * 15 + q) * 5, GY - 12 - hgt);
        c.quadraticCurveTo(x + 24 + w * 1.2 + Math.cos(time * 22 + q) * 4, GY - 12 - hgt * .5, x + 24 + w, GY - 12); c.fill();
      }
    } break;
    case 'crusher': {
      const by = crushY(tr);
      if (!layer) {
        c.fillStyle = '#3a3440'; c.fillRect(x + 1, GY - 180, 6, 180); c.fillRect(x + 41, GY - 180, 6, 180);
        c.fillStyle = '#4c4552'; c.fillRect(x - 2, GY - 186, 52, 10);
        return;
      }
      c.strokeStyle = '#26222b'; c.lineWidth = 2; c.beginPath(); c.moveTo(x + 18, GY - 176); c.lineTo(x + 18, by); c.moveTo(x + 30, GY - 176); c.lineTo(x + 30, by); c.stroke();
      c.fillStyle = lv === 3 ? '#8c2f2f' : '#6c7480'; c.fillRect(x + 6, by, 36, 26);
      c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(x + 6, by, 36, 4);
      c.fillStyle = '#c9ced6';
      for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(x + 7 + k * 9, by + 26); c.lineTo(x + 11.5 + k * 9, by + 30 + lv); c.lineTo(x + 16 + k * 9, by + 26); c.fill(); }
    } break;
    case 'tower': if (layer) return; {
      c.fillStyle = '#4a4050'; c.fillRect(x + 8, GY - 92, 32, 92);
      c.fillStyle = '#3a3240'; for (let k = 0; k < 4; k++) c.fillRect(x + 8, GY - 80 + k * 20, 32, 2);
      c.fillStyle = '#4a4050'; for (let k = 0; k < 4; k++) c.fillRect(x + 6 + k * 10, GY - 102, 7, 12);
      c.fillStyle = '#12091a'; rr(x + 19, GY - 80, 10, 16, 5); c.fill();
      c.fillStyle = tr.anim > 0 ? '#ffd24a' : '#ff3b3b'; c.fillRect(x + 22, GY - 75, 2, 2); c.fillRect(x + 25, GY - 75, 2, 2);
      c.fillStyle = ['#b33b3b', '#9b3dff', '#ffd24a'][lv - 1];
      c.fillRect(x + 23, GY - 124, 2, 22);
      c.beginPath(); c.moveTo(x + 25, GY - 124); c.lineTo(x + 38, GY - 119 + Math.sin(time * 5) * 2); c.lineTo(x + 25, GY - 114); c.fill();
    } break;
  }
}

function hpBar(cx, y, w, r, col) {
  c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(cx - w / 2 - 1, y - 1, w + 2, 5);
  c.fillStyle = col; c.fillRect(cx - w / 2, y, w * clamp(r, 0, 1), 3);
}

function drawHero(h) {
  const d = h.def, s = d.s;
  c.save();
  c.translate(h.x, h.y);
  if (h.st === 'air' && h.knock) { c.translate(0, -14 * s); c.rotate(-h.spin); c.translate(0, 14 * s); }
  if (h.st === 'fall') c.rotate(Math.sin(h.fallT * 25) * .4);
  c.scale(s, s);
  const moving = h.st === 'run' && !h.waiting && !h.blocked && !h.halted;
  const lg = moving ? Math.sin(h.anim * .25) * 5 : h.st === 'air' ? 3 : 0;
  const body = h.flash > 0 ? '#fff' : d.col;
  if (d.float) {
    const g = c.createRadialGradient(0, 14, 1, 0, 14, 14);
    g.addColorStop(0, 'rgba(190,120,255,.6)'); g.addColorStop(1, 'rgba(190,120,255,0)');
    c.fillStyle = g; c.fillRect(-14, 4, 28, 20);
  } else {
    c.strokeStyle = '#2a2030'; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-2, -9); c.lineTo(-2 + lg, 0); c.moveTo(2, -9); c.lineTo(2 - lg, 0); c.stroke();
  }
  if (d.boss) { c.fillStyle = '#a3222c'; c.beginPath(); c.moveTo(-4, -20); c.lineTo(-11 - (moving ? Math.sin(h.anim * .2) * 2 : 0), -3); c.lineTo(-2, -6); c.fill(); }
  c.fillStyle = body;
  if (d.float || d.heal) { c.beginPath(); c.moveTo(-7, d.float ? 4 : -2); c.lineTo(7, d.float ? 4 : -2); c.lineTo(5, -20); c.lineTo(-5, -20); c.closePath(); c.fill(); }
  else { rr(-5, -20, 10, 12, 2); c.fill(); }
  if (h.slowT > 0) { c.fillStyle = 'rgba(140,220,255,.45)'; rr(-6, -21, 12, 14, 2); c.fill(); }
  // Kopf
  c.fillStyle = '#f1c7a0'; c.beginPath(); c.arc(0, -24.5, 4.5, 0, 7); c.fill();
  switch (h.type) {
    case 'squire':
      c.fillStyle = '#8a94a0'; c.beginPath(); c.arc(0, -25.5, 5, Math.PI, 0); c.fill();
      c.fillStyle = '#6b4a2a'; c.fillRect(-5, -12, 10, 2);
      c.strokeStyle = '#c9ced6'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(5, -14); c.lineTo(11, -20); c.stroke();
      break;
    case 'rogue':
      c.fillStyle = '#1f6a3c'; c.beginPath(); c.moveTo(-5.5, -22); c.lineTo(0, -32); c.lineTo(5.5, -24); c.lineTo(3, -27); c.lineTo(-4, -26); c.fill();
      c.fillStyle = '#12091a'; c.fillRect(-1, -25.5, 5, 1.5);
      c.strokeStyle = '#e2e6ee'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(5, -13); c.lineTo(9, -16); c.stroke();
      break;
    case 'knight':
      c.fillStyle = '#8a94a0'; rr(-5.5, -31, 11, 11, 2); c.fill();
      c.fillStyle = '#20182a'; c.fillRect(-1, -27, 6, 1.6);
      c.fillStyle = '#c33'; c.fillRect(-1, -35, 2, 5);
      c.fillStyle = '#e8e8e8'; rr(3, -19, 6, 10, 2); c.fill();
      c.fillStyle = '#c33'; c.fillRect(5.3, -18, 1.4, 8); c.fillRect(3.5, -15, 5, 1.4);
      break;
    case 'cleric':
      c.fillStyle = '#fff'; c.beginPath(); c.arc(0, -25, 5.2, Math.PI * .9, Math.PI * 2.1); c.fill();
      c.fillStyle = '#d4a52a'; c.fillRect(-5, -13, 10, 1.6);
      c.strokeStyle = '#8a6a3a'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(7, 0); c.lineTo(7, -26); c.stroke();
      c.fillStyle = `rgba(255,230,120,${.6 + .4 * Math.sin(time * 5)})`; c.beginPath(); c.arc(7, -28, 2.6, 0, 7); c.fill();
      break;
    case 'mage':
      c.fillStyle = '#5b2f9a'; c.beginPath(); c.moveTo(-7, -26); c.lineTo(7, -26); c.lineTo(3, -40); c.lineTo(-1, -34); c.closePath(); c.fill();
      c.fillStyle = '#ffd24a'; c.fillRect(-6, -27, 12, 1.5);
      c.strokeStyle = '#6b4a2a'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(8, 2); c.lineTo(8, -24); c.stroke();
      c.fillStyle = '#c38bff'; c.beginPath(); c.arc(8, -26, 2.8, 0, 7); c.fill();
      break;
    case 'paladin':
      c.fillStyle = '#e2b53a'; rr(-5.5, -31, 11, 11, 2); c.fill();
      c.fillStyle = '#20182a'; c.fillRect(-1, -27, 6, 1.6);
      c.fillStyle = '#c33'; c.beginPath(); c.moveTo(-2, -31); c.quadraticCurveTo(-8, -40, -12, -32); c.lineTo(-2, -29); c.fill();
      c.strokeStyle = '#eef'; c.lineWidth = 2; c.beginPath(); c.moveTo(6, -12); c.lineTo(6 + (h.blocked ? Math.sin(time * 14) * 4 : 0) + 4, -30); c.stroke();
      break;
  }
  c.restore();
  if (h.hp < h.max && h.st !== 'fall') hpBar(h.x, h.y - 38 * s, d.boss ? 30 : 16, h.hp / h.max, d.boss ? '#ffd24a' : '#6ee07a');
}

function draw() {
  c = oc;
  const k = 1 / PIX;
  const sx = shake > 0 ? Math.round(rnd(-3, 3) * shake * 6) : 0, sy = shake > 0 ? Math.round(rnd(-2, 2) * shake * 6) : 0;
  c.setTransform(k, 0, 0, k, sx, sy);
  drawBg();
  c.setTransform(k, 0, 0, k, -Math.round(camX * k) + sx, sy);
  const x0 = camX - 10, x1 = camX + viewW + 10;
  drawGround(x0, x1);
  drawPortal();
  drawCastle();

  // Bauraster
  if (phase === 'build') {
    for (let i = Math.max(BUILD_MIN, tileAt(x0)); i <= Math.min(BUILD_MAX, tileAt(x1)); i++) {
      const x = i * TILE, tr = S.grid[i];
      if (selType && !tr) { c.fillStyle = S.gold >= TRAPS[selType].cost ? 'rgba(110,224,122,.22)' : 'rgba(255,90,90,.18)'; c.fillRect(x + 2, GY + 6, TILE - 4, 14); }
      c.fillStyle = 'rgba(255,255,255,.13)'; c.fillRect(x, GY + 6, 1, 8);
    }
  }
  const ti0 = Math.max(0, tileAt(x0) - 1), ti1 = Math.min(NT - 1, tileAt(x1) + 1);
  for (let i = ti0; i <= ti1; i++) { const tr = S.grid[i]; if (tr) drawTrap(tr, i * TILE, 0); }
  // Auswahl
  if (selTile >= 0 && S.grid[selTile]) {
    const tr = S.grid[selTile], x = selTile * TILE;
    c.strokeStyle = '#ffd24a'; c.lineWidth = 2; c.setLineDash([5, 4]);
    c.strokeRect(x + 1, GY - 190, TILE - 2, 190 + 24);
    if (tr.type === 'tower') { const R = stat(tr).rng * TILE; c.beginPath(); c.moveTo(x + 24 - R, GY + 10); c.lineTo(x + 24 + R, GY + 10); c.stroke(); c.fillStyle = 'rgba(255,210,74,.08)'; c.fillRect(x + 24 - R, GY - 190, R * 2, 200); }
    c.setLineDash([]);
  }
  for (const h of heroes) if (h.x > x0 - 30 && h.x < x1 + 30) drawHero(h);
  for (let i = ti0; i <= ti1; i++) { const tr = S.grid[i]; if (tr) drawTrap(tr, i * TILE, 1); }
  // Pfeile
  c.strokeStyle = '#e8d9b0'; c.lineWidth = 1.6;
  for (const a of arrows) { const l = Math.hypot(a.vx, a.vy) || 1; c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(a.x - a.vx / l * 9, a.y - a.vy / l * 9); c.stroke(); }
  // Steine des Lords
  for (const st of stones) {
    c.save(); c.translate(st.x, st.y); c.rotate(st.t * 12);
    c.fillStyle = '#6d6275'; c.beginPath(); c.moveTo(-6, -3); c.lineTo(-2, -7); c.lineTo(5, -5); c.lineTo(7, 2); c.lineTo(1, 7); c.lineTo(-6, 4); c.closePath(); c.fill();
    c.fillStyle = '#8d8193'; c.fillRect(-3, -4, 4, 3);
    c.restore();
  }
  // Partikel
  for (const p of parts) {
    const al = clamp(p.life / p.max, 0, 1);
    if (p.ghost) { c.fillStyle = `rgba(230,220,255,${al * .7})`; c.beginPath(); c.arc(p.x, p.y - 8, 5, Math.PI, 0); c.lineTo(p.x + 5, p.y); c.lineTo(p.x - 5, p.y); c.fill(); continue; }
    if (p.ring && p.rock) { c.strokeStyle = `rgba(200,190,210,${al})`; c.lineWidth = 2; c.beginPath(); c.ellipse(p.x, p.y, p.r, p.r * .5, 0, 0, 7); c.stroke(); continue; }
    if (p.ring) { c.strokeStyle = `rgba(150,255,150,${al})`; c.lineWidth = 2; c.beginPath(); c.arc(p.x, p.y, 100 * (1 - al) + 10, 0, 7); c.stroke(); continue; }
    c.globalAlpha = al; c.fillStyle = p.col; c.fillRect(p.x, p.y, p.sz, p.sz); c.globalAlpha = 1;
  }
  c.textAlign = 'center'; c.font = FONT(16);
  for (const t of texts) { c.globalAlpha = clamp(t.life / t.max * 2, 0, 1); c.fillStyle = '#0b0612'; c.fillText(t.txt, t.x + 2, t.y + 2); c.fillStyle = t.col; c.fillText(t.txt, t.x, t.y); }
  c.globalAlpha = 1;

  drawMinimap();
  quantize(oc, off.width, off.height);
  mainC.setTransform(1, 0, 0, 1, 0, 0);
  mainC.imageSmoothingEnabled = false;
  const f = scale * PIX * dpr;
  mainC.drawImage(off, 0, 0, off.width * f, off.height * f);
}

const MM = { x: 8, y: 6, h: 14 }; // in CSS-Pixeln
function drawMinimap() {
  const bk = 1 / (scale * PIX); // CSS-Pixel -> Pufferpixel
  c.setTransform(bk, 0, 0, bk, 0, 0);
  const w = cssW - 16, f = w / WORLD_W;
  c.fillStyle = '#0b0612'; c.fillRect(MM.x - 3, MM.y - 3, w + 6, MM.h + 6);
  c.fillStyle = '#3a2a45'; c.fillRect(MM.x, MM.y + MM.h - 4, w, 4);
  c.fillStyle = '#5a2f7a'; c.fillRect(MM.x + CASTLE_L * f, MM.y, (WORLD_W - CASTLE_L) * f, MM.h);
  for (const tr of S.grid) if (tr) { c.fillStyle = TRAPS[tr.type].col; c.fillRect(MM.x + tr.i * TILE * f, MM.y + MM.h - 7, Math.max(2, TILE * f - 1), 6); }
  for (const h of heroes) { c.fillStyle = h.def.boss ? '#ffd24a' : '#bfe3ff'; c.fillRect(MM.x + h.x * f - 1, MM.y + 2, h.def.boss ? 4 : 2, h.def.boss ? 5 : 4); }
  c.strokeStyle = '#fff4e0'; c.lineWidth = 2; c.strokeRect(MM.x + camX * f, MM.y - 1, viewW * f, MM.h + 2);
  if (phase === 'wave') { // Nachlade-Anzeige für den Steinwurf
    const cx = cssW - 28, cy = cssH - 28, r = stoneT > 0 ? 1 - stoneT / stoneCd() : 1;
    c.fillStyle = 'rgba(0,0,0,.55)'; c.beginPath(); c.arc(cx, cy, 20, 0, 7); c.fill();
    c.strokeStyle = r >= 1 ? '#c38bff' : '#6d5a80'; c.lineWidth = 4; c.beginPath(); c.arc(cx, cy, 17, -Math.PI / 2, -Math.PI / 2 + r * Math.PI * 2); c.stroke();
    c.fillStyle = r >= 1 ? '#bdb2c6' : '#6d6275'; c.beginPath(); c.moveTo(cx - 7, cy - 2); c.lineTo(cx - 2, cy - 8); c.lineTo(cx + 6, cy - 5); c.lineTo(cx + 8, cy + 3); c.lineTo(cx + 1, cy + 8); c.lineTo(cx - 7, cy + 5); c.fill();
  }
}

// Icon-Vorschau für Palette
function drawIcon(canvas, type) {
  const ic = canvas.getContext('2d'), sz = canvas.width;
  const box = { spikes: [-22, 8], pit: [-8, 60], wall: [-110, 6], frost: [-24, 8], spring: [-28, 8], flame: [-150, 6], crusher: [-190, 6], tower: [-128, 6] }[type];
  const hgt = box[1] - box[0], k = Math.min(sz / 60, sz / hgt);
  ic.clearRect(0, 0, sz, sz);
  const saveC = c; // drawTrap nutzt globales c -> kurz umbiegen
  const tr = makeTrap(type, -5, 1, 0, false);
  tr.t = type === 'flame' ? .6 : type === 'crusher' ? 1.4 : 0;
  ic.setTransform(k, 0, 0, k, sz / 2 - 24 * k, -box[0] * k - GY * k + (sz - hgt * k) / 2);
  ic.fillStyle = '#a8581c'; ic.fillRect(-10, GY, 68, 70); ic.fillStyle = '#3cb043'; ic.fillRect(-10, GY, 68, 9);
  swapCtx(ic); drawTrap(tr, 0, 0); drawTrap(tr, 0, 1); swapCtx(saveC);
  ic.setTransform(1, 0, 0, 1, 0, 0); quantize(ic, sz, sz);
}
function swapCtx(x) { c = x; }

// ================= UI =================
const $ = id => document.getElementById(id);
const palette = $('palette');
ORDER.forEach(type => {

  b.addEventListener('click', () => {
    if (phase !== 'build') return;
    selType = selType === type ? null : type;

});
function refreshPalette() {
  for (const b of palette.children) {
    const t = b.dataset.type;
    b.classList.toggle('sel', selType === t);
    b.classList.toggle('poor', S.gold < TRAPS[t].cost);
  }
}

function heroMix(w) {
  const l = planned(w), cnt = {};
  l.forEach(t => cnt[t] = (cnt[t] || 0) + 1);
  return cnt;
}
// Wellen werden einmal ausgewürfelt, damit Vorschau und echte Welle übereinstimmen
let preview = null;
function planned(w) { if (!preview || preview.w !== w) preview = { w, list: waveList(w) }; return preview.list; }
function updateUI() {
  $('gold').textContent = S.gold;
  $('wave').textContent = S.wave;
  $('kills').textContent = phase === 'wave' ? W.kills : S.kills;
  $('leaks').textContent = phase === 'wave' ? W.leaks : S.leaks;
  const build = phase === 'build';
  palette.classList.toggle('hide', !build);
  $('waveinfo').classList.toggle('hide', build);
  $('bStart').classList.toggle('hide', !build);
  if (build) {
    const l = planned(S.wave);
    $('bStart').innerHTML = `<span>Runde ${S.wave}</span><small>${S.retry ? 'Nochmal · ' : ''}${l.length} Helden${l.includes('paladin') ? ' + Boss' : ''}</small>`;
    refreshPalette();
  } else {
    const left = heroes.length + spawnQ.length;
    $('wiText').textContent = `Runde ${S.wave}: noch ${left} von ${waveTotal} Helden · ${W.leaks ? W.leaks + ' durchgekommen' : 'keiner durch'}`;
    $('wiBar').style.width = ((waveTotal - left) / waveTotal * 100) + '%';
  }
  $('lordLv').textContent = lordLevel();
  $('bLord').classList.toggle('pts', lordFree() > 0);
  $('bSpeed').textContent = speed + 'x';
  $('bPause').innerHTML = ico(paused ? 'play' : 'pause');
}

let toastT = 0;
function toast(msg, ms = 1600) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}

function statText(type, lvl) {
  const s = TRAPS[type].lv[lvl - 1];
  switch (type) {
    case 'spikes': return `${s.dps} Schaden/s`;
    case 'pit': return `Fasst ${s.cap} Helden · Tarnung ${Math.round((1 - s.camo) * 100)}%`;
    case 'wall': return `${s.hp} Lebenspunkte`;
    case 'frost': return `Tempo -${Math.round((1 - s.slow) * 100)}% · ${s.dps} Schaden/s`;
    case 'spring': return `Wurf ${s.push} Felder · alle ${s.cd}s`;
    case 'flame': return `${s.dps} Schaden/s (${FLAME_ON}s an, ${(FLAME_P - FLAME_ON).toFixed(1)}s aus)`;
    case 'crusher': return `${s.dmg} Schaden alle ${s.per}s`;
    case 'tower': return `${s.dmg} Schaden · ${s.rate}/s · ${s.rng} Felder`;
  }
}
const upCost = tr => Math.round(TRAPS[tr.type].cost * (tr.lvl === 1 ? .8 : 1.5));
const sellVal = tr => tr.fresh ? tr.spent : Math.floor(tr.spent * .7);

function openPopup(i) {
  selTile = i;
  const tr = S.grid[i], d = TRAPS[tr.type], p = $('popup');
  const build = phase === 'build';
  const canUp = tr.lvl < 3;
  p.innerHTML = `<div class="ph"><b>${d.name}</b><span class="stars">${ico('star').repeat(tr.lvl)}${ico('stard').repeat(3 - tr.lvl)}</span>
      <span class="sp"></span>${infoBtn('pInfo')}<button class="btn alt x" id="pX" aria-label="Schließen">${ico('x')}</button></div>
    <div class="pb">${canUp ? `<button class="btn pri" id="pUp" ${!build || S.gold < upCost(tr) ? 'disabled' : ''}>${ico('up')} ${upCost(tr)} ${ico('coin')}</button>` : '<button class="btn" disabled>Max. Stufe</button>'}
    <button class="btn danger" id="pSell" ${!build ? 'disabled' : ''}>Verkaufen +${sellVal(tr)}</button></div>`;
  p.classList.remove('hide');
  $('pX').onclick = closePopup;
  $('pInfo').onclick = () => showInfo(`${d.name} · Stufe ${tr.lvl}`, `<p>${d.desc}</p><p>${statText(tr.type, tr.lvl)}</p>${canUp ? `<p><span class="gold">Nächste Stufe:</span> ${statText(tr.type, tr.lvl + 1)}</p>` : ''}`, hideCard);
  const up = $('pUp');
  if (up) up.onclick = () => {
    if (phase !== 'build' || S.gold < upCost(tr)) return;
    const cst = upCost(tr); S.gold -= cst; tr.spent += cst; tr.lvl++; resetTrap(tr);
    spark(i * TILE + 24, GY - 20, '#ffd24a', 14);
    save(); updateUI(); openPopup(i);
  };
  $('pSell').onclick = () => {
    if (phase !== 'build') return;
    S.gold += sellVal(tr); S.grid[i] = null;
    spark(i * TILE + 24, GY - 10, '#bbb', 10);
    save(); closePopup(); updateUI();
  };
}
function closePopup() { selTile = -1; $('popup').classList.add('hide'); }

function tapWorld(sx, sy) {
  if (sy < MM.y + MM.h + 10) { camX = (sx - MM.x) / (cssW - 16) * WORLD_W - viewW / 2; clampCam(); return; }
  const wx = camX + sx / scale;
  if (phase === 'wave') { throwStone(wx, sy / scale); return; }
  const i = tileAt(wx);
  if (i < 0 || i >= NT) return;
  const tr = S.grid[i];
  if (tr) { openPopup(i); return; }
  if (phase !== 'build') { closePopup(); return; }
  if (!selType) { closePopup(); if (i >= BUILD_MIN && i <= BUILD_MAX) toast('Wähle unten eine Falle aus'); return; }
  if (i < BUILD_MIN || i > BUILD_MAX) { toast('Hier kann nicht gebaut werden'); return; }
  const d = TRAPS[selType];
  if (S.gold < d.cost) { toast('Zu wenig Gold'); return; }
  S.gold -= d.cost;
  S.grid[i] = makeTrap(selType, i);
  spark(i * TILE + 24, GY - 6, '#d9c8e8', 10);
  closePopup();
  save(); updateUI();
}

// Eingabe: Ziehen = Kamera, Tippen = bauen/auswählen
let drag = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  const r = cv.getBoundingClientRect();
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, cam: camX, moved: false, rx: e.clientX - r.left, ry: e.clientY - r.top };
});
cv.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 8 || Math.abs(e.clientY - drag.y) > 8) drag.moved = true;
  if (drag.moved) {
    if (drag.ry < MM.y + MM.h + 10) { const r = cv.getBoundingClientRect(); camX = (e.clientX - r.left - MM.x) / (cssW - 16) * WORLD_W - viewW / 2; }
    else camX = drag.cam - dx / scale;
    clampCam();
  }
});
cv.addEventListener('pointerup', e => {
  if (!drag || drag.id !== e.pointerId) return;
  if (!drag.moved) tapWorld(drag.rx, drag.ry);
  drag = null;
});
cv.addEventListener('pointercancel', () => drag = null);
cv.addEventListener('wheel', e => { camX += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY); clampCam(); e.preventDefault(); }, { passive: false });
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'd') camX += 60;
  if (e.key === 'ArrowLeft' || e.key === 'a') camX -= 60;
  if (e.key === ' ' && phase === 'build' && !menuOpen) startWave();
  clampCam();
});

$('bStart').onclick = () => startWave();
$('bSpeed').onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 3 : 1; updateUI(); };
$('bPause').onclick = () => { paused = !paused; updateUI(); };
$('bMenu').onclick = () => showMenu();
$('bLord').onclick = () => showLord();

// ================= Menüs =================
function showCard(html) { $('card').innerHTML = html; $('overlay').classList.remove('hide'); menuOpen = true; }
function hideCard() { $('overlay').classList.add('hide'); menuOpen = false; }

const HELP = `<ul>
  <li>Du bist der <b>Dunkle Lord</b>. Helden rennen vom Portal (links) zu deinem Schloss (rechts).</li>
  <li>Zwischen den Runden: unten eine Falle wählen, dann auf den Weg tippen. Falle antippen = Upgrade / Verkaufen.</li>
  <li>Wischen verschiebt die Kamera, die Leiste oben zeigt die ganze Strecke.</li>
  <li>Während einer Runde: tippe auf die Strecke, dann wirft der Lord einen Stein. Über den Lord-Knopf oben levelst du ihn auf, sein Fortschritt bleibt dauerhaft.</li>
  <li>Bestanden ist eine Runde, wenn <b>unter 10 %</b> der Helden durchkommen (Bronze). Höchstens 5 % = Silber, keiner = Gold.</li>
  <li>Jede Runde gibt ein festes Budget. Restgold verfällt beim Weiterkommen, die Fallen bleiben stehen.</li>
  <li>Jede 5. Runde kommt ein Paladin als Boss. Danach wird das Feld geräumt und du startest mit großem Budget neu.</li>
  <li>Nicht bestanden? Du wiederholst die Runde und behältst das Gold aus den Kills (in Wiederholungen nur die Hälfte).</li>
  <li>Helden springen über Fallen, die sie erkennen. Schurken springen weit, Ritter kaum. Magier schweben über Bodenfallen. Klerikerinnen heilen.</li>
  <li>Tipp: Kombiniere! Barrikade hinter Stacheln, Katapult vor Flammen, breite Gruben, Frost vor Gruben (verlangsamte Helden springen zu kurz).</li>
</ul>`;

function showStart() {
  const saved = load();
  showCard(`<div class="hrow"><h1>Fallen<span>fürst</span></h1>${infoBtn('mInfo')}</div>
    <div class="row">
      ${saved && (saved.wave > 1 || saved.grid.some(Boolean)) ? `<button class="btn pri" id="mCont">Weiter<small>Runde ${saved.wave}</small></button><button class="btn alt" id="mNew">Neues Spiel</button>` : `<button class="btn pri" id="mNew">Spielen</button>`}
    </div>`);
  $('mInfo').onclick = () => showInfo('So wird gespielt', '<p>Dutzende Helden stürmen auf dein Schloss zu. Stell Fallen auf, damit keiner durchkommt.</p>' + HELP, showStart);
  const cont = $('mCont');
  if (cont) cont.onclick = () => { S = saved; begin(); };
  $('mNew').onclick = () => { S = newState(); save(); begin(); };
}
function begin() {
  applyLength(S.wave);
  phase = 'build'; heroes = []; spawnQ = []; arrows = []; parts = []; texts = [];
  selType = null; closePopup(); preview = null;
  camX = 0; clampCam();
  hideCard(); updateUI();
  tryFullscreen();
  if (!S.grid.some(Boolean)) setTimeout(() => toast('Wähle unten eine Falle und tippe auf den Weg', 3000), 300);
}
function tryFullscreen() {
  const el = document.documentElement;
  try {
    if (!document.fullscreenElement && el.requestFullscreen && matchMedia('(pointer:coarse)').matches) {
      el.requestFullscreen().then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {});
    }
  } catch (e) {}
}

function showLord(resume) {
  const wasPaused = resume === undefined ? paused : resume; paused = true;
  const lv = lordLevel(), cur = lordXpFor(lv), nxt = lordXpFor(lv + 1), free = lordFree();
  const rows = Object.entries(LORD_SKILLS).map(([k, sk]) => {
    const l = lord.pts[k], max = l >= LORD_MAX;
    return `<div class="lrow"><div><b>${sk.name}</b> <span class="muted">${l}/${LORD_MAX}</span><br><span class="muted">${sk.txt(l)}${max ? '' : ` > </span><span class="gold">${sk.txt(l + 1)}`}</span></div>
      <button class="btn lup" data-k="${k}" ${!free || max ? 'disabled' : ''}>+</button></div>`;
  }).join('');
  showCard(`<div class="hrow"><h2>Lord · Stufe ${lv} <span class="${free ? 'gold' : 'muted'}" style="font-size:8px">${free} Punkt${free === 1 ? '' : 'e'} frei</span></h2>${infoBtn('mInfo')}</div>
    <div class="bar xp"><i style="width:${Math.min(100, (lord.xp - cur) / (nxt - cur) * 100)}%"></i></div>
    ${rows}
    <div class="row"><button class="btn pri" id="mBack">Zurück</button></div>`);
  document.querySelectorAll('.lup').forEach(b => b.onclick = () => {
    if (lordFree() <= 0 || lord.pts[b.dataset.k] >= LORD_MAX) return;
    lord.pts[b.dataset.k]++; saveLord(); showLord(wasPaused); updateUI();
  });
  $('mBack').onclick = () => { paused = wasPaused; hideCard(); updateUI(); };
  $('mInfo').onclick = () => showInfo('Dunkler Lord', `<p>${lord.xp - cur} / ${nxt - cur} Erfahrung bis Stufe ${lv + 1}. Jeder getötete Held gibt 1 Erfahrung, ein Paladin 10. Jede Stufe gibt einen Punkt.</p>
    <p>In der Runde auf die Strecke tippen: der Lord wirft einen Stein dorthin.</p><p>Der Lord behält alles, auch bei einem neuen Spiel.</p>`, () => showLord(wasPaused));
}

function showMenu(resume) {
  const wasPaused = resume === undefined ? paused : resume; paused = true;
  showCard(`<div class="hrow"><h2>Pause</h2>${infoBtn('mInfo')}</div>
    <div class="res"><span>Runde</span><b>${S.wave}</b><span>Helden getötet (gesamt)</span><b>${S.kills}</b><span>Durchgekommen (gesamt)</span><b>${S.leaks}</b><span>Sterne</span><b>${Object.values(S.stars).reduce((a, b) => a + b, 0)} / ${(S.wave - 1) * 3}</b></div>
    <div class="row"><button class="btn pri" id="mRes">Weiter</button><button class="btn alt" id="mNew">Neues Spiel</button></div>`);
  $('mInfo').onclick = () => showInfo('So wird gespielt', HELP, () => showMenu(wasPaused));
  $('mRes').onclick = () => { paused = wasPaused; hideCard(); updateUI(); };
  // Zweistufige Bestätigung im Spiel statt confirm()
  $('mNew').onclick = e => {
    const b = e.currentTarget;
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.innerHTML = 'Wirklich?<small>Fortschritt weg</small>'; b.classList.add('danger'); return; }
    paused = false; S = newState(); save(); begin();
  };
}

const STAR_NAMES = ['', 'Bronze', 'Silber', 'Gold'];
// Erklärungen stehen nicht mehr in den Fenstern, sondern hinter einem kleinen i-Knopf
const infoBtn = id => `<button class="btn alt ibtn" id="${id}" aria-label="Info">i</button>`;
function showInfo(title, html, back) {
  showCard(`<h2>${title}</h2>${html}<div class="row"><button class="btn pri" id="mInfoBack">Zurück</button></div>`);
  $('mInfoBack').onclick = back;
}
const HERO_INFO = { rogue: 'schnell und springt sehr weit.', knight: 'gepanzert, langsam, springt kaum.', cleric: 'heilt Helden in der Nähe.', mage: 'schwebt über Bodenfallen. Nur Flammen, Stampfer, Türme, Frost und Barrikaden wirken.' };
function starRow(n) { return `<span class="stars">${ico('star').repeat(n)}${ico('stard').repeat(3 - n)}</span>`; }
function showResult(w, stars) {
  const passed = stars > 0;
  const next = heroMix(S.wave);
  const names = Object.entries(next).map(([t, n]) => `${n}× ${HT[t].name}`).join(', ');
  const newTypes = passed && { 2: 'rogue', 3: 'knight', 4: 'cleric', 5: 'mage' }[S.wave];
  const pct = Math.round(W.leaks / waveTotal * 100);
  showCard(`<div class="hrow"><h2>Runde ${w} ${passed ? 'bestanden' : 'nicht bestanden'}</h2>${infoBtn('mInfo')}</div>
    <div class="big ${passed ? '' : 'bad'}" style="color:${['', 'var(--brick)', 'var(--stone)', 'var(--goldD)'][stars]}">${starRow(stars)} ${passed ? STAR_NAMES[stars] : ''}</div>
    <div class="res">
      <span>Durchgekommen</span><b class="${W.leaks ? 'bad' : 'good'}">${W.leaks} von ${waveTotal} (${pct} %)</b>
      <span>Getötet</span><b>${W.kills}</b>
      ${passed ? `<span>Budget für Runde ${S.wave}</span><b class="gold">${S.gold}</b>` : `<span>Gold durch Kills${S.retry > 1 ? ' (halbiert)' : ''}</span><b class="gold">+${W.gold}</b>`}
    </div>
    <p><b>${passed ? 'Nächste Runde' : 'Nochmal'}:</b> ${names}</p>
    <div class="tags">${newTypes ? `<span class="tag">Neu: ${HT[newTypes].name}</span>` : ''}${next.paladin ? '<span class="tag b">Bossrunde</span>' : ''}${lordFree() ? `<span class="tag l">Lord: ${lordFree()} Punkt${lordFree() === 1 ? '' : 'e'} frei</span>` : ''}</div>
    <div class="row"><button class="btn pri" id="mOk">Fallen bauen</button></div>`);
  $('mOk').onclick = () => { hideCard(); updateUI(); };
  $('mInfo').onclick = () => showInfo('Runde ' + w, `<p>${passed
      ? (isBoss(w) ? 'Boss besiegt! Das Feld wird geräumt, du baust mit einem großen Budget neu auf.' : `Restgold verfällt, deine Fallen bleiben stehen.${roadTiles(S.wave) > roadTiles(w) ? ' Die Strecke wird länger.' : ''}`)
      : 'Bestanden ist die Runde erst unter 10 % Durchbrüchen. Dein Gold behältst du, in Wiederholungen gibt es aber nur halbes Gold pro Kill.'}</p>
    <p>Bronze: unter 10 % · Silber: höchstens 5 % · Gold: keiner durch</p>
    ${newTypes ? `<p>Neu: ${HT[newTypes].name} - ${HERO_INFO[newTypes]}</p>` : ''}
    ${next.paladin ? `<p>Bossrunde: ${next.paladin > 1 ? next.paladin + ' Paladine kommen' : 'Ein Paladin kommt'}. Er klettert sogar aus Gruben. Danach wird das Feld geräumt.</p>` : ''}`, () => showResult(w, stars));
}

// ================= Loop =================
let last = performance.now(), uiT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!paused && !menuOpen) for (let k = 0; k < speed; k++) update(dt);
  else if (menuOpen && phase === 'build') update(dt * .5);
  draw();
  uiT -= dt;
  if (uiT <= 0) { uiT = .15; if (S) updateUI(); }
  requestAnimationFrame(frame);
}

window.addEventListener('resize', () => setTimeout(resize, 50));
S = load() || newState();
applyLength(S.wave);
resize();
ORDER.forEach((t, k) => drawIcon(palette.children[k].querySelector('canvas'), t));
updateUI();
showStart();
requestAnimationFrame(frame);

// für automatisierte Tests
window.__game = { get S() { return S; }, set S(v) { S = v; }, get phase() { return phase; }, get heroes() { return heroes; },
  get W() { return W; }, startWave, update, place: (t, i) => { S.grid[i] = makeTrap(t, i); }, begin, hideCard };
})();
</script>
</body>
</html>
