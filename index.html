<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Fallenfürst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Pixel-UI: 8px-Raster, feste Palette (dieselbe wie im Spiel), Blockränder, harte Schatten, keine Verläufe */
:root{
  --ink:#0b0612;--night:#1d1226;--plum:#3a1d4a;--stone:#5b4a6e;--gray:#8d8193;--light:#d8d0e0;--white:#fff4e0;
  --deep:#5a1f7a;--violet:#9b3dff;--lilac:#c38bff;--gold:#ffd24a;--orange:#ff8a1a;--red:#e83b3b;--dred:#8c1f2a;
  --green:#6ee07a;--dgreen:#2f9a58;--ice:#7fe0ff;
  --px:"Press Start 2P",ui-monospace,"Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
html,body{height:100%;background:var(--ink);color:var(--white);font-family:var(--px);font-size:8px;line-height:16px;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:none;font-smooth:never}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
.ico{display:inline-block;width:16px;height:16px;flex:none;background:center/16px 16px no-repeat;image-rendering:pixelated;vertical-align:-4px}
/* Blockrahmen: schwarzer Außenrand, heller Innenrand, harter Schatten */
.box{background:var(--night);border:2px solid var(--ink);box-shadow:inset 0 0 0 2px var(--light),4px 4px 0 var(--ink)}
.btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:8px 16px;
  background:var(--violet);color:var(--white);border:2px solid var(--ink);
  box-shadow:inset -2px -2px 0 var(--deep),inset 2px 2px 0 var(--lilac),2px 2px 0 var(--ink);font-size:8px;line-height:16px}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:inset 2px 2px 0 var(--deep)}
.btn:disabled{background:var(--stone);color:var(--gray);box-shadow:inset -2px -2px 0 var(--plum),inset 2px 2px 0 var(--gray)}
.btn.pri{background:var(--gold);color:var(--ink)!important;box-shadow:inset -2px -2px 0 var(--orange),inset 2px 2px 0 var(--white),2px 2px 0 var(--ink)}
.btn.pri:active{box-shadow:inset 2px 2px 0 var(--orange)}
.btn.alt{background:var(--stone);box-shadow:inset -2px -2px 0 var(--plum),inset 2px 2px 0 var(--gray),2px 2px 0 var(--ink)}
.btn.danger{background:var(--red);box-shadow:inset -2px -2px 0 var(--dred),inset 2px 2px 0 #ff9a8a,2px 2px 0 var(--ink)}
.btn small{font-size:8px;line-height:8px;margin-top:4px;opacity:1}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#top{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--plum);border-bottom:2px solid var(--ink);box-shadow:inset 0 -2px 0 var(--stone);overflow:hidden}
.stat{display:flex;align-items:center;gap:8px;height:24px;padding:0 8px;background:var(--ink);font-size:16px;line-height:16px;white-space:nowrap}
.stat.g{color:var(--gold)}
.stat.r{color:var(--red)}
.sp{flex:1}
.ib{height:32px;min-width:32px;padding:0 8px;flex-direction:row;gap:8px;font-size:8px}
.lordb{position:relative}
.lordb.pts::after{content:'';position:absolute;top:-4px;right:-4px;width:8px;height:8px;background:var(--gold);box-shadow:0 0 0 2px var(--ink)}
#stage{flex:1;position:relative;min-height:0;overflow:hidden;background:var(--ink)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#bottom{height:80px;flex:none;display:flex;align-items:stretch;gap:8px;padding:8px;background:var(--plum);border-top:2px solid var(--ink);box-shadow:inset 0 2px 0 var(--stone)}
#palette{flex:1;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;padding:0 4px 4px 0}
#palette *{touch-action:pan-x}
#palette::-webkit-scrollbar{display:none}
.tb{flex:none;width:80px;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  background:var(--night);border:2px solid var(--ink);box-shadow:inset 0 0 0 2px var(--stone),2px 2px 0 var(--ink);font-size:8px;line-height:8px}
.tb canvas{width:32px;height:32px;image-rendering:pixelated}
.tb .c{color:var(--gold)}
.tb.sel{background:var(--deep);box-shadow:inset 0 0 0 2px var(--gold),2px 2px 0 var(--ink)}
.tb.poor{color:var(--gray)}
.tb.poor .c{color:var(--red)}
.tb.poor canvas{opacity:.5}
#bStart{min-width:176px;font-size:16px;line-height:16px}
#waveinfo{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 8px}
/* Balken aus Blöcken */
.bar{height:16px;background:var(--ink);border:2px solid var(--ink);box-shadow:inset 0 0 0 2px var(--stone);padding:4px}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--orange) 0 6px,transparent 6px 8px)}
.bar.xp i{background:repeating-linear-gradient(90deg,var(--lilac) 0 6px,transparent 6px 8px)}
.hide{display:none!important}
#popup{position:absolute;left:50%;top:32px;transform:translateX(-50%);width:min(400px,calc(100% - 16px));padding:16px;display:flex;flex-direction:column;gap:8px}
#popup .ph{display:flex;align-items:center;gap:8px;font-size:16px;line-height:16px}
#popup .ph .x{width:32px;height:32px;padding:0}
#popup .pd{color:var(--gray)}
#popup .pb{display:flex;gap:8px}
#popup .pb .btn{flex:1;flex-direction:row;gap:8px}
#toast{position:absolute;left:50%;top:32px;transform:translateX(-50%);max-width:calc(100% - 16px);padding:8px 16px;text-align:center;
  background:var(--ink);color:var(--white);border:2px solid var(--gold);box-shadow:4px 4px 0 var(--ink);display:none;pointer-events:none}
#toast.on{display:block}
/* Abdunkeln per Dithering (Schachbrett) statt Transparenz */
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;
  background:repeating-conic-gradient(var(--ink) 0 25%,transparent 0 50%) 0 0/4px 4px}
.card{width:min(512px,100%);max-height:100%;overflow:auto;touch-action:pan-y;padding:16px 24px;display:flex;flex-direction:column;gap:16px}
.card *{touch-action:pan-y}
.card h1{font-size:24px;line-height:32px;color:var(--white);text-shadow:4px 4px 0 var(--deep)}
.card h1 span{color:var(--lilac)}
.card h2{font-size:16px;line-height:24px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.card p{color:var(--light)}
.card ul{color:var(--light);margin-left:16px;display:flex;flex-direction:column;gap:8px}
.card ul li::marker{color:var(--gold);content:'> '}
.card b{color:var(--white);font-weight:normal}
.card .row{display:flex;gap:16px}
.card .row .btn{flex:1;min-height:48px;font-size:16px;line-height:16px}
.res{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:8px;background:var(--ink)}
.res span{color:var(--light)}
.res b{text-align:right}
.big{font-size:16px;line-height:24px;display:flex;align-items:center;gap:8px}
.stars{display:inline-flex;gap:4px}
.stars .ico{width:24px;height:24px;background-size:24px 24px}
.lrow{display:flex;align-items:center;gap:16px;padding-top:16px;border-top:2px solid var(--stone)}
.lrow>div{flex:1}
.muted{color:var(--gray)!important}
.ibtn{width:32px;height:32px;padding:0;font-size:16px;line-height:16px;flex:none}
.hrow{display:flex;align-items:flex-start;gap:16px}
.hrow>:first-child{flex:1}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:4px 8px;background:var(--ink);color:var(--white)}
.tag.b{background:var(--red)}
.tag.l{background:var(--deep)}
.btn.up{flex-direction:row;gap:8px}
.lup{width:48px;height:40px;font-size:16px;flex:none;padding:0}
.card p.legend{color:var(--gray)}
.good{color:var(--green)!important}.bad{color:var(--red)!important}.gold{color:var(--gold)!important}
#rotate{position:fixed;inset:0;z-index:20;background:var(--night);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:24px;font-size:16px;line-height:24px}
#rotate .ico{width:64px;height:64px;background-size:64px 64px;animation:rot 2s steps(4) infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){#rotate .ico{animation:none}}
@media (orientation:portrait){body:not(.forceportrait) #rotate{display:flex}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="stat g" title="Gold"><i class="ico i-coin"></i><span id="gold">0</span></div>
    <div class="stat" title="Runde"><i class="ico i-sword"></i><span id="wave">1</span></div>
    <div class="stat" title="Getötet"><i class="ico i-skull"></i><span id="kills">0</span></div>
    <div class="stat r" title="Durchgekommen"><i class="ico i-run"></i><span id="leaks">0</span></div>
    <div class="sp"></div>
    <button class="btn ib lordb" id="bLord" aria-label="Dunkler Lord"><i class="ico i-lord"></i><span id="lordLv">1</span></button>
    <button class="btn ib alt" id="bSpeed" aria-label="Tempo">1x</button>
    <button class="btn ib alt" id="bPause" aria-label="Pause"><i class="ico i-pause"></i></button>
    <button class="btn ib alt" id="bMenu" aria-label="Menü"><i class="ico i-menu"></i></button>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="toast"></div>
    <div id="popup" class="box hide"></div>
  </div>
  <div id="bottom">
    <div id="palette"></div>
    <div id="waveinfo" class="hide">
      <div id="wiText"></div>
      <div class="bar"><i id="wiBar"></i></div>
    </div>
    <button class="btn pri" id="bStart">Runde 1<small>0 Helden</small></button>
  </div>
</div>
<div id="overlay"><div class="card box" id="card"></div></div>
<div id="rotate">
  <i class="ico i-phone"></i>
  <div>Bitte Handy quer halten</div>
  <button class="btn alt" onclick="document.body.classList.add('forceportrait');window.dispatchEvent(new Event('resize'))">Trotzdem hochkant spielen</button>
</div>

<script>
(() => {
'use strict';

// ================= Grundmaße =================
// Welt aus 16x16-Kacheln, 9 Reihen hoch. Reihe 7 und 8 sind Boden, darüber wird gebaut.
const TS = 16, ROWS = 9, GROUND = 7, NC_MAX = 90, BUILD_MIN = 3;
const G = 900;
const colsFor = w => Math.min(NC_MAX, 30 + (w - 1) * 2);
let NC, CASTLE_C, BUILD_MAX, GOAL_X;
function applyLength(w) { NC = colsFor(w); CASTLE_C = NC - 5; BUILD_MAX = CASTLE_C - 1; GOAL_X = CASTLE_C * TS + 12; }
const SAVE_KEY = 'fallenfuerst_v2';
const FLAME_P = 3.2, FLAME_ON = 1.2;

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ================= Bauteile =================
// place: 'air' = freies Feld über dem Boden, 'floor' = freies Feld mit festem Grund darunter, 'ground' = Bodenfeld
const TOOLS = {
  block:   { name: 'Block', cost: 15, place: 'air', col: '#c0703a', desc: 'Fester Block für Mauern, Treppen und Plattformen. Helden springen drüber oder schlagen ihn kaputt. Wird jede Runde repariert.', lv: [{ hp: 60 }, { hp: 150 }, { hp: 320 }] },
  hole:    { name: 'Loch', cost: 40, place: 'ground', col: '#000000', desc: 'Reißt den Boden auf. Wer reinfällt, ist weg. Gefallene Helden füllen das Loch nach und nach auf.', lv: [{ cap: 3 }, { cap: 5 }, { cap: 8 }] },
  spikes:  { name: 'Stacheln', cost: 30, place: 'floor', col: '#c9c9d9', desc: 'Schaden, solange ein Held drauf steht. Clevere Helden springen drüber.', lv: [{ dps: 40 }, { dps: 65 }, { dps: 100 }] },
  flame:   { name: 'Flammen', cost: 70, place: 'floor', col: '#ff9a2e', desc: 'Feuersäule im Takt, drei Felder hoch. Trifft auch Springer.', lv: [{ dps: 70 }, { dps: 110 }, { dps: 160 }] },
  firebar: { name: 'Feuerstange', cost: 90, place: 'air', col: '#ffd83a', desc: 'Kreisende Feuerkugeln, frei in der Luft platzierbar.', lv: [{ n: 3, dmg: 22, spd: 1.8 }, { n: 4, dmg: 34, spd: 2.1 }, { n: 5, dmg: 50, spd: 2.4 }] },
  thwomp:  { name: 'Stampfer', cost: 100, place: 'air', col: '#7c7c94', desc: 'Kracht herunter, sobald ein Held darunter ist. Unten blockiert er den Weg.', lv: [{ dmg: 120 }, { dmg: 190 }, { dmg: 280 }] },
  cannon:  { name: 'Kanone', cost: 80, place: 'air', col: '#45455a', desc: 'Schießt im Takt Kugeln nach links. Zählt auch als Block.', lv: [{ dmg: 30, per: 3 }, { dmg: 48, per: 2.4 }, { dmg: 72, per: 1.8 }] },
  spring:  { name: 'Katapult', cost: 60, place: 'floor', col: '#e03a3a', desc: 'Schleudert Helden zurück durch deine Fallen.', lv: [{ push: 4, cd: 2.2 }, { push: 5.5, cd: 1.6 }, { push: 7, cd: 1.1 }] },
  crawler: { name: 'Kriecher', cost: 25, place: 'floor', minion: true, col: '#9b4dff', desc: 'Kleiner Gegner, läuft hin und her. Helden können ihn plattspringen.', lv: [{ dmg: 18, spd: 14 }, { dmg: 30, spd: 18 }, { dmg: 45, spd: 22 }] },
  bat:     { name: 'Flatterer', cost: 40, place: 'air', minion: true, col: '#5a2596', desc: 'Fliegt auf und ab und trifft auch Springer. Kann plattgesprungen werden.', lv: [{ dmg: 20, rng: 20 }, { dmg: 32, rng: 28 }, { dmg: 48, rng: 36 }] },
  spiky:   { name: 'Stachi', cost: 45, place: 'floor', minion: true, col: '#8e1f2c', desc: 'Stacheliger Gegner. Wer draufspringt, verletzt sich selbst.', lv: [{ dmg: 28, spd: 10 }, { dmg: 44, spd: 13 }, { dmg: 66, spd: 16 }] },
};
const ORDER = Object.keys(TOOLS);
const stat = t => TOOLS[t.type].lv[t.lvl - 1];

const HT = {
  squire:  { name: 'Knappe', hp: 30, spd: 32, jv: 270, rng: 2.6, skill: .35, gold: 3, dps: 8, w: 10, h: 14 },
  rogue:   { name: 'Schurke', hp: 22, spd: 46, jv: 300, rng: 3.6, skill: .85, gold: 4, dps: 6, w: 10, h: 14 },
  knight:  { name: 'Ritter', hp: 95, spd: 22, jv: 225, rng: 1.7, skill: .25, gold: 7, dps: 16, w: 10, h: 14, armor: .35 },
  cleric:  { name: 'Klerikerin', hp: 40, spd: 28, jv: 265, rng: 2.5, skill: .5, gold: 6, dps: 6, w: 10, h: 14, heal: true },
  mage:    { name: 'Magier', hp: 30, spd: 24, jv: 0, rng: 0, skill: .6, gold: 8, dps: 5, w: 10, h: 14, float: true },
  paladin: { name: 'Paladin', hp: 520, spd: 20, jv: 255, rng: 2.2, skill: .55, gold: 45, dps: 45, w: 18, h: 28, armor: .3, boss: true },
};

// ================= Welten =================
const THEMES = [
  { name: 'Wiese', sky: ['#4f8ee8', '#6aa6f4', '#88bcfc', '#a8d2ff'], top: ['#b4f070', '#62cc4c', '#2e8b3a'], fill: ['#b0682c', '#86481c', '#d08a44'], block: ['#f0b070', '#c8743a', '#7a4418'], pit: '#140c1c' },
  { name: 'Höhle', sky: ['#0e0a18', '#161024', '#1e1630', '#261c3c'], top: ['#a898d8', '#6e5ea4', '#3e3264'], fill: ['#3e3264', '#2a2046', '#56478a'], block: ['#9a8ac8', '#62529a', '#2e2450'], pit: '#05030a' },
  { name: 'Burg', sky: ['#1e0812', '#2c0c1a', '#3c1224', '#4e182c'], top: ['#d0c8e0', '#8e86a6', '#4a4460'], fill: ['#6a6282', '#4a4460', '#847ca0'], block: ['#bab2d0', '#7a7294', '#3e3852'], pit: 'lava' },
];
const themeFor = w => THEMES[Math.floor((w - 1) / 5) % THEMES.length];

// ================= Pixel-Sprites =================
const PC = { k: '#140c1c', w: '#ffffff', l: '#c9c9d9', g: '#7c7c94', d: '#45455a', r: '#e03a3a', R: '#8e1f2c', o: '#ff9a2e', y: '#ffd83a', Y: '#b87a10',
  b: '#3b78e7', B: '#1f3f8a', c: '#7fe0ff', G: '#2e8b3a', e: '#58c84a', n: '#8a5a2b', N: '#4e2f16', s: '#ffd3a8', p: '#9b4dff', P: '#5a2596', v: '#d9a8ff' };
function mkSprite(rows, map = {}) {
  const w = rows[0].length, h = rows.length, cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const x = cv.getContext('2d');
  rows.forEach((row, j) => { for (let i = 0; i < w; i++) { const ch = row[i]; if (ch === '.') continue; const col = map[ch] || PC[ch]; if (col) { x.fillStyle = col; x.fillRect(i, j, 1, 1); } } });
  return cv;
}
function whiteOf(src) {
  const cv = document.createElement('canvas'); cv.width = src.width; cv.height = src.height;
  const x = cv.getContext('2d'); x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height);
  return cv;
}

const HEADS = {
  squire: ['................', '.....kkkkkk.....', '....kllllllk....', '....kglllllk....', '....kkkkkkkk....', '....kssssksk....', '....kssssssk....'],
  rogue:  ['................', '......kkkk......', '.....kGGGGk.....', '....kGGGGGGk....', '....kGssskskG...', '....kGssssskG...', '.....kGsssk.....'],
  knight: ['.......rr.......', '......krrk......', '....kllllllk....', '....klllllllk...', '....klkkkkkkk...', '....klllllllk...', '.....kllllllk...'],
  cleric: ['................', '.....kkkkkk.....', '....kwwwwwwk....', '....kwyyyyyk....', '....kwsssksk....', '....kwssssssk...', '.....kssssk.....'],
  mage:   ['..........kk....', '.........kpk....', '........kppk....', '.......kpppk....', '...kkkkkkkkkkk..', '....kyyyyyyyk...', '.....ksssksk....'],
  paladin:['......rrr.......', '.....krrrk......', '....kyyyyyyk....', '....kyyyyyyyk...', '....kykkkkkkk...', '....kyyyyyyyk...', '.....kyyyyyyk...'],
};
const BODY = ['.....kssssk.....', '....kTTTTTTkW...', '...kTTTAATTkW...', '...ksTTTTTTskW..', '....kTttttTk....', '....kAAAAAAk....'];
const LEGS_A = ['....kLk..kLk....', '....kLk..kLk....', '....kkk..kkk....'];
const LEGS_B = ['...kLk....kLk...', '..kLk......kLk..', '..kkk......kkk..'];
const ROBE = ['....kTTTTTTk....', '...kTTTTTTTTk...', '...kkkkkkkkkk...'];
const HMAP = {
  squire:  { T: '#3b78e7', t: '#1f3f8a', A: '#8a5a2b', L: '#4e2f16', W: '#c9c9d9' },
  rogue:   { T: '#2e8b3a', t: '#1d5a26', A: '#8a5a2b', L: '#4e2f16', W: '#ffffff' },
  knight:  { T: '#7c7c94', t: '#45455a', A: '#e03a3a', L: '#45455a', W: '#c9c9d9' },
  cleric:  { T: '#ffffff', t: '#c9c9d9', A: '#ffd83a', L: '#c9c9d9', W: '#ffd83a' },
  mage:    { T: '#9b4dff', t: '#5a2596', A: '#ffd83a', L: '#9b4dff', W: '#7fe0ff' },
  paladin: { T: '#ffd83a', t: '#b87a10', A: '#e03a3a', L: '#b87a10', W: '#ffffff' },
};
const SPR = {};
for (const t of Object.keys(HT)) {
  const legsA = HT[t].float ? ROBE : LEGS_A, legsB = HT[t].float ? ROBE : LEGS_B;
  SPR[t] = [mkSprite([...HEADS[t], ...BODY, ...legsA], HMAP[t]), mkSprite([...HEADS[t], ...BODY, ...legsB], HMAP[t])];
  SPR[t + 'W'] = whiteOf(SPR[t][0]);
}

// Kacheln je Welt (Boden, Block, Leichenhaufen) werden aus den Weltfarben gebaut
function tileSet(th) {
  const mk = f => { const cv = document.createElement('canvas'); cv.width = cv.height = TS; f(cv.getContext('2d')); return cv; };
  const px = (x, c, X, Y, w = 1, h = 1) => { x.fillStyle = c; x.fillRect(X, Y, w, h); };
  const fillPat = (x, y0) => {
    px(x, th.fill[0], 0, y0, 16, 16 - y0);
    for (let j = y0; j < 16; j++) for (let i = 0; i < 16; i++) {
      const v = (i * 7 + j * 13 + ((i * j) % 5)) % 23;
      if (v === 0) px(x, th.fill[2], i, j, 2, 1); else if (v === 5 || v === 11) px(x, th.fill[1], i, j);
    }
  };
  const top = mk(x => {
    fillPat(x, 0);
    px(x, th.top[1], 0, 0, 16, 5); px(x, th.top[0], 0, 0, 16, 2);
    for (let i = 0; i < 16; i += 3) px(x, th.top[2], i, 5, 2, (i * 5) % 3 + 1);
    px(x, th.top[2], 0, 4, 16, 1);
  });
  const fill = mk(x => fillPat(x, 0));
  const block = mk(x => {
    px(x, '#140c1c', 0, 0, 16, 16); px(x, th.block[1], 1, 1, 14, 14);
    px(x, th.block[0], 1, 1, 14, 2); px(x, th.block[0], 1, 1, 2, 14);
    px(x, th.block[2], 1, 13, 14, 2); px(x, th.block[2], 13, 1, 2, 14);
    px(x, th.block[2], 4, 7, 8, 1); px(x, th.block[2], 7, 4, 1, 3); px(x, th.block[2], 7, 8, 1, 4);
    px(x, th.block[0], 3, 3, 1, 1);
  });
  const corpse = mk(x => {
    px(x, '#2a2034', 0, 0, 16, 16);
    for (let k = 0; k < 5; k++) { const bx = (k * 7) % 12 + 1, by = (k * 5) % 12 + 2; px(x, '#e8e0d0', bx, by, 4, 1); px(x, '#e8e0d0', bx - 1, by - 1, 1, 3); px(x, '#e8e0d0', bx + 4, by - 1, 1, 3); }
    px(x, '#e8e0d0', 9, 9, 4, 3); px(x, '#140c1c', 10, 10, 1, 1); px(x, '#140c1c', 12, 10, 1, 1);
  });
  return { top, fill, block, corpse };
}
const TILESETS = THEMES.map(tileSet);

function rebuildTM() { TM = new Map(); for (const t of S.things) TM.set(key(t.c, t.r), t); }

function newState() { return { gold: budget(1), wave: 1, things: [], kills: 0, leaks: 0, stars: {}, retry: 0, best: 0 }; }
function save() {

function load() {

    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!d) return null;
    const s = { ...newState(), ...d, stars: d.stars || {} };
    s.things = (d.things || []).filter(t => TOOLS[t.type]).map(t => makeThing(t.type, t.c, t.r, t.lvl, t.spent, false));
    return s;
  } catch (e) { return null; }
}
function makeThing(type, c, r, lvl = 1, spent = TOOLS[type].cost, fresh = true) {
  const t = { type, c, r, lvl, spent, fresh, t: Math.random() * 3, cd: 0, anim: 0, hp: 0, max: 0 };
  resetThing(t);
  return t;
}
function resetThing(t) {
  t.cd = 0; t.anim = 0;
  if (t.type === 'block') { t.max = stat(t).hp; t.hp = t.max; }
  if (t.type === 'cannon') { t.max = 120 * t.lvl; t.hp = t.max; }
  if (t.type === 'thwomp') { t.y = t.r * TS; t.state = 'up'; t.vy = 0; t.hits = new Set(); }
  if (t.type === 'cannon') t.t = Math.random() * stat(t).per;
}
function resetLevelRuntime() {
  corpse = new Array(NC_MAX).fill(0);
  S.things.forEach(resetThing);
  minions = S.things.filter(t => TOOLS[t.type].minion).map(spawnMinion);

// ================= Gelände =================
const holeAt = c => { const t = thingAt(c, GROUND); return !!t && t.type === 'hole'; };
const corpseRows = c => { const t = thingAt(c, GROUND); return t ? Math.min(2, Math.floor(corpse[c] / stat(t).cap)) : 0; };
function isSolid(c, r) {
  if (c < 0 || c >= NC) return true;
  if (r < 0 || r >= ROWS) return false;
  if (r >= GROUND) return holeAt(c) ? r >= ROWS - corpseRows(c) : true;
  const t = thingAt(c, r);
  return !!t && (t.type === 'block' || t.type === 'cannon') && t.hp > 0;
}
const solidAt = (x, y) => isSolid(Math.floor(x / TS), Math.floor(y / TS));
// Oberkante des höchsten festen Feldes in einer Spalte (oder null)
function colTop(c) { for (let r = 0; r < ROWS; r++) if (isSolid(c, r)) return r * TS; return null; }

// Bewegung eines Körpers (x = Mitte, y = Füße) mit Kachel-Kollision
function moveBody(b, dx, dy, dyn) {
  b.hitWall = null; b.onGround = false;
  if (dx) {
    b.x += dx;
    const T = b.y - b.h + 1, B = b.y - 1, r0 = Math.floor(T / TS), r1 = Math.floor(B / TS);
    const edge = dx > 0 ? b.x + b.w / 2 : b.x - b.w / 2, c = Math.floor(edge / TS);
    for (let r = r0; r <= r1; r++) if (isSolid(c, r)) {
      b.x = dx > 0 ? c * TS - b.w / 2 - .01 : (c + 1) * TS + b.w / 2 + .01;
      b.hitWall = { c, r }; break;
    }
    if (dyn) for (const o of dyn) {
      const ox = b.x - dx; // nur blocken, wer von außen hineinläuft
      const wasOut = dx > 0 ? ox + b.w / 2 <= o.x + .01 : ox - b.w / 2 >= o.x + o.w - .01;
      if (wasOut && b.y - b.h < o.y + o.h && b.y > o.y && b.x + b.w / 2 > o.x && b.x - b.w / 2 < o.x + o.w) {
        b.x = dx > 0 ? o.x - b.w / 2 - .01 : o.x + o.w + b.w / 2 + .01; b.hitWall = { dyn: o };
      }
    }
  }
  if (dy) {
    b.y += dy;
    const c0 = Math.floor((b.x - b.w / 2) / TS), c1 = Math.floor((b.x + b.w / 2 - .01) / TS);
    if (dy > 0) {
      const r = Math.floor(b.y / TS);
      for (let c = c0; c <= c1; c++) if (isSolid(c, r)) { b.y = r * TS; b.vy = 0; b.onGround = true; break; }
    } else {
      const r = Math.floor((b.y - b.h) / TS);
      for (let c = c0; c <= c1; c++) if (isSolid(c, r)) { b.y = (r + 1) * TS + b.h; b.vy = 0; break; }
    }
  }
}

// ================= Wellen =================
function waveHpMul(w) { return 1 + (w - 1) * .3 + Math.max(0, w - 5) * .3 + Math.max(0, w - 10) * .4; }
const waveSkill = w => .15 + Math.min(.35, (w - 1) * .03);
const waveRng = w => 1 + Math.min(.3, (w - 1) * .025);
function waveCount(w) { return Math.min(32 + w * 6, 150); }
const isBoss = w => w % 5 === 0;
function waveList(w) {
  const pool = [['squire', 10]];
  if (w >= 2) pool.push(['rogue', 3 + w * .5]);
  if (w >= 3) pool.push(['knight', 2 + w * .4]);
  if (w >= 4) pool.push(['cleric', 1.5 + w * .2]);
  if (w >= 5) pool.push(['mage', 1 + w * .6]);
  const tot = pool.reduce((a, p) => a + p[1], 0), list = [];
  for (let n = waveCount(w); n > 0; n--) {
    let r = Math.random() * tot, pick = 'squire';
    for (const p of pool) { r -= p[1]; if (r <= 0) { pick = p[0]; break; } }
    list.push(pick);
  }
  const bosses = isBoss(w) ? w / 5 : 0;
  for (let k = 0; k < bosses; k++) list.splice(Math.floor(list.length * (.3 + .4 * Math.random())), 0, 'paladin');
  return list;
}
let preview = null;
function planned(w) { if (!preview || preview.w !== w) preview = { w, list: waveList(w) }; return preview.list; }

function starsFor(leaks, total) { const r = leaks / total; return leaks === 0 ? 3 : r <= .05 ? 2 : r < .1 ? 1 : 0; }
const baseBudget = w => 150 + (w - 1) * 20;
function budget(w) {
  if (w === 1 || !isBoss(w - 1)) return baseBudget(w);
  let sum = 0; for (let k = 1; k <= w; k++) sum += baseBudget(k);
  return Math.round(sum / 10) * 10;
}

function startWave() {
  if (phase !== 'build') return;
  closePopup(); selType = null; refreshPalette();
  phase = 'wave';
  hpMul = waveHpMul(S.wave);
  const list = planned(S.wave);
  spawnQ = []; let t = 0;
  list.forEach((type, k) => { t += (k % 8 === 0 && k > 0) ? rnd(1.2, 2) : rnd(.15, .4); spawnQ.push({ t, type }); });
  waveT = 0; waveTotal = list.length;
  W = { kills: 0, leaks: 0, gold: 0 };
  S.things.forEach(t => t.fresh = false);
  resetLevelRuntime();
  heroes = []; stones = []; stoneT = 0;
  if (lord.xp < 40) setTimeout(() => toast('Tippe auf die Strecke: der Lord wirft Steine!', 2600), 400);
  updateUI();
}

function endWave() {
  phase = 'build';
  const done = S.wave, stars = starsFor(W.leaks, waveTotal);
  if (stars > 0) {
    S.stars[done] = Math.max(S.stars[done] || 0, stars);
    S.best = Math.max(S.best, done);
    if (isBoss(done)) S.things = []; // nach dem Boss: Feld räumen, neue Welt
    S.wave++; S.retry = 0; S.gold = budget(S.wave);
    applyLength(S.wave);
  } else S.retry = (S.retry || 0) + 1;
  rebuildTM();
  resetLevelRuntime();
  heroes = []; stones = [];
  save(); saveLord();
  showResult(done, stars);
  updateUI();
}

function spawnHero(type) {
  const d = HT[type];
  heroes.push({
    type, def: d, x: rnd(10, 26), y: GROUND * TS, vx: 0, vy: 0, w: d.w, h: d.h,
    hp: d.hp * hpMul, max: d.hp * hpMul,
    skill: Math.min(.95, d.skill + waveSkill(S.wave)), rng: d.rng * waveRng(S.wave), jv: d.jv,
    st: 'run', onGround: true, plans: {}, anim: Math.random() * 10, flash: 0, healT: rnd(1, 3),
    kb: 0, hitCd: 0, fbCd: 0, bestX: 0, stuckT: 0, wallTries: 0, waitT: 0, waiting: false, dead: false,
  });
}
const airTime = h => 2 * h.jv / G;
function jump(h, dist) { h.vy = -h.jv; h.vx = Math.max(h.def.spd, dist / airTime(h)); h.onGround = false; }

function damage(h, amt, src) {
  if (h.dead) return;
  if (h.def.armor && src !== 'pit') amt *= (1 - h.def.armor);
  h.hp -= amt;
  if (amt > 2 || Math.random() < .15) h.flash = .08;
  if (Math.random() < Math.min(.9, amt * .08)) spark(h.x, h.y - h.h / 2, src === 'fire' ? '#ff9a2e' : '#e03a3a', 1);
  if (h.hp <= 0) kill(h, src);
}
function knock(h, dir = -1) { h.kb = .35; h.vx = 50 * dir; h.vy = -150; h.onGround = false; }

function kill(h, src) {
  if (h.dead) return;
  h.dead = true;
  const g = Math.max(1, Math.round(h.def.gold * (1 + (S.wave - 1) * .025) * (S.retry ? .5 : 1)));
  S.gold += g; S.kills++; W.kills++; W.gold += g;
  const lvBefore = lordLevel();
  lord.xp += h.def.boss ? 10 : 1;
  if (lordLevel() > lvBefore) { saveLord(); texts.push({ x: CASTLE_C * TS + 40, y: 0, txt: 'Lord Stufe ' + lordLevel() + '!', col: '#d9a8ff', life: 2, max: 2 }); }
  lordLaugh = 1.2;
  const y = src === 'pit' ? GROUND * TS - 4 : h.y - h.h / 2;
  for (let k = 0; k < 8; k++) parts.push({ x: h.x, y, vx: rnd(-40, 40), vy: rnd(-80, -20), life: rnd(.4, .8), max: .8, col: k < 3 ? '#ffd83a' : '#c9c9d9', g: 200 });
  parts.push({ ghost: true, x: h.x, y, vy: -24, life: 1.2, max: 1.2 });
  texts.push({ x: h.x, y: y - 10, txt: '+' + g, col: '#ffd83a', life: 1, max: 1 });
  if (h.def.boss) { shake = .4; texts.push({ x: h.x, y: y - 22, txt: 'Paladin besiegt!', col: '#ffffff', life: 1.8, max: 1.8 }); }
}
function leak(h) {
  h.dead = true; S.leaks++; W.leaks++;
  texts.push({ x: GOAL_X, y: GROUND * TS - 40, txt: 'Durch!', col: '#e03a3a', life: 1.1, max: 1.1 });
  shake = Math.max(shake, .15);
}

// Nächster Platz rechts, auf dem man stehen kann (für Paladin und festgefahrene Helden)
function standSpotRight(c0, h) {
  for (let c = c0 + 1; c < NC; c++) for (let r = 1; r < ROWS; r++) {
    if (isSolid(c, r) && !isSolid(c, r - 1) && !isSolid(c, r - 2)) return { x: c * TS + TS / 2, y: r * TS };
  }
  return { x: GOAL_X, y: GROUND * TS };
}

function feetRow(h) { return Math.floor((h.y - 1) / TS); }
// Was liegt in Spalte c auf Laufhöhe fr? 'wall', 'gap' (kein Halt bis ganz unten) oder 'trap'
function colDanger(c, fr) {
  if (c >= NC) return null;
  if (isSolid(c, fr)) return 'wall';
  let floor = false;
  for (let r = fr + 1; r < ROWS; r++) if (isSolid(c, r)) { floor = true; break; }
  if (!floor) return 'gap';
  const t = thingAt(c, fr);
  if (t && (t.type === 'spikes' || t.type === 'spring')) return 'trap';
  return null;
}
const isDZ = d => d === 'gap' || d === 'trap';

function planJump(h) {
  const fr = feetRow(h), c0 = Math.floor(h.x / TS), look = Math.ceil(h.rng) + 2, R = h.rng * TS;
  for (let c = c0; c <= c0 + look; c++) {
    const dz = colDanger(c, fr);
    if (dz === 'wall') return false;
    if (!isDZ(dz)) continue;
    let s = c, e = c;
    while (s > c0 && isDZ(colDanger(s - 1, fr))) s--;
    while (e < c0 + look + 4 && isDZ(colDanger(e + 1, fr))) e++;
    const x0 = s * TS, x1 = (e + 1) * TS;
    if (h.x - h.w / 2 > x1) continue;
    const pk = s + ':' + fr;
    let p = h.plans[pk];
    if (!p) {
      const see = Math.random() < Math.min(.97, h.skill + .1 + (dz === 'gap' ? .35 : 0));
      const err = (Math.random() - .5) * (1 - h.skill) * 18;
      p = h.plans[pk] = { jump: see, tx: x0 - Math.max(2, (R - (x1 - x0)) / 2) + err, done: false };
    }
    if (p.jump && !p.done && h.x >= p.tx) { p.done = true; jump(h, R); return true; }
    return false;
  }
  return false;
}

// Gegner, Kugeln: kurz davor abspringen (mit etwas Glück)
function dodge(h) {
  for (const m of minions) {
    if (!m.alive) continue;
    const dx = m.x - h.x;
    if (dx < 6 || dx > 34 || Math.abs(m.y - h.y) > 10) continue;
    const pk = 'm' + m.id;
    if (h.plans[pk] === undefined) h.plans[pk] = Math.random() < h.skill + .15 + (h.learn || 0);
    if (h.plans[pk] && dx < (m.type === 'spiky' ? 26 : 18)) { jump(h, m.type === 'spiky' ? dx + 20 : dx + 4); return true; }
  }
  for (const b of bullets) {
    const dx = b.x - h.x;
    if (dx < 4 || dx > 40 || b.y < h.y - h.h - 2 || b.y > h.y + 2) continue;
    const pk = 'b' + b.id;
    if (h.plans[pk] === undefined) h.plans[pk] = Math.random() < h.skill;
    if (h.plans[pk] && dx < 26) { jump(h, 24); return true; }
  }
  return false;
}

function flameOn(t, tt) { return (tt % FLAME_P) < FLAME_ON; }
function shouldWait(h) {
  const fr = feetRow(h), c = Math.floor((h.x + h.w / 2 + 3) / TS);
  for (let r = fr; r <= Math.min(GROUND - 1, fr + 3); r++) {
    const t = thingAt(c, r);
    if (!t || t.type !== 'flame') continue;
    const d = c * TS - (h.x + h.w / 2);
    if (d < 0 || d > 8) continue;
    const pk = 'f' + c + ':' + r;
    if (h.plans[pk] === undefined) h.plans[pk] = Math.random() < h.skill;
    if (!h.plans[pk]) continue;
    if (h.waitT >= 2.2) h.plans['g' + pk] = true;
    const win = (d + TS + 12) / h.def.spd;
    let soon = false; for (let s = 0; s <= win; s += .05) if (flameOn(t, t.t + s)) { soon = true; break; }
    if (flameOn(t, t.t) || (!h.plans['g' + pk] && soon)) return true;
  }
  return false;
}

function attackWall(h, dt) {
  const fr = feetRow(h), c = Math.floor((h.x + h.w / 2 + 2) / TS);
  for (let r = fr; r >= fr - Math.ceil(h.h / TS) + 1; r--) {
    const t = thingAt(c, r);
    if (t && (t.type === 'block' || t.type === 'cannon') && t.hp > 0) {
      t.hp -= h.def.dps * hpMul * dt; t.anim = .12; h.anim += dt * 20; h.attacking = true;
      if (t.hp <= 0) breakBlock(t);
      return true;
    }
  }
  return false;
}
function breakBlock(t) {
  t.hp = 0;
  for (let k = 0; k < 10; k++) parts.push({ x: t.c * TS + 8, y: t.r * TS + 8, vx: rnd(-70, 70), vy: rnd(-150, -30), life: rnd(.4, .8), max: .8, col: themeFor(S.wave).block[1], g: 600 });
  shake = Math.max(shake, .12);
}

function pitDeath(h) {
  const c = clamp(Math.floor(h.x / TS), 0, NC - 1);
  if (h.def.boss && h.hp > h.max * .36) {
    h.hp -= h.max * .35;
    const s = standSpotRight(c, h); h.x = s.x; h.y = s.y; h.vy = 0; h.vx = 0; h.plans = {};
    texts.push({ x: h.x, y: h.y - 34, txt: 'klettert raus!', col: '#ffd83a', life: 1.2, max: 1.2 });
    return;
  }
  if (holeAt(c)) corpse[c]++;
  kill(h, 'pit');
}

function dynObstacles() {
  const out = [];
  for (const t of S.things) if (t.type === 'thwomp' && t.state !== 'up') out.push({ x: t.c * TS, y: t.y, w: TS, h: TS });
  return out;
}

function updHero(h, dt, dyn) {
  const d = h.def;
  if (h.flash > 0) h.flash -= dt;
  if (h.hitCd > 0) h.hitCd -= dt;
  if (h.fbCd > 0) h.fbCd -= dt;
  if (d.heal) {
    h.healT -= dt;
    if (h.healT <= 0) {
      h.healT = 3.2; let any = false;
      for (const o of heroes) if (!o.dead && o !== h && Math.abs(o.x - h.x) < 40 && o.hp < o.max) { o.hp = Math.min(o.max, o.hp + 10 * hpMul); any = true; }
      if (any) parts.push({ ring: true, x: h.x, y: h.y - 8, life: .6, max: .6 });
    }
  }
  h.attacking = false; h.waiting = false;

  if (d.float) {
    // Magier schweben knapp über dem höchsten Grund vor sich
    const cA = Math.floor(h.x / TS), cB = Math.floor((h.x + h.w / 2 + 6) / TS);
    const tops = [colTop(cA), colTop(cB)].filter(v => v !== null);
    if (tops.length) { const ty = Math.min(...tops) - 3; h.vy = clamp((ty - h.y) * 4, -50, 50); } else h.vy = 0;
    h.waiting = shouldWait(h);
    moveBody(h, h.waiting ? 0 : d.spd * dt, h.vy * dt, dyn);
    if (h.hitWall && !h.waiting) { if (!attackWall(h, dt)) h.y -= 20 * dt; }
    if (!h.waiting && !h.attacking) h.anim += d.spd * dt;
  } else {
    h.vy = Math.min(h.vy + G * dt, 420);
    if (h.kb > 0) { h.kb -= dt; moveBody(h, h.vx * dt, h.vy * dt, dyn); }
    else if (h.onGround) {
      h.waiting = shouldWait(h);
      h.waitT = h.waiting ? h.waitT + dt : 0;
      h.vx = 0;
      if (!h.waiting && !planJump(h) && !dodge(h)) h.vx = d.spd;
      moveBody(h, h.vx * dt, h.vy * dt, dyn);
      if (h.hitWall && h.onGround) {
        // Mauer: drüberspringen, wenn sie niedrig genug ist, sonst kaputt schlagen
        const fr = feetRow(h), c = h.hitWall.c ?? Math.floor((h.x + h.w / 2 + 2) / TS);
        let hg = 0; while (hg < 5 && isSolid(c, fr - hg)) hg++;
        const apex = h.jv * h.jv / (2 * G);
        if (!h.hitWall.dyn && apex >= hg * TS + 2 && h.wallTries < 2) { h.wallTries++; h.vy = -h.jv; h.vx = d.spd * 1.3; h.onGround = false; }
        else attackWall(h, dt);
      }
      if (!h.attacking && h.vx) h.anim += h.vx * dt;
    } else {
      // Wandkontakt in der Luft stoppt nur die Bewegung, nicht den Schwung: so kommt man über Kanten
      moveBody(h, h.vx * dt, h.vy * dt, dyn);
      if (h.onGround) { h.plans = {}; }
    }
  }

  // Echten Stillstand erkennen (Zurückgeworfenwerden zählt nicht), damit niemand ewig festhängt
  if (h.x > h.bestX + 1) { h.bestX = h.x; h.wallTries = 0; }
  h.sampleT = (h.sampleT || 0) + dt;
  if (h.sampleT >= 1) {
    const moved = Math.abs(h.x - (h.sampleX ?? h.x)) + Math.abs(h.y - (h.sampleY ?? h.y));
    h.stuckT = (moved < 3 && !h.waiting && !h.attacking) ? h.stuckT + h.sampleT : 0;
    h.sampleT = 0; h.sampleX = h.x; h.sampleY = h.y;
  }
  h.noProg = h.x > (h.progX ?? -1) + 8 ? (h.progX = h.x, 0) : (h.noProg || 0) + dt;
  if (h.noProg > 20) { kill(h, 'giveup'); texts.push({ x: h.x, y: h.y - 24, txt: 'gibt auf', col: '#c9c9d9', life: 1.2, max: 1.2 }); return; }
  if (h.stuckT >= 6) {
    const s = standSpotRight(Math.floor(h.x / TS), h); h.x = s.x; h.y = s.y; h.vy = 0; h.stuckT = 0; h.plans = {}; teleports++;
  }

  if (h.y > ROWS * TS + 24) { pitDeath(h); return; }
  if (h.x >= GOAL_X) leak(h);
}

// ================= Gegner =================
let minionId = 0;
function spawnMinion(t) {
  const m = { id: ++minionId, src: t, type: t.type, x: t.c * TS + 8, y: (t.r + 1) * TS, vx: 0, vy: 0, w: 12, h: 11, dir: -1, alive: true, t: Math.random() * 6, squash: 0 };
  if (t.type === 'bat') { m.w = 12; m.h = 9; m.homeY = t.r * TS + 12; }
  return m;
}
function updMinions(dt) {
  for (const m of minions) {
    if (!m.alive) { if (m.squash > 0) m.squash -= dt; continue; }
    const st = stat(m.src);
    m.t += dt;
    if (m.type === 'bat') { m.y = m.homeY + Math.sin(m.t * 2.2) * st.rng; }
    else {
      m.vy = Math.min(m.vy + G * dt, 400);
      moveBody(m, m.dir * st.spd * dt, m.vy * dt);
      const aheadX = m.x + m.dir * (m.w / 2 + 1);
      const edge = m.onGround && !solidAt(aheadX, m.y + 2);
      if (m.hitWall || edge || aheadX < BUILD_MIN * TS || aheadX > CASTLE_C * TS) m.dir *= -1;
      if (m.y > ROWS * TS + 20) m.alive = false;
    }
    // Kontakt mit Helden
    for (const h of heroes) {
      if (h.dead || h.hitCd > 0) continue;
      if (Math.abs(h.x - m.x) > (h.w + m.w) / 2 || h.y < m.y - m.h || h.y - h.h > m.y) continue;
      const stomp = m.type !== 'spiky' && h.vy > 20 && h.y - (m.y - m.h) < 7;
      if (stomp) {
        m.alive = false; m.squash = .5; h.vy = -200; h.onGround = false; h.hitCd = .2;
        for (let k = 0; k < 5; k++) parts.push({ x: m.x, y: m.y - 4, vx: rnd(-50, 50), vy: rnd(-80, -20), life: .4, max: .4, col: '#9b4dff', g: 300 });
        break;
      }
      damage(h, st.dmg, 'mob'); knock(h, h.x < m.x ? -1 : 1); h.hitCd = .6;
      delete h.plans['m' + m.id]; h.learn = Math.min(.6, (h.learn || 0) + .2); // aus Treffern lernen
    }
  }
}

// ================= Fallen =================
let bulletId = 0, teleports = 0;
function overlapRect(h, x, y, w, hh) { return h.x + h.w / 2 > x && h.x - h.w / 2 < x + w && h.y > y && h.y - h.h < y + hh; }
function updThings(dt) {
  for (const t of S.things) {
    const prev = t.t;
    t.t += dt;
    if (t.cd > 0) t.cd -= dt;
    if (t.anim > 0) t.anim -= dt;
    if (phase !== 'wave') continue;
    const st = stat(t), x = t.c * TS, y = t.r * TS;
    switch (t.type) {
      case 'spikes':
        for (const h of heroes) if (!h.dead && !h.def.float && overlapRect(h, x + 1, y + 8, 14, 8)) damage(h, st.dps * dt, 'spike');
        break;
      case 'flame':
        if (flameOn(t, t.t)) for (const h of heroes) if (!h.dead && overlapRect(h, x + 3, y - 2 * TS, 10, 3 * TS)) damage(h, st.dps * dt, 'fire');
        break;
      case 'firebar': {
        const a = t.t * st.spd;
        for (let k = 1; k <= st.n; k++) {
          const bx = x + 8 + Math.cos(a) * k * 7, by = y + 8 + Math.sin(a) * k * 7;
          for (const h of heroes) if (!h.dead && h.fbCd <= 0 && overlapRect(h, bx - 3, by - 3, 6, 6)) { damage(h, st.dmg, 'fire'); h.fbCd = .4; }
        }
      } break;
      case 'thwomp':
        if (t.state === 'up') {
          if (t.cd <= 0 && heroes.some(h => !h.dead && Math.abs(h.x - (x + 8)) < 14 && h.y > t.y + TS)) { t.state = 'fall'; t.vy = 0; t.hits = new Set(); }
        } else if (t.state === 'fall') {
          t.vy += 1400 * dt; t.y += t.vy * dt;
          for (const h of heroes) if (!h.dead && !t.hits.has(h) && overlapRect(h, x, t.y, TS, TS)) { t.hits.add(h); damage(h, st.dmg, 'crush'); }
          const r = Math.floor((t.y + TS) / TS);
          if (r >= ROWS + 1) { t.y = t.r * TS; t.state = 'up'; }
          else if (isSolid(t.c, r) && t.y + TS >= r * TS) {
            t.y = r * TS - TS; t.state = 'down'; t.cd = .9;
            for (let k = 0; k < 6; k++) parts.push({ x: x + rnd(0, 16), y: t.y + TS, vx: rnd(-50, 50), vy: rnd(-60, -10), life: .4, max: .4, col: '#c9c9d9', g: 300 });
            shake = Math.max(shake, .1);
          }
        } else if (t.state === 'down') { if (t.cd <= 0) t.state = 'rise'; }
        else if (t.state === 'rise') { t.y -= 30 * dt; if (t.y <= t.r * TS) { t.y = t.r * TS; t.state = 'up'; t.cd = .8; } }
        break;
      case 'cannon':
        if (t.hp > 0 && (prev % st.per) > (t.t % st.per)) { bullets.push({ id: ++bulletId, x: x - 2, y: y + 8, vx: -70, dmg: st.dmg }); t.anim = .2; }
        break;
      case 'spring':
        if (t.cd <= 0) for (const h of heroes) if (!h.dead && !h.def.float && h.vy >= 0 && overlapRect(h, x + 2, y + 8, 12, 8)) {
          h.vy = -330; h.vx = -(st.push * TS) / (2 * 330 / G); h.kb = 2 * 330 / G; h.onGround = false; h.plans = {};
          t.cd = st.cd; t.anim = .3; break;
        }
        break;
    }
  }
  for (const b of bullets) {
    b.x += b.vx * dt;
    if (solidAt(b.x - 3, b.y) || b.x < -10) { b.dead = true; continue; }
    for (const h of heroes) if (!h.dead && overlapRect(h, b.x - 4, b.y - 3, 8, 6)) { damage(h, b.dmg, 'shot'); b.dead = true; break; }
  }
  bullets = bullets.filter(b => !b.dead);
}

// ================= Dunkler Lord =================
const LORD_KEY = 'fallenfuerst_lord_v1', LORD_MAX = 10;
const LORD_SKILLS = {
  dmg: { name: 'Wurfkraft', txt: l => `${stoneDmg(l)} Schaden` },
  cd:  { name: 'Nachladen', txt: l => `alle ${stoneCd(l).toFixed(2)} s` },
  rad: { name: 'Einschlag', txt: l => `${stoneRad(l)} Radius` },
};
const stoneDmg = (l = lord.pts.dmg) => 18 + l * 10;
const stoneCd = (l = lord.pts.cd) => 1.5 - l * .11;
const stoneRad = (l = lord.pts.rad) => 10 + l * 2;
const lordXpFor = lv => Math.round(25 * Math.pow(lv - 1, 1.6));
function lordLevel() { let l = 1; while (lordXpFor(l + 1) <= lord.xp) l++; return l; }
const lordFree = () => Math.max(0, lordLevel() - 1 - (lord.pts.dmg + lord.pts.cd + lord.pts.rad));
function loadLord() {
  try { const d = JSON.parse(localStorage.getItem(LORD_KEY)); if (d && d.pts) return { xp: d.xp || 0, pts: { dmg: 0, cd: 0, rad: 0, ...d.pts } }; } catch (e) {}
  return { xp: 0, pts: { dmg: 0, cd: 0, rad: 0 } };
}
function saveLord() { try { localStorage.setItem(LORD_KEY, JSON.stringify(lord)); } catch (e) {} }
function resetLord() { lord = { xp: 0, pts: { dmg: 0, cd: 0, rad: 0 } }; saveLord(); }
let lord = loadLord();
let stones = [], stoneT = 0, lordThrow = 0;
const lordPos = () => ({ x: CASTLE_C * TS + 40, y: 2 * TS - 8 });
const STONE_G = 600;
// Der Stein fliegt im Bogen zum Boden unter der Tippstelle und schlägt dort auf, außer er trifft vorher einen Helden
function throwStone(wx) {
  if (stoneT > 0) return;
  const o = lordPos(), tx = clamp(wx, 0, NC * TS);
  let ty = GROUND * TS - 2; const top = colTop(Math.floor(tx / TS)); if (top !== null) ty = top - 2;
  const T = .35 + Math.abs(tx - o.x) / 500;
  const st = { x: o.x, y: o.y, vx: (tx - o.x) / T, vy: (ty - o.y - .5 * STONE_G * T * T) / T, t: 0, lx: tx, ly: ty };
  stones.push(st); stoneT = stoneCd(); lordThrow = .3;
}
function stoneImpact(st, x, y) {
  st.done = true;
  const R = stoneRad();
  for (const h of heroes) if (!h.dead && Math.hypot(h.x - x, h.y - h.h / 2 - y) <= R + 4) damage(h, stoneDmg(), 'stone');
  for (let k = 0; k < 8; k++) parts.push({ x, y, vx: rnd(-70, 70), vy: rnd(-110, -20), life: rnd(.3, .6), max: .6, col: k % 2 ? '#c9c9d9' : '#7c7c94', g: 500 });
  shake = Math.max(shake, .06);
}
function updStones(dt) {
  if (stoneT > 0) stoneT -= dt;
  if (lordThrow > 0) lordThrow -= dt;
  for (const st of stones) {
    st.t += dt; st.vy += STONE_G * dt; st.x += st.vx * dt; st.y += st.vy * dt;
    const hit = heroes.find(h => !h.dead && Math.abs(h.x - st.x) < h.w / 2 + 3 && st.y > h.y - h.h && st.y < h.y + 2);
    if (hit) { stoneImpact(st, st.x, st.y); continue; }
    if (st.vy > 0 && solidAt(st.x, st.y + 2)) { stoneImpact(st, st.x, st.y); continue; }
    if (st.y > ROWS * TS + 20 || st.x < -20 || st.x > NC * TS + 20) st.done = true;
  }
  stones = stones.filter(s => !s.done);
}

// ================= Effekte & Update =================
function spark(x, y, col, n) { for (let k = 0; k < n; k++) parts.push({ x, y, vx: rnd(-30, 30), vy: rnd(-60, -10), life: rnd(.2, .45), max: .45, col, g: 400 }); }
function updFx(dt) {
  for (const p of parts) { p.life -= dt; if (p.ring) continue; if (p.ghost) { p.y += p.vy * dt; continue; } p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.life > 0);
  if (parts.length > 500) parts.splice(0, parts.length - 500);
  for (const t of texts) { t.life -= dt; t.y -= 16 * dt; }
  texts = texts.filter(t => t.life > 0);
}
function update(dt) {
  time += dt;
  if (lordLaugh > 0) lordLaugh -= dt;
  if (shake > 0) shake -= dt;
  updThings(dt);
  if (phase === 'wave') {
    waveT += dt;
    while (spawnQ.length && spawnQ[0].t <= waveT) spawnHero(spawnQ.shift().type);
    updMinions(dt);
    const dyn = dynObstacles();
    for (const h of heroes) if (!h.dead) updHero(h, dt, dyn);
    heroes = heroes.filter(h => !h.dead);
    updStones(dt);
    if (!spawnQ.length && !heroes.length) endWave();
  } else if (minions.length) {
    // In der Bauphase laufen die Gegner zur Vorschau herum
    updMinions(dt);
  }
  updFx(dt);
}

// ================= Zeichnen =================
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const buf = document.createElement('canvas');
const c = buf.getContext('2d');
let dpr = 1, K = 5, bw = 200, bh = 160, levelTop = 16, cssW = 0, cssH = 0;
function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cssW = r.width; cssH = r.height;
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  K = Math.max(1, Math.floor(cv.height / (ROWS * TS + 12)));
  bw = Math.ceil(cv.width / K); bh = Math.ceil(cv.height / K);
  buf.width = bw; buf.height = bh;
  levelTop = bh - ROWS * TS;
  clampCam();
}
function clampCam() { camX = Math.round(clamp(camX, 0, Math.max(0, NC * TS - bw))); }
const sx = x => Math.round(x - camX), sy = y => Math.round(y + levelTop);
function px(col, x, y, w = 1, h = 1) { c.fillStyle = col; c.fillRect(x, y, w, h); }
function spr(img, x, y, s = 1) { c.drawImage(img, Math.round(x), Math.round(y), img.width * s, img.height * s); }
// gefüllter Pixel-Kreis (zeilenweise, ohne Kantenglättung)
function pcircle(col, cx, cy, r, half = false) {
  c.fillStyle = col;
  for (let dy = -r; dy <= (half ? 0 : r); dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy)); c.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2, 1); }
}

function drawBg(th, ti) {
  // Himmel in Stufen mit handgesetztem Schachbrett-Übergang
  const band = Math.ceil(bh / th.sky.length);
  th.sky.forEach((col, i) => px(col, 0, i * band, bw, band));
  for (let i = 1; i < th.sky.length; i++) { c.fillStyle = th.sky[i]; for (let x = 0; x < bw; x += 2) { c.fillRect(x, i * band - 2, 1, 1); c.fillRect(x + 1, i * band - 1, 1, 1); } }
  const base = sy(GROUND * TS);
  if (ti === 0) {
    for (let k = 0; k < 7; k++) { const x = ((k * 190 - camX * .1 - time * 3) % 1330 + 1330) % 1330 - 60; cloud(Math.round(x), 18 + (k * 37) % 40 + levelTop / 2); }
    for (let k = 0; k < 8; k++) { const x = ((k * 150 - camX * .3) % 1200 + 1200) % 1200 - 80, r = 30 + (k * 17) % 26; pcircle('#1d6a2a', x, base, r + 1, true); pcircle('#6ccf5a', x, base, r, true); px('#9ae070', Math.round(x - r / 3), Math.round(base - r * .7), 4, 2); }
    for (let k = 0; k < 9; k++) { const x = ((k * 120 - camX * .6) % 1080 + 1080) % 1080 - 50; bush(Math.round(x), base, 2 + k % 2); }
  } else if (ti === 1) {
    for (let k = 0; k < 12; k++) { const x = Math.round(((k * 97 - camX * .3) % 1164 + 1164) % 1164 - 40), len = 20 + (k * 29) % 50; for (let j = 0; j < len; j++) { const w = Math.max(1, Math.round((1 - j / len) * 10)); px('#2a2046', x - w, j, w * 2, 1); } }

function canPlace(type, col, r) {
  if (col < BUILD_MIN || col > BUILD_MAX || r < 0 || r >= ROWS) return false;
  const p = TOOLS[type].place;
  if (p === 'ground') return r >= GROUND && !holeAt(col);
  if (r >= GROUND || thingAt(col, r)) return false;
  if (p === 'floor') return isSolid(col, r + 1);
  if (type === 'thwomp') return !isSolid(col, r + 1) && !isSolid(col, r + 2); // braucht Fallhöhe
  return true;
}
function placeThing(type, col, r) {
  const t = makeThing(type, col, type === 'hole' ? GROUND : r);
  S.things.push(t); rebuildTM();
  if (TOOLS[type].minion) minions.push(spawnMinion(t));
  return t;
}
function removeThing(t) {
  S.things = S.things.filter(o => o !== t); rebuildTM();
  minions = minions.filter(m => m.src !== t);
}

  } else {
    const left = heroes.length + spawnQ.length;
    $('wiText').textContent = `${themeFor(S.wave).name} · Runde ${S.wave}: noch ${left} von ${waveTotal} Helden · ${W.leaks ? W.leaks + ' durch' : 'keiner durch'}`;
    $('wiBar').style.width = ((waveTotal - left) / waveTotal * 100) + '%';
  }
  $('lordLv').textContent = lordLevel();
  $('bLord').classList.toggle('pts', lordFree() > 0);
  $('bSpeed').textContent = speed + 'x';
  $('bPause').innerHTML = ico(paused ? 'play' : 'pause');
}
let toastT = 0;
function toast(msg, ms = 1600) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms); }

function statText(type, lvl) {
  const s = TOOLS[type].lv[lvl - 1];
  switch (type) {
    case 'block': return `${s.hp} Lebenspunkte`;
    case 'hole': return `Füllt sich nach ${s.cap} gefallenen Helden pro Reihe`;
    case 'spikes': return `${s.dps} Schaden/s`;
    case 'flame': return `${s.dps} Schaden/s (${FLAME_ON}s an, ${(FLAME_P - FLAME_ON).toFixed(1)}s aus)`;
    case 'firebar': return `${s.n} Kugeln · ${s.dmg} Schaden pro Treffer`;
    case 'thwomp': return `${s.dmg} Schaden pro Aufprall`;
    case 'cannon': return `${s.dmg} Schaden · alle ${s.per}s`;
    case 'spring': return `Wurf ${s.push} Felder · alle ${s.cd}s`;
    case 'crawler': case 'spiky': return `${s.dmg} Schaden · Tempo ${s.spd}`;
    case 'bat': return `${s.dmg} Schaden · Flughöhe ${s.rng}`;
  }
}
const upCost = t => Math.round(TOOLS[t.type].cost * (t.lvl === 1 ? .8 : 1.5));
const sellVal = t => t.fresh ? t.spent : Math.floor(t.spent * .7);
const infoBtn = id => `<button class="btn alt ibtn" id="${id}" aria-label="Info">i</button>`;
function showInfo(title, html, back) {
  showCard(`<h2>${title}</h2>${html}<div class="row"><button class="btn pri" id="mInfoBack">Zurück</button></div>`);
  $('mInfoBack').onclick = back;
}

function openPopup(t) {
  selThing = t;
  const d = TOOLS[t.type], p = $('popup'), build = phase === 'build', canUp = t.lvl < 3;
  p.innerHTML = `<div class="ph"><b>${d.name}</b><span class="stars">${ico('star').repeat(t.lvl)}${ico('stard').repeat(3 - t.lvl)}</span>
      <span class="sp"></span>${infoBtn('pInfo')}<button class="btn alt x" id="pX" aria-label="Schließen">${ico('x')}</button></div>
    <div class="pb">${canUp ? `<button class="btn pri up" id="pUp" ${!build || S.gold < upCost(t) ? 'disabled' : ''}>${ico('up')} Upgrade ${upCost(t)} ${ico('coin')}</button>` : '<button class="btn" disabled>Max. Stufe</button>'}
    <button class="btn danger" id="pSell" ${!build ? 'disabled' : ''}>${t.type === 'hole' ? 'Zuschütten' : 'Abreißen'} +${sellVal(t)}</button></div>`;
  p.classList.remove('hide');
  $('pX').onclick = closePopup;
  $('pX').onpointerup = e => { e.preventDefault(); closePopup(); };
  $('pInfo').onclick = () => showInfo(`${d.name} · Stufe ${t.lvl}`, `<p>${d.desc}</p><p>${statText(t.type, t.lvl)}</p>${canUp ? `<p><span class="gold">Nächste Stufe:</span> ${statText(t.type, t.lvl + 1)}</p>` : ''}`, hideCard);
  const up = $('pUp');
  if (up) up.onclick = () => {
    if (phase !== 'build' || S.gold < upCost(t)) return;
    const cst = upCost(t); S.gold -= cst; t.spent += cst; t.lvl++; resetThing(t);
    spark(t.c * TS + 8, t.r * TS + 8, '#ffd83a', 10);
    save(); updateUI(); openPopup(t);
  };
  $('pSell').onclick = () => {
    if (phase !== 'build') return;
    S.gold += sellVal(t); removeThing(t);
    spark(t.c * TS + 8, t.r * TS + 8, '#c9c9d9', 8);
    save(); closePopup(); updateUI();
  };
}
function closePopup() { selThing = null; $('popup').classList.add('hide'); }

function tapWorld(cssX, cssY) {
  const gx = Math.floor(cssX * dpr / K) + camX, gyS = Math.floor(cssY * dpr / K);
  if (gyS < MM.y + MM.h + 3) { camX = (gx - camX - MM.x) / (bw - 8) * NC * TS - bw / 2; clampCam(); return; }
  if (phase === 'wave') { throwStone(gx); return; }
  const gy = gyS - levelTop, col = Math.floor(gx / TS), r = Math.floor(gy / TS);
  if (col < 0 || col >= NC || r < 0 || r >= ROWS) { closePopup(); return; }
  const t = r >= GROUND ? thingAt(col, GROUND) : thingAt(col, r);
  if (t && (!selType || r < GROUND || selType !== 'hole')) { openPopup(t); return; }
  if (!selType) { closePopup(); return; }
  if (!canPlace(selType, col, r)) { toast(col < BUILD_MIN || col > BUILD_MAX ? 'Hier kann nicht gebaut werden' : TOOLS[selType].place === 'floor' ? 'Braucht festen Boden darunter' : TOOLS[selType].place === 'ground' ? 'Nur auf den Boden' : 'Hier ist kein Platz'); return; }
  const d = TOOLS[selType];
  if (S.gold < d.cost) { toast('Zu wenig Gold'); return; }
  S.gold -= d.cost;
  const nt = placeThing(selType, col, r);
  spark(nt.c * TS + 8, nt.r * TS + 8, '#c9c9d9', 8);
  closePopup(); save(); updateUI();
}

let drag = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  const r = cv.getBoundingClientRect();
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, cam: camX, moved: false, rx: e.clientX - r.left, ry: e.clientY - r.top };
});
cv.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 8 || Math.abs(e.clientY - drag.y) > 8) drag.moved = true;
  if (drag.moved) { camX = drag.cam - dx * dpr / K; clampCam(); }
});
cv.addEventListener('pointerup', e => { if (!drag || drag.id !== e.pointerId) return; if (!drag.moved) tapWorld(drag.rx, drag.ry); drag = null; });
cv.addEventListener('pointercancel', () => drag = null);
cv.addEventListener('wheel', e => { camX += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) / 3; clampCam(); e.preventDefault(); }, { passive: false });
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'd') camX += 24;
  if (e.key === 'ArrowLeft' || e.key === 'a') camX -= 24;
  if (e.key === 'Escape') { closePopup(); selType = null; refreshPalette(); }
  if (e.key === ' ' && phase === 'build' && !menuOpen) startWave();
  clampCam();
});
$('bStart').onclick = () => startWave();
$('bSpeed').onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 3 : 1; updateUI(); };
$('bPause').onclick = () => { paused = !paused; updateUI(); };
$('bMenu').onclick = () => showMenu();
$('bLord').onclick = () => showLord();

// ================= Fenster =================
function showCard(html) { $('card').innerHTML = html; $('overlay').classList.remove('hide'); menuOpen = true; }
function hideCard() { $('overlay').classList.add('hide'); menuOpen = false; }
const HELP = `<ul>
  <li>Du bist der <b>Dunkle Lord</b> und baust die Strecke, über die Helden zu deinem Schloss rennen.</li>
  <li>Zwischen den Runden: unten ein Bauteil wählen und aufs Raster tippen. Blöcke, Fallen und Gegner gehen auch in die Luft. Bauteil antippen = Upgrade oder Abreißen.</li>
  <li>Helden springen über Lücken, Mauern und Fallen, die sie erkennen, und springen deine kleinen Gegner platt. Zu hohe Mauern schlagen sie kaputt.</li>
  <li>Während einer Runde: tippe auf die Strecke, dann wirft der Lord einen Stein.</li>
  <li>Bestanden ist eine Runde, wenn <b>unter 10 %</b> durchkommen (Bronze). Höchstens 5 % = Silber, keiner = Gold.</li>
  <li>Jede Runde gibt ein festes Budget. Restgold verfällt, deine Bauten bleiben stehen. Nicht bestanden: du behältst das Gold aus den Kills (in Wiederholungen nur die Hälfte).</li>
  <li>Jede 5. Runde kommt ein Paladin als Boss. Danach geht es in eine neue Welt mit leerem Feld und großem Budget.</li>
</ul>`;
function showStart() {
  const saved = load();
  showCard(`<div class="hrow"><h1>Fallen<span>fürst</span></h1>${infoBtn('mInfo')}</div>
    <div class="row">
      ${saved && (saved.wave > 1 || saved.things.length) ? `<button class="btn pri" id="mCont">Weiter<small>Runde ${saved.wave}</small></button><button class="btn alt" id="mNew">Neues Spiel</button>` : `<button class="btn pri" id="mNew">Spielen</button>`}
    </div>`);
  $('mInfo').onclick = () => showInfo('So wird gespielt', HELP, showStart);
  const cont = $('mCont');
  if (cont) cont.onclick = () => { S = saved; begin(); };
  $('mNew').onclick = () => { S = newState(); save(); resetLord(); begin(); };
}
function begin() {
  applyLength(S.wave); rebuildTM();
  phase = 'build'; heroes = []; spawnQ = []; parts = []; texts = []; stones = [];
  resetLevelRuntime();
  selType = null; closePopup(); preview = null;
  camX = 0; clampCam();
  hideCard(); updateUI();
  tryFullscreen();
  if (!S.things.length) setTimeout(() => toast('Wähle unten ein Bauteil und tippe aufs Raster', 3000), 300);
}
function tryFullscreen() {
  const el = document.documentElement;
  try { if (!document.fullscreenElement && el.requestFullscreen && matchMedia('(pointer:coarse)').matches) el.requestFullscreen().then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {}); } catch (e) {}
}
function showLord(resume) {
  const wasPaused = resume === undefined ? paused : resume; paused = true;
  const lv = lordLevel(), cur = lordXpFor(lv), nxt = lordXpFor(lv + 1), free = lordFree();
  const rows = Object.entries(LORD_SKILLS).map(([k, sk]) => {
    const l = lord.pts[k], max = l >= LORD_MAX;
    return `<div class="lrow"><div><b>${sk.name}</b> <span class="muted">${l}/${LORD_MAX}</span><br><span class="muted">${sk.txt(l)}${max ? '' : ` > </span><span class="gold">${sk.txt(l + 1)}`}</span></div>
      <button class="btn lup" data-k="${k}" ${!free || max ? 'disabled' : ''}>+</button></div>`;
  }).join('');
  showCard(`<div class="hrow"><h2>Lord · Stufe ${lv} <span class="${free ? 'gold' : 'muted'}" style="font-size:8px">${free} Punkt${free === 1 ? '' : 'e'} frei</span></h2>${infoBtn('mInfo')}</div>
    <div class="bar xp"><i style="width:${Math.min(100, (lord.xp - cur) / (nxt - cur) * 100)}%"></i></div>
    ${rows}
    <div class="row"><button class="btn pri" id="mBack">Zurück</button></div>`);
  document.querySelectorAll('.lup').forEach(b => b.onclick = () => { if (lordFree() <= 0 || lord.pts[b.dataset.k] >= LORD_MAX) return; lord.pts[b.dataset.k]++; saveLord(); showLord(wasPaused); updateUI(); });
  $('mBack').onclick = () => { paused = wasPaused; hideCard(); updateUI(); };
  $('mInfo').onclick = () => showInfo('Dunkler Lord', `<p>${lord.xp - cur} / ${nxt - cur} Erfahrung bis Stufe ${lv + 1}. Jeder getötete Held gibt 1 Erfahrung, ein Paladin 10. Jede Stufe gibt einen Punkt.</p>
    <p>In der Runde auf die Strecke tippen: der Lord wirft einen Stein dorthin.</p><p>Der Lord behält seine Stufe über alle Runden, bis du ein neues Spiel startest.</p>`, () => showLord(wasPaused));
}
function showMenu(resume) {
  const wasPaused = resume === undefined ? paused : resume; paused = true;
  showCard(`<div class="hrow"><h2>Pause</h2>${infoBtn('mInfo')}</div>
    <div class="res"><span>Runde</span><b>${S.wave}</b><span>Welt</span><b>${themeFor(S.wave).name}</b><span>Helden getötet (gesamt)</span><b>${S.kills}</b><span>Durchgekommen (gesamt)</span><b>${S.leaks}</b><span>Sterne</span><b>${Object.values(S.stars).reduce((a, b) => a + b, 0)} / ${(S.wave - 1) * 3}</b></div>
    <div class="row"><button class="btn pri" id="mRes">Weiter</button><button class="btn alt" id="mNew">Neues Spiel</button></div>`);
  $('mInfo').onclick = () => showInfo('So wird gespielt', HELP, () => showMenu(wasPaused));
  $('mRes').onclick = () => { paused = wasPaused; hideCard(); updateUI(); };
  $('mNew').onclick = e => {
    const b = e.currentTarget;
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.innerHTML = 'Wirklich?<small>Fortschritt weg</small>'; b.classList.add('danger'); return; }
    paused = false; S = newState(); save(); resetLord(); begin();
  };
}
const STAR_NAMES = ['', 'Bronze', 'Silber', 'Gold'];
const HERO_INFO = { rogue: 'schnell und springt sehr weit und hoch.', knight: 'gepanzert, langsam, springt kaum.', cleric: 'heilt Helden in der Nähe.', mage: 'schwebt über Lücken und Fallen am Boden. Nur Feuer, Stampfer, Kanonen und Flatterer erwischen ihn.' };
function starRow(n) { return `<span class="stars">${ico('star').repeat(n)}${ico('stard').repeat(3 - n)}</span>`; }
function showResult(w, stars) {
  const passed = stars > 0, next = heroMix(S.wave);
  const names = Object.entries(next).map(([t, n]) => `${n}× ${HT[t].name}`).join(', ');
  const newTypes = passed && { 2: 'rogue', 3: 'knight', 4: 'cleric', 5: 'mage' }[S.wave];
  const pct = Math.round(W.leaks / waveTotal * 100);
  const newWorld = passed && isBoss(w);
  showCard(`<div class="hrow"><h2>Runde ${w} ${passed ? 'bestanden' : 'nicht bestanden'}</h2>${infoBtn('mInfo')}</div>
    <div class="big ${passed ? '' : 'bad'}" style="color:${['', 'var(--orange)', 'var(--light)', 'var(--gold)'][stars]}">${starRow(stars)} ${passed ? STAR_NAMES[stars] : ''}</div>
    <div class="res">
      <span>Durchgekommen</span><b class="${W.leaks ? 'bad' : 'good'}">${W.leaks} von ${waveTotal} (${pct} %)</b>
      <span>Getötet</span><b>${W.kills}</b>
      ${passed ? `<span>Budget für Runde ${S.wave}</span><b class="gold">${S.gold}</b>` : `<span>Gold durch Kills${S.retry > 1 ? ' (halbiert)' : ''}</span><b class="gold">+${W.gold}</b>`}
    </div>
    <p><b>${passed ? 'Nächste Runde' : 'Nochmal'}:</b> ${names}</p>
    <div class="tags">${newWorld ? `<span class="tag l">Neue Welt: ${themeFor(S.wave).name}</span>` : ''}${newTypes ? `<span class="tag">Neu: ${HT[newTypes].name}</span>` : ''}${next.paladin ? '<span class="tag b">Bossrunde</span>' : ''}${lordFree() ? `<span class="tag l">Lord: ${lordFree()} Punkt${lordFree() === 1 ? '' : 'e'} frei</span>` : ''}</div>
    <div class="row"><button class="btn pri" id="mOk">Bauen</button></div>`);
  $('mOk').onclick = () => { hideCard(); updateUI(); };
  $('mInfo').onclick = () => showInfo('Runde ' + w, `<p>${passed
      ? (newWorld ? 'Boss besiegt! Es geht in eine neue Welt: leeres Feld und großes Budget.' : `Restgold verfällt, deine Bauten bleiben stehen.${colsFor(S.wave) > colsFor(w) ? ' Die Strecke wird länger.' : ''}`)
      : 'Bestanden ist die Runde erst unter 10 % Durchbrüchen. Dein Gold behältst du, in Wiederholungen gibt es aber nur halbes Gold pro Kill.'}</p>
    <p>Bronze: unter 10 % · Silber: höchstens 5 % · Gold: keiner durch</p>
    ${newTypes ? `<p>Neu: ${HT[newTypes].name} - ${HERO_INFO[newTypes]}</p>` : ''}
    ${next.paladin ? `<p>Bossrunde: ${next.paladin > 1 ? next.paladin + ' Paladine kommen' : 'Ein Paladin kommt'}. Er klettert sogar aus Löchern.</p>` : ''}`, () => showResult(w, stars));
}

// ================= Loop =================
let last = performance.now(), uiT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!paused && !menuOpen) for (let k = 0; k < speed; k++) update(dt);
  else if (menuOpen && phase === 'build') update(dt * .5);
  draw();
  uiT -= dt;
  if (uiT <= 0) { uiT = .15; updateUI(); }
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => setTimeout(resize, 50));
S = load() || newState();
applyLength(S.wave); rebuildTM(); resetLevelRuntime();
resize();
updateUI();
showStart();
requestAnimationFrame(frame);

// für automatisierte Tests
window.__game = {
  get S() { return S; }, get phase() { return phase; }, get heroes() { return heroes; }, get minions() { return minions; }, get W() { return W; },
  get teleports() { return teleports; }, startWave, update, hideCard, canPlace, place: (t, col, r) => placeThing(t, col, r), isSolid, get NC() { return NC; },
};
})();

</script>
</body>
</html>
