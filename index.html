<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Fallenfürst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<style>
/* Düstere, gemalte Optik: tiefes Blauschwarz, feine helle Linien, Ornamente, weiches Leuchten */
:root{
  --bg:#05080b;--panel:rgba(8,13,18,.94);--panel2:#0b1218;--line:rgba(214,228,236,.28);--line2:rgba(214,228,236,.65);
  --text:#e3ecf1;--muted:#8fa1ab;--pale:#dfeaf0;--gold:#e8c98a;--ember:#ff8a4a;--red:#e07a5f;--green:#9fd6b0;--violet:#b89aff;
  --light:#c9d6de;--orange:#d9955a;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--display:"Cinzel",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--serif);font-size:16px;line-height:1.35;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
.ico{display:inline-block;width:18px;height:18px;flex:none;background:center/contain no-repeat;vertical-align:-3px}
.box{position:relative;background:var(--panel);color:var(--text);border:1px solid var(--line);
  box-shadow:0 0 0 1px rgba(0,0,0,.7),0 24px 60px rgba(0,0,0,.65),inset 0 0 40px rgba(143,182,200,.06)}
.box::before,.box::after{content:'';position:absolute;left:50%;width:9px;height:9px;transform:translateX(-50%) rotate(45deg);background:var(--bg);border:1px solid var(--line2)}
.box::before{top:-5px}.box::after{bottom:-5px}
.btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 18px;
  font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text);
  background:linear-gradient(rgba(223,234,240,.05),rgba(223,234,240,0));border:1px solid var(--line);transition:border-color .15s,background .15s,box-shadow .15s}
.btn:active:not(:disabled){background:rgba(223,234,240,.1);border-color:var(--line2)}
.btn:disabled{opacity:.35}
.btn.pri{color:var(--gold);border-color:rgba(232,201,138,.6);background:linear-gradient(rgba(232,201,138,.12),rgba(232,201,138,.02));box-shadow:0 0 18px rgba(232,201,138,.12)}
.btn.danger{color:#f2a58e;border-color:rgba(224,122,95,.55)}
.btn.lordb{color:var(--pale)}
.btn small{font-family:var(--serif);font-style:italic;font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:2px}
.btn.pri small{color:rgba(232,201,138,.8)}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}

#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#top,#bottom{background:linear-gradient(#0a1016,#05080b)}
#top{height:44px;flex:none;display:flex;align-items:center;gap:18px;padding:0 14px;border-bottom:1px solid var(--line);overflow:hidden}
.stat{display:flex;align-items:center;gap:7px;font-family:var(--display);font-size:17px;white-space:nowrap;color:var(--pale)}
.stat.g{color:var(--gold)}
.stat.r{color:#f2a58e}
.sp{flex:1}
.ib{height:32px;min-width:36px;padding:0 10px;flex-direction:row;gap:7px;font-size:13px}
.lordb{position:relative}
.lordb.pts::after{content:'';position:absolute;top:-4px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
#stage{flex:1;position:relative;min-height:0;overflow:hidden;background:var(--bg)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
#bottom{height:84px;flex:none;display:flex;align-items:stretch;gap:10px;padding:8px 10px;border-top:1px solid var(--line)}
#psort{flex:none;display:flex;flex-direction:column;gap:6px;width:66px}
#psort .btn{flex:1;padding:0 4px;font-size:10px;letter-spacing:.1em;color:var(--muted)}
#psort .btn.on{color:var(--gold);border-color:rgba(232,201,138,.6)}
.pdiv{flex:none;writing-mode:vertical-rl;transform:rotate(180deg);align-self:center;font-family:var(--display);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:0 2px;border-left:1px solid var(--line)}
#palette{flex:1;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#palette *{touch-action:pan-x}
#palette::-webkit-scrollbar{display:none}
.tb{flex:none;width:78px;padding:4px 0 5px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  background:var(--panel2);border:1px solid var(--line);color:var(--light);font-family:var(--display);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.tb canvas{width:34px;height:34px}
.tb .c{font-family:var(--serif);font-size:14px;line-height:1;font-weight:700;letter-spacing:0;color:var(--gold)}
.tb.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(232,201,138,.25),inset 0 0 18px rgba(232,201,138,.08);color:var(--gold)}
.tb.poor{opacity:.5}
.tb{position:relative}
.tb .lock{position:absolute;inset:14px 0 auto 0;font-family:var(--serif);font-style:italic;font-size:12px;letter-spacing:0;text-transform:none;color:var(--gold)}
.tb.locked canvas{opacity:.18;filter:grayscale(1)}
.tb.locked{color:var(--muted)}
.tb.locked .c{visibility:hidden}
.tag.off{opacity:.45}
#bCastle.pts::after{content:'';position:absolute;top:-4px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
#bCastle{position:relative}
.tb.poor .c{color:var(--red)}
#bStart{min-width:170px;font-size:14px}
#waveinfo{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 8px;font-style:italic;font-size:15px;color:var(--light)}
.bar{height:6px;background:rgba(0,0,0,.5);border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,rgba(232,201,138,.5),var(--gold));box-shadow:0 0 8px rgba(232,201,138,.6)}
.bar.xp i{background:linear-gradient(90deg,rgba(184,154,255,.5),var(--violet));box-shadow:0 0 8px rgba(184,154,255,.6)}
.hide{display:none!important}
#popup{position:absolute;left:50%;top:30px;transform:translateX(-50%);width:min(420px,calc(100% - 24px));padding:14px 16px;display:flex;flex-direction:column;gap:12px}
#popup .ph{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:17px;letter-spacing:.08em}
#popup .ph .x{width:34px;height:34px;padding:0}
#popup .pb{display:flex;gap:10px}
#popup .pb .btn{flex:1;flex-direction:row;gap:8px}
#toast{position:absolute;left:50%;top:30px;transform:translateX(-50%);max-width:calc(100% - 24px);padding:8px 18px;text-align:center;font-style:italic;font-size:16px;
  background:var(--panel);color:var(--pale);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.6);opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10;
  background:radial-gradient(ellipse at center,rgba(5,8,11,.55),rgba(2,3,5,.9));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.card{width:min(540px,100%);max-height:100%;overflow:auto;touch-action:pan-y;padding:22px 26px 28px;display:flex;flex-direction:column;gap:14px}
.card *{touch-action:pan-y}
.card h1{font-family:var(--display);font-weight:700;font-size:32px;letter-spacing:.18em;text-transform:uppercase;color:var(--pale);text-shadow:0 0 24px rgba(191,240,255,.25)}
.card h1 span{color:var(--gold)}
.card h2{font-family:var(--display);font-weight:500;font-size:19px;letter-spacing:.1em;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.card h2::after{content:'';flex-basis:100%;height:1px;margin-top:8px;background:linear-gradient(90deg,var(--line2),transparent)}
.card p{color:var(--light);font-size:17px}
.card ul{margin-left:18px;display:flex;flex-direction:column;gap:8px;color:var(--light);font-size:16px}
.card ul li::marker{color:var(--gold)}
.card b{color:var(--pale);font-weight:700}
.card .row{display:flex;gap:14px;flex-wrap:wrap}
.card .row .btn{flex:1;min-width:150px;min-height:50px;font-size:13px}
.res{display:grid;grid-template-columns:1fr auto;gap:6px 18px;padding:10px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(0,0,0,.25);font-size:17px}
.res span{color:var(--muted)}
.res b{text-align:right;font-family:var(--display);font-weight:500;font-size:15px}
.big{font-family:var(--display);font-size:18px;letter-spacing:.12em;display:flex;align-items:center;gap:10px}
.stars{display:inline-flex;gap:3px}
.stars .ico{width:22px;height:22px}
.ibtn{width:34px;height:34px;padding:0;font-family:var(--serif);font-style:italic;font-size:19px;letter-spacing:0;text-transform:none;flex:none}
.hrow{display:flex;align-items:flex-start;gap:16px}
.hrow>:first-child{flex:1}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:3px 10px;border:1px solid var(--line);font-family:var(--display);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--light)}
.tag.b{border-color:rgba(224,122,95,.6);color:#f2a58e}
.tag.l{border-color:rgba(184,154,255,.6);color:var(--violet)}
.lrow{display:flex;align-items:center;gap:16px;padding-top:12px;border-top:1px solid var(--line)}
.lrow>div{flex:1}
.lrow b{font-family:var(--display);font-weight:500;letter-spacing:.08em}
.muted{color:var(--muted)!important}
.lup{width:46px;height:40px;font-size:20px;flex:none;padding:0}
.btn.up{flex-direction:row;gap:8px}
.good{color:var(--green)!important}.bad{color:#f2a58e!important}.gold{color:var(--gold)!important}
#rotate{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px;font-family:var(--display);letter-spacing:.1em;font-size:16px}
#rotate .ico{width:56px;height:56px;animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){#rotate .ico{animation:none}}
@media (orientation:portrait){body:not(.forceportrait) #rotate{display:flex}}
@media (max-height:440px){.card{gap:9px;padding:14px 20px 18px}.card h2{font-size:17px}.card h2::after{margin-top:4px}.res{padding:6px 12px;font-size:15px;gap:2px 16px}.card p{font-size:16px}.card .row .btn{min-height:42px}.big{font-size:16px}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="stat g" title="Gold"><i class="ico i-coin"></i><span id="gold">0</span></div>
    <div class="stat" title="Runde"><i class="ico i-sword"></i><span id="wave">1</span></div>
    <div class="stat" title="Getötet"><i class="ico i-skull"></i><span id="kills">0</span></div>
    <div class="stat r" title="Durchgekommen"><i class="ico i-run"></i><span id="leaks">0</span></div>
    <div class="sp"></div>
    <button class="btn ib" id="bCastle" aria-label="Burg"><i class="ico i-castle"></i><span id="castleLv">1</span></button>
    <button class="btn ib lordb" id="bLord" aria-label="Dunkler Lord"><i class="ico i-lord"></i><span id="lordLv">1</span></button>
    <button class="btn ib alt" id="bSpeed" aria-label="Tempo">1x</button>
    <button class="btn ib alt" id="bPause" aria-label="Pause"><i class="ico i-pause"></i></button>
    <button class="btn ib alt" id="bMenu" aria-label="Menü"><i class="ico i-menu"></i></button>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="toast"></div>
    <div id="popup" class="box hide"></div>
  </div>
  <div id="bottom">
    <div id="psort"><button class="btn" data-m="art">Art</button><button class="btn" data-m="cost">Kosten</button></div>
    <div id="palette"></div>
    <div id="waveinfo" class="hide">
      <div id="wiText"></div>
      <div class="bar"><i id="wiBar"></i></div>
    </div>
    <button class="btn pri" id="bStart">Runde 1<small>0 Helden</small></button>
  </div>
</div>
<div id="overlay"><div class="card box" id="card"></div></div>
<div id="rotate">
  <i class="ico i-phone"></i>
  <div>Bitte Handy quer halten</div>
  <button class="btn alt" onclick="document.body.classList.add('forceportrait');window.dispatchEvent(new Event('resize'))">Trotzdem hochkant spielen</button>
</div>

<script>
(() => {
'use strict';

// ================= Grundmaße =================
// Welt aus 16x16-Kacheln, 9 Reihen hoch. Reihe 7 und 8 sind Boden, darüber wird gebaut.
const TS = 16, ROWS = 9, GROUND = 7, NC_MAX = 90, BUILD_MIN = 3;
const G = 900;
const colsFor = w => Math.min(NC_MAX, 30 + (w - 1) * 2);
let NC, CASTLE_C, BUILD_MAX, GOAL_X;
function applyLength(w) { NC = colsFor(w); CASTLE_C = NC - 5; BUILD_MAX = CASTLE_C - 1; GOAL_X = CASTLE_C * TS + 12; }
const SAVE_KEY = 'fallenfuerst_v2';
const FLAME_P = 3.2, FLAME_ON = 1.2;

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ================= Bauteile =================
// place: 'air' = freies Feld über dem Boden, 'floor' = freies Feld mit festem Grund darunter, 'ground' = Bodenfeld
const TOOLS = {
  block:   { name: 'Block', cat: 'Gelände', cost: 15, place: 'air', col: '#c0703a', desc: 'Fester Block für Mauern, Treppen und Plattformen. Helden springen drüber oder schlagen ihn kaputt. Wird jede Runde repariert.', lv: [{ hp: 60 }, { hp: 150 }, { hp: 320 }] },
  hole:    { name: 'Loch', cat: 'Gelände', cost: 40, place: 'ground', col: '#000000', desc: 'Reißt den Boden auf. Wer reinfällt, ist weg. Gefallene Helden füllen das Loch nach und nach auf.', lv: [{ cap: 3 }, { cap: 5 }, { cap: 8 }] },
  spikes:  { name: 'Stacheln', cat: 'Fallen', cost: 30, place: 'floor', col: '#c9c9d9', desc: 'Schaden, solange ein Held drauf steht. Clevere Helden springen drüber.', lv: [{ dps: 40 }, { dps: 65 }, { dps: 100 }] },
  flame:   { name: 'Flammen', cat: 'Fallen', cost: 70, place: 'floor', col: '#ff9a2e', desc: 'Feuersäule im Takt, drei Felder hoch. Trifft auch Springer.', lv: [{ dps: 70 }, { dps: 110 }, { dps: 160 }] },
  firebar: { name: 'Feuerrad', cat: 'Fallen', cost: 90, place: 'air', col: '#ffd83a', desc: 'Kreisende Feuerkugeln, frei in der Luft platzierbar.', lv: [{ n: 3, dmg: 22, spd: 1.8 }, { n: 4, dmg: 34, spd: 2.1 }, { n: 5, dmg: 50, spd: 2.4 }] },
  thwomp:  { name: 'Stampfer', cat: 'Fallen', cost: 100, place: 'air', col: '#7c7c94', desc: 'Kracht herunter, sobald ein Held darunter ist. Unten blockiert er den Weg.', lv: [{ dmg: 120 }, { dmg: 190 }, { dmg: 280 }] },
  cannon:  { name: 'Kanone', cat: 'Fallen', cost: 80, place: 'air', col: '#45455a', desc: 'Schießt im Takt Kugeln nach links. Zählt auch als Block.', lv: [{ dmg: 30, per: 3 }, { dmg: 48, per: 2.4 }, { dmg: 72, per: 1.8 }] },
  spring:  { name: 'Katapult', cat: 'Fallen', cost: 60, place: 'floor', col: '#e03a3a', desc: 'Schleudert Helden zurück durch deine Fallen.', lv: [{ push: 4, cd: 2.2 }, { push: 5.5, cd: 1.6 }, { push: 7, cd: 1.1 }] },
  crawler: { name: 'Kriecher', cat: 'Kreaturen', cost: 25, place: 'floor', minion: true, col: '#9b4dff', desc: 'Kleiner Gegner, läuft hin und her. Helden können ihn plattspringen.', lv: [{ dmg: 18, spd: 14, hp: 30 }, { dmg: 30, spd: 18, hp: 55 }, { dmg: 45, spd: 22, hp: 90 }] },
  bat:     { name: 'Flatterer', cat: 'Kreaturen', cost: 40, place: 'air', minion: true, col: '#5a2596', desc: 'Fliegt auf und ab und trifft auch Springer. Kann plattgesprungen werden.', lv: [{ dmg: 20, rng: 20, hp: 25 }, { dmg: 32, rng: 28, hp: 45 }, { dmg: 48, rng: 36, hp: 75 }] },
  spiky:   { name: 'Stachi', cat: 'Kreaturen', cost: 45, place: 'floor', minion: true, col: '#8e1f2c', desc: 'Stacheliger Gegner mit viel Leben. Wer draufspringt, verletzt sich selbst. Helden können ihn mit Waffen bekämpfen.', lv: [{ dmg: 28, spd: 10, hp: 70 }, { dmg: 44, spd: 13, hp: 120 }, { dmg: 66, spd: 16, hp: 200 }] },
};
const ORDER = Object.keys(TOOLS);
const stat = t => TOOLS[t.type].lv[t.lvl - 1];

const HT = {
  squire:  { name: 'Knappe', hp: 30, spd: 32, jv: 270, rng: 2.6, skill: .35, gold: 3, dps: 8, w: 10, h: 14 },
  rogue:   { name: 'Schurke', hp: 22, spd: 46, jv: 300, rng: 3.6, skill: .85, gold: 4, dps: 6, w: 10, h: 14 },
  knight:  { name: 'Ritter', hp: 95, spd: 22, jv: 225, rng: 1.7, skill: .25, gold: 7, dps: 16, w: 10, h: 14, armor: .35 },
  cleric:  { name: 'Klerikerin', hp: 40, spd: 28, jv: 265, rng: 2.5, skill: .5, gold: 6, dps: 6, w: 10, h: 14, heal: true },
  mage:    { name: 'Magier', hp: 30, spd: 24, jv: 0, rng: 0, skill: .6, gold: 8, dps: 5, w: 10, h: 14, float: true },
  paladin: { name: 'Paladin', hp: 520, spd: 20, jv: 255, rng: 2.2, skill: .55, gold: 45, dps: 45, w: 18, h: 28, armor: .3, boss: true },
};

// ================= Burg (bleibt über alle Durchgänge) =================
// Jede Burgstufe schaltet etwas frei. Burgpunkte gibt es beim Zurücksetzen der Burg: einen pro Stern.
const META_KEY = 'fallenfuerst_burg_v1';
const UNLOCKS = [
  { lvl: 1, tools: ['block', 'hole', 'spikes'] },
  { lvl: 2, tools: ['crawler'] }, { lvl: 3, tools: ['flame'] }, { lvl: 4, scherge: true },
  { lvl: 5, tools: ['spring'] }, { lvl: 6, tools: ['bat'] }, { lvl: 7, tools: ['firebar'] }, { lvl: 8, scherge: true },
  { lvl: 9, tools: ['thwomp'] }, { lvl: 10, tools: ['spiky'] }, { lvl: 11, tools: ['cannon'] }, { lvl: 12, scherge: true },
];
const unlockLvl = t => (UNLOCKS.find(u => u.tools && u.tools.includes(t)) || { lvl: 99 }).lvl;
function loadMeta() { try { const d = JSON.parse(localStorage.getItem(META_KEY)); if (d) return { pts: d.pts || 0, lvl: d.lvl || 1, runs: d.runs || 0 }; } catch (e) {} return { pts: 0, lvl: 1, runs: 0 }; }
function saveMeta() { try { localStorage.setItem(META_KEY, JSON.stringify(META)); } catch (e) {} }
let META = loadMeta();
const isUnlocked = t => unlockLvl(t) <= META.lvl;
const castleCost = lv => 3 + (lv - 1) * 2;               // Punkte für den Ausbau von Stufe lv auf lv+1
const castleMul = () => 1 + (META.lvl - 1) * .03;         // jede Stufe: alle Fallen und Kreaturen +3 %
const schergenCount = () => UNLOCKS.filter(u => u.scherge && u.lvl <= META.lvl).length;
const runPoints = () => Object.values(S.stars).reduce((a, b) => a + b, 0);
function unlockText(u) { return u.scherge ? 'Scherge (wirft automatisch)' : u.tools.map(t => TOOLS[t].name).join(', '); }

// ================= Welten =================
const THEMES = [
  { name: 'Nebelwald', bg: ['#04080c', '#0b1a22', '#16303a'], far: '#12262e', mid: '#08141a', fog: 'rgba(150,200,210,', rim: '#7aa7ad', ground: '#05090c', moss: '#3f6b5c', glow: '#bff0ff', block: '#15212a', blockRim: '#8fb6bd', pit: 'void', mote: 'rgba(200,240,250,.9)' },
  { name: 'Kristallgrotte', bg: ['#05030a', '#130c22', '#221636'], far: '#1e1530', mid: '#0e0a18', fog: 'rgba(190,150,230,', rim: '#a58ad0', ground: '#06040a', moss: '#5f4690', glow: '#f0c8ff', block: '#1b1430', blockRim: '#c0a4e4', pit: 'void', mote: 'rgba(235,210,255,.9)' },
  { name: 'Aschenburg', bg: ['#080404', '#1a0c09', '#2c140f'], far: '#2a130d', mid: '#150907', fog: 'rgba(230,140,90,', rim: '#b8785e', ground: '#080504', moss: '#5a2e20', glow: '#ffb070', block: '#221411', blockRim: '#c89478', pit: 'lava', mote: 'rgba(255,160,90,.9)' },
];
const themeFor = w => THEMES[Math.floor((w - 1) / 5) % THEMES.length];

// ================= Zustand =================
let S;
let phase = 'build';
let heroes = [], minions = [], spawnQ = [], bullets = [], parts = [], texts = [];
let waveT = 0, waveTotal = 0, W = null, hpMul = 1;
let speed = 1, paused = false, menuOpen = true;
let selType = null, selThing = null;
let camX = 0, time = 0, shake = 0, lordLaugh = 0;
let TM = new Map();           // Feld -> Bauteil
let corpse = new Array(NC_MAX).fill(0);
const key = (c, r) => c * 16 + r;
const thingAt = (c, r) => TM.get(key(c, r));
function rebuildTM() { TM = new Map(); for (const t of S.things) TM.set(key(t.c, t.r), t); }

function newState() { return { gold: budget(1), wave: 1, things: [], kills: 0, leaks: 0, stars: {}, retry: 0, best: 0 }; }
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ ...S, things: S.things.map(t => ({ type: t.type, c: t.c, r: t.r, lvl: t.lvl, spent: t.spent })) })); } catch (e) {}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!d) return null;
    const s = { ...newState(), ...d, stars: d.stars || {} };
    s.things = (d.things || []).filter(t => TOOLS[t.type]).map(t => makeThing(t.type, t.c, t.r, t.lvl, t.spent, false));
    return s;
  } catch (e) { return null; }
}
function makeThing(type, c, r, lvl = 1, spent = TOOLS[type].cost, fresh = true) {
  const t = { type, c, r, lvl, spent, fresh, t: Math.random() * 3, cd: 0, anim: 0, hp: 0, max: 0 };
  resetThing(t);
  return t;
}
function resetThing(t) {
  t.cd = 0; t.anim = 0;
  if (t.type === 'block') { t.max = stat(t).hp; t.hp = t.max; }
  if (t.type === 'cannon') { t.max = 120 * t.lvl; t.hp = t.max; }
  if (t.type === 'thwomp') { t.y = t.r * TS; t.state = 'up'; t.vy = 0; t.hits = new Set(); }
  if (t.type === 'cannon') t.t = Math.random() * stat(t).per;
}
function resetLevelRuntime() {
  corpse = new Array(NC_MAX).fill(0);
  S.things.forEach(resetThing);
  minions = S.things.filter(t => TOOLS[t.type].minion).map(spawnMinion);
  bullets = [];
}

// ================= Gelände =================
const holeAt = c => { const t = thingAt(c, GROUND); return !!t && t.type === 'hole'; };
const corpseRows = c => { const t = thingAt(c, GROUND); return t ? Math.min(2, Math.floor(corpse[c] / stat(t).cap)) : 0; };
function isSolid(c, r) {
  if (c < 0 || c >= NC) return true;
  if (r < 0 || r >= ROWS) return false;
  if (r >= GROUND) return holeAt(c) ? r >= ROWS - corpseRows(c) : true;
  const t = thingAt(c, r);
  return !!t && (t.type === 'block' || t.type === 'cannon') && t.hp > 0;
}
const solidAt = (x, y) => isSolid(Math.floor(x / TS), Math.floor(y / TS));
// Oberkante des höchsten festen Feldes in einer Spalte (oder null)
function colTop(c) { for (let r = 0; r < ROWS; r++) if (isSolid(c, r)) return r * TS; return null; }

// Bewegung eines Körpers (x = Mitte, y = Füße) mit Kachel-Kollision
function moveBody(b, dx, dy, dyn) {
  b.hitWall = null; b.onGround = false;
  if (dx) {
    b.x += dx;
    const T = b.y - b.h + 1, B = b.y - 1, r0 = Math.floor(T / TS), r1 = Math.floor(B / TS);
    const edge = dx > 0 ? b.x + b.w / 2 : b.x - b.w / 2, c = Math.floor(edge / TS);
    for (let r = r0; r <= r1; r++) if (isSolid(c, r)) {
      b.x = dx > 0 ? c * TS - b.w / 2 - .01 : (c + 1) * TS + b.w / 2 + .01;
      b.hitWall = { c, r }; break;
    }
    if (dyn) for (const o of dyn) {
      const ox = b.x - dx; // nur blocken, wer von außen hineinläuft
      const wasOut = dx > 0 ? ox + b.w / 2 <= o.x + .01 : ox - b.w / 2 >= o.x + o.w - .01;
      if (wasOut && b.y - b.h < o.y + o.h && b.y > o.y && b.x + b.w / 2 > o.x && b.x - b.w / 2 < o.x + o.w) {
        b.x = dx > 0 ? o.x - b.w / 2 - .01 : o.x + o.w + b.w / 2 + .01; b.hitWall = { dyn: o };
      }
    }
  }
  if (dy) {
    b.y += dy;
    const c0 = Math.floor((b.x - b.w / 2) / TS), c1 = Math.floor((b.x + b.w / 2 - .01) / TS);
    if (dy > 0) {
      const r = Math.floor(b.y / TS);
      for (let c = c0; c <= c1; c++) if (isSolid(c, r)) { b.y = r * TS; b.vy = 0; b.onGround = true; break; }
    } else {
      const r = Math.floor((b.y - b.h) / TS);
      for (let c = c0; c <= c1; c++) if (isSolid(c, r)) { b.y = (r + 1) * TS + b.h; b.vy = 0; break; }
    }
  }
}

// ================= Wellen =================
function waveHpMul(w) { return 1 + (w - 1) * .3 + Math.max(0, w - 5) * .3 + Math.max(0, w - 10) * .4; }
const waveSkill = w => .15 + Math.min(.35, (w - 1) * .03);
const waveRng = w => 1 + Math.min(.3, (w - 1) * .025);
function waveCount(w) { return Math.min(32 + w * 6, 150); }
const isBoss = w => w % 5 === 0;
function waveList(w) {
  const pool = [['squire', 10]];
  if (w >= 2) pool.push(['rogue', 3 + w * .5]);
  if (w >= 3) pool.push(['knight', 2 + w * .4]);
  if (w >= 4) pool.push(['cleric', 1.5 + w * .2]);
  if (w >= 5) pool.push(['mage', 1 + w * .6]);
  const tot = pool.reduce((a, p) => a + p[1], 0), list = [];
  for (let n = waveCount(w); n > 0; n--) {
    let r = Math.random() * tot, pick = 'squire';
    for (const p of pool) { r -= p[1]; if (r <= 0) { pick = p[0]; break; } }
    list.push(pick);
  }
  const bosses = isBoss(w) ? w / 5 : 0;
  for (let k = 0; k < bosses; k++) list.splice(Math.floor(list.length * (.3 + .4 * Math.random())), 0, 'paladin');
  return list;
}
let preview = null;
function planned(w) { if (!preview || preview.w !== w) preview = { w, list: waveList(w) }; return preview.list; }

function starsFor(leaks, total) { const r = leaks / total; return leaks === 0 ? 3 : r <= .05 ? 2 : r < .1 ? 1 : 0; }
const baseBudget = w => 150 + (w - 1) * 20;
function budget(w) {
  if (w === 1 || !isBoss(w - 1)) return baseBudget(w);
  let sum = 0; for (let k = 1; k <= w; k++) sum += baseBudget(k);
  return Math.round(sum / 10) * 10;
}

function startWave() {
  if (phase !== 'build') return;
  closePopup(); selType = null; refreshPalette();
  phase = 'wave';
  hpMul = waveHpMul(S.wave);
  const list = planned(S.wave);
  spawnQ = []; let t = 0;
  list.forEach((type, k) => { t += (k % 8 === 0 && k > 0) ? rnd(1.2, 2) : rnd(.15, .4); spawnQ.push({ t, type }); });
  waveT = 0; waveTotal = list.length;
  W = { kills: 0, leaks: 0, gold: 0 };
  S.things.forEach(t => t.fresh = false);
  resetLevelRuntime();
  heroes = []; stones = []; stoneT = 0; schergeT = [1, 1.8, 2.6];
  if (lord.xp < 40) setTimeout(() => toast('Tippe auf die Strecke: der Lord wirft Steine!', 2600), 400);
  updateUI();
}

function advance(done) {
  if (isBoss(done)) S.things = []; // nach dem Boss: Feld räumen, neue Welt
  S.wave++; S.retry = 0; S.gold = budget(S.wave);
  applyLength(S.wave);
}
function endWave() {
  phase = 'build';
  const done = S.wave, stars = starsFor(W.leaks, waveTotal);
  if (stars > 0) { S.stars[done] = Math.max(S.stars[done] || 0, stars); S.best = Math.max(S.best, done); }
  // Perfekt: direkt weiter. Bestanden, aber nicht perfekt: der Spieler entscheidet im Ergebnisfenster.
  if (stars === 3) advance(done);
  else if (stars === 0) S.retry = (S.retry || 0) + 1;
  rebuildTM();
  resetLevelRuntime();
  heroes = []; stones = [];
  save(); saveLord();
  showResult(done, stars);
  updateUI();
}

// ================= Helden =================
function spawnHero(type) {
  const d = HT[type];
  heroes.push({
    type, def: d, x: rnd(10, 26), y: GROUND * TS, vx: 0, vy: 0, w: d.w, h: d.h,
    hp: d.hp * hpMul, max: d.hp * hpMul,
    skill: Math.min(.95, d.skill + waveSkill(S.wave)), rng: d.rng * waveRng(S.wave), jv: d.jv,
    st: 'run', onGround: true, plans: {}, anim: Math.random() * 10, flash: 0, healT: rnd(1, 3),
    kb: 0, hitCd: 0, fbCd: 0, bestX: 0, stuckT: 0, wallTries: 0, waitT: 0, waiting: false, dead: false,
  });
}
const airTime = h => 2 * h.jv / G;
function jump(h, dist) { h.vy = -h.jv; h.vx = Math.max(h.def.spd, dist / airTime(h)); h.onGround = false; }

function damage(h, amt, src) {
  if (h.dead) return;
  if (h.def.armor && src !== 'pit') amt *= (1 - h.def.armor);
  if (src !== 'stone' && src !== 'pit') amt *= castleMul();
  h.hp -= amt;
  if (amt > 2 || Math.random() < .15) h.flash = .08;
  if (Math.random() < Math.min(.9, amt * .08)) spark(h.x, h.y - h.h / 2, src === 'fire' ? '#ff9a2e' : '#e03a3a', 1);
  if (h.hp <= 0) kill(h, src);
}
function knock(h, dir = -1) { h.kb = .35; h.vx = 50 * dir; h.vy = -150; h.onGround = false; }

function kill(h, src) {
  if (h.dead) return;
  h.dead = true;
  const g = Math.max(1, Math.round(h.def.gold * (1 + (S.wave - 1) * .025) * (S.retry ? .5 : 1)));
  S.gold += g; S.kills++; W.kills++; W.gold += g;
  const lvBefore = lordLevel();
  lord.xp += h.def.boss ? 10 : 1;
  if (lordLevel() > lvBefore) { saveLord(); texts.push({ x: CASTLE_C * TS + 40, y: 0, txt: 'Lord Stufe ' + lordLevel() + '!', col: '#d9a8ff', life: 2, max: 2 }); }
  lordLaugh = 1.2;
  const y = src === 'pit' ? GROUND * TS - 4 : h.y - h.h / 2;
  for (let k = 0; k < 8; k++) parts.push({ x: h.x, y, vx: rnd(-40, 40), vy: rnd(-80, -20), life: rnd(.4, .8), max: .8, col: k < 3 ? '#ffd83a' : '#c9c9d9', g: 200 });
  parts.push({ ghost: true, x: h.x, y, vy: -24, life: 1.2, max: 1.2 });
  texts.push({ x: h.x, y: y - 10, txt: '+' + g, col: '#ffd83a', life: 1, max: 1 });
  if (h.def.boss) { shake = .4; texts.push({ x: h.x, y: y - 22, txt: 'Paladin besiegt!', col: '#ffffff', life: 1.8, max: 1.8 }); }
}
function leak(h) {
  h.dead = true; S.leaks++; W.leaks++;
  texts.push({ x: GOAL_X, y: GROUND * TS - 40, txt: 'Durch!', col: '#e03a3a', life: 1.1, max: 1.1 });
  shake = Math.max(shake, .15);
}

// Nächster Platz rechts, auf dem man stehen kann (für Paladin und festgefahrene Helden)
function standSpotRight(c0, h) {
  for (let c = c0 + 1; c < NC; c++) for (let r = 1; r < ROWS; r++) {
    if (isSolid(c, r) && !isSolid(c, r - 1) && !isSolid(c, r - 2)) return { x: c * TS + TS / 2, y: r * TS };
  }
  return { x: GOAL_X, y: GROUND * TS };
}

function feetRow(h) { return Math.floor((h.y - 1) / TS); }
// Was liegt in Spalte c auf Laufhöhe fr? 'wall', 'gap' (kein Halt bis ganz unten) oder 'trap'
function colDanger(c, fr) {
  if (c >= NC) return null;
  if (isSolid(c, fr)) return 'wall';
  let floor = false;
  for (let r = fr + 1; r < ROWS; r++) if (isSolid(c, r)) { floor = true; break; }
  if (!floor) return 'gap';
  const t = thingAt(c, fr);
  if (t && (t.type === 'spikes' || t.type === 'spring')) return 'trap';
  return null;
}
const isDZ = d => d === 'gap' || d === 'trap';

function planJump(h) {
  const fr = feetRow(h), c0 = Math.floor(h.x / TS), look = Math.ceil(h.rng) + 2, R = h.rng * TS;
  for (let c = c0; c <= c0 + look; c++) {
    const dz = colDanger(c, fr);
    if (dz === 'wall') return false;
    if (!isDZ(dz)) continue;
    let s = c, e = c;
    while (s > c0 && isDZ(colDanger(s - 1, fr))) s--;
    while (e < c0 + look + 4 && isDZ(colDanger(e + 1, fr))) e++;
    const x0 = s * TS, x1 = (e + 1) * TS;
    if (h.x - h.w / 2 > x1) continue;
    const pk = s + ':' + fr;
    let p = h.plans[pk];
    if (!p) {
      const see = Math.random() < Math.min(.97, h.skill + .1 + (dz === 'gap' ? .35 : 0));
      const err = (Math.random() - .5) * (1 - h.skill) * 18;
      p = h.plans[pk] = { jump: see, tx: x0 - Math.max(2, (R - (x1 - x0)) / 2) + err, done: false };
    }
    if (p.jump && !p.done && h.x >= p.tx) { p.done = true; jump(h, R); return true; }
    return false;
  }
  return false;
}

// Gegner, Kugeln: kurz davor abspringen (mit etwas Glück)
// Kreatur direkt vor dem Helden bekämpfen (z. B. im Tunnel, wo man nicht drüberspringen kann)
function fightMinion(h, dt) {
  for (const m of minions) {
    if (!m.alive) continue;
    const dx = m.x - h.x;
    if (dx < 0 || dx > (h.w + m.w) / 2 + 3 || h.y < m.y - m.h - 2 || h.y - h.h > m.y) continue;
    m.hp -= h.def.dps * hpMul * 1.5 * dt; m.hurt = .12; h.attacking = true;
    if (m.hp <= 0) {
      m.alive = false; m.squash = .5;
      for (let k = 0; k < 6; k++) parts.push({ x: m.x, y: m.y - 4, vx: rnd(-50, 50), vy: rnd(-80, -20), life: .4, max: .4, col: '#c9c9d9', g: 300 });
    }
    return true;
  }
  return false;
}
// Platz über dem Kopf zum Springen?
function headroom(h) { const fr = feetRow(h), c = Math.floor(h.x / TS); return !isSolid(c, fr - 1) && !isSolid(c + 1, fr - 1) && !isSolid(c, fr - 2); }
function dodge(h) {
  for (const m of minions) {
    if (!m.alive) continue;
    const dx = m.x - h.x;
    if (dx < 6 || dx > 34 || Math.abs(m.y - h.y) > 10) continue;
    const pk = 'm' + m.id;
    if (h.plans[pk] === undefined) h.plans[pk] = Math.random() < h.skill + .15 + (h.learn || 0);
    if (h.plans[pk] && dx < (m.type === 'spiky' ? 26 : 18) && headroom(h)) { jump(h, m.type === 'spiky' ? dx + 20 : dx + 4); return true; }
  }
  for (const b of bullets) {
    const dx = b.x - h.x;
    if (dx < 4 || dx > 40 || b.y < h.y - h.h - 2 || b.y > h.y + 2) continue;
    const pk = 'b' + b.id;
    if (h.plans[pk] === undefined) h.plans[pk] = Math.random() < h.skill;
    if (h.plans[pk] && dx < 26) { jump(h, 24); return true; }
  }
  return false;
}

function flameOn(t, tt) { return (tt % FLAME_P) < FLAME_ON; }
function shouldWait(h) {
  const fr = feetRow(h), c = Math.floor((h.x + h.w / 2 + 3) / TS);
  for (let r = fr; r <= Math.min(GROUND - 1, fr + 3); r++) {
    const t = thingAt(c, r);
    if (!t || t.type !== 'flame') continue;
    const d = c * TS - (h.x + h.w / 2);
    if (d < 0 || d > 8) continue;
    const pk = 'f' + c + ':' + r;
    if (h.plans[pk] === undefined) h.plans[pk] = Math.random() < h.skill;
    if (!h.plans[pk]) continue;
    if (h.waitT >= 2.2) h.plans['g' + pk] = true;
    const win = (d + TS + 12) / h.def.spd;
    let soon = false; for (let s = 0; s <= win; s += .05) if (flameOn(t, t.t + s)) { soon = true; break; }
    if (flameOn(t, t.t) || (!h.plans['g' + pk] && soon)) return true;
  }
  return false;
}

function attackWall(h, dt) {
  const fr = feetRow(h), c = Math.floor((h.x + h.w / 2 + 2) / TS);
  for (let r = fr; r >= fr - Math.ceil(h.h / TS) + 1; r--) {
    const t = thingAt(c, r);
    if (t && (t.type === 'block' || t.type === 'cannon') && t.hp > 0) {
      t.hp -= h.def.dps * hpMul * dt; t.anim = .12; h.anim += dt * 20; h.attacking = true;
      if (t.hp <= 0) breakBlock(t);
      return true;
    }
  }
  return false;
}
function breakBlock(t) {
  t.hp = 0;
  for (let k = 0; k < 10; k++) parts.push({ x: t.c * TS + 8, y: t.r * TS + 8, vx: rnd(-70, 70), vy: rnd(-150, -30), life: rnd(.4, .8), max: .8, col: themeFor(S.wave).blockRim, g: 600 });
  shake = Math.max(shake, .12);
}

function pitDeath(h) {
  const c = clamp(Math.floor(h.x / TS), 0, NC - 1);
  if (h.def.boss && h.hp > h.max * .36) {
    h.hp -= h.max * .35;
    const s = standSpotRight(c, h); h.x = s.x; h.y = s.y; h.vy = 0; h.vx = 0; h.plans = {};
    texts.push({ x: h.x, y: h.y - 34, txt: 'klettert raus!', col: '#ffd83a', life: 1.2, max: 1.2 });
    return;
  }
  if (holeAt(c)) corpse[c]++;
  kill(h, 'pit');
}

function dynObstacles() {
  const out = [];
  for (const t of S.things) if (t.type === 'thwomp' && t.state !== 'up') out.push({ x: t.c * TS, y: t.y, w: TS, h: TS });
  return out;
}

function updHero(h, dt, dyn) {
  const d = h.def;
  if (h.flash > 0) h.flash -= dt;
  if (h.hitCd > 0) h.hitCd -= dt;
  if (h.fbCd > 0) h.fbCd -= dt;
  if (d.heal) {
    h.healT -= dt;
    if (h.healT <= 0) {
      h.healT = 3.2; let any = false;
      for (const o of heroes) if (!o.dead && o !== h && Math.abs(o.x - h.x) < 40 && o.hp < o.max) { o.hp = Math.min(o.max, o.hp + 10 * hpMul); any = true; }
      if (any) parts.push({ ring: true, x: h.x, y: h.y - 8, life: .6, max: .6 });
    }
  }
  h.attacking = false; h.waiting = false;

  if (d.float) {
    // Magier schweben knapp über dem höchsten Grund vor sich
    const cA = Math.floor(h.x / TS), cB = Math.floor((h.x + h.w / 2 + 6) / TS);
    const tops = [colTop(cA), colTop(cB)].filter(v => v !== null);
    if (tops.length) { const ty = Math.min(...tops) - 3; h.vy = clamp((ty - h.y) * 4, -50, 50); } else h.vy = 0;
    h.waiting = shouldWait(h);
    moveBody(h, h.waiting ? 0 : d.spd * dt, h.vy * dt, dyn);
    if (h.hitWall && !h.waiting) { if (!attackWall(h, dt)) h.y -= 20 * dt; }
    if (!h.waiting && !h.attacking) h.anim += d.spd * dt;
  } else {
    h.vy = Math.min(h.vy + G * dt, 420);
    if (h.kb > 0) { h.kb -= dt; moveBody(h, h.vx * dt, h.vy * dt, dyn); }
    else if (h.onGround) {
      h.waiting = shouldWait(h);
      h.waitT = h.waiting ? h.waitT + dt : 0;
      h.vx = 0;
      if (!h.waiting && !planJump(h) && !dodge(h) && !fightMinion(h, dt)) h.vx = d.spd;
      moveBody(h, h.vx * dt, h.vy * dt, dyn);
      if (h.hitWall && h.onGround) {
        // Mauer: drüberspringen, wenn sie niedrig genug ist, sonst kaputt schlagen
        const fr = feetRow(h), c = h.hitWall.c ?? Math.floor((h.x + h.w / 2 + 2) / TS);
        let hg = 0; while (hg < 5 && isSolid(c, fr - hg)) hg++;

        if (!h.hitWall.dyn && apex >= hg * TS + 2 && h.wallTries < 2) { h.wallTries++; h.vy = -h.jv; h.vx = d.spd * 1.3; h.onGround = false; }
        else attackWall(h, dt);
      }
      if (!h.attacking && h.vx) h.anim += h.vx * dt;
    } else {
      // Wandkontakt in der Luft stoppt nur die Bewegung, nicht den Schwung: so kommt man über Kanten

    h.sampleT = 0; h.sampleX = h.x; h.sampleY = h.y;
  }
  h.noProg = h.x > (h.progX ?? -1) + 8 ? (h.progX = h.x, 0) : (h.noProg || 0) + dt;
  if (h.noProg > 20) { const sp = standSpotRight(Math.floor(h.x / TS) + 1, h); h.x = sp.x; h.y = sp.y; h.vy = 0; h.noProg = 0; h.progX = h.x; h.plans = {}; }

  }

}

// ================= Gegner =================
let minionId = 0;
function spawnMinion(t) {
  const m = { id: ++minionId, src: t, type: t.type, x: t.c * TS + 8, y: (t.r + 1) * TS, vx: 0, vy: 0, w: 12, h: 11, dir: -1, alive: true, t: Math.random() * 6, squash: 0 };
  if (t.type === 'bat') { m.w = 12; m.h = 9; m.homeY = t.r * TS + 12; }
  m.hp = m.max = stat(t).hp;
  return m;
}
function updMinions(dt) {
  for (const m of minions) {
    if (!m.alive) { if (m.squash > 0) m.squash -= dt; continue; }
    const st = stat(m.src);
    m.t += dt;
    if (m.type === 'bat') { m.y = m.homeY + Math.sin(m.t * 2.2) * st.rng; }
    else {
      m.vy = Math.min(m.vy + G * dt, 400);
      moveBody(m, m.dir * st.spd * dt, m.vy * dt);
      const aheadX = m.x + m.dir * (m.w / 2 + 1);
      const edge = m.onGround && !solidAt(aheadX, m.y + 2);
      if (m.hitWall || edge || aheadX < BUILD_MIN * TS || aheadX > CASTLE_C * TS) m.dir *= -1;
      if (m.y > ROWS * TS + 20) m.alive = false;
    }
    // Kontakt mit Helden
    for (const h of heroes) {
      if (h.dead || h.hitCd > 0) continue;
      if (Math.abs(h.x - m.x) > (h.w + m.w) / 2 || h.y < m.y - m.h || h.y - h.h > m.y) continue;
      const stomp = m.type !== 'spiky' && h.vy > 20 && h.y - (m.y - m.h) < 7;
      if (stomp) {
        m.alive = false; m.squash = .5; h.vy = -200; h.onGround = false; h.hitCd = .2;
        for (let k = 0; k < 5; k++) parts.push({ x: m.x, y: m.y - 4, vx: rnd(-50, 50), vy: rnd(-80, -20), life: .4, max: .4, col: '#9b4dff', g: 300 });
        break;
      }
      damage(h, st.dmg, 'mob'); h.hitCd = .6;
      if (!h.attacking) knock(h, h.x < m.x ? -1 : 1);
      delete h.plans['m' + m.id]; h.learn = Math.min(.6, (h.learn || 0) + .2); // aus Treffern lernen
    }
  }
}

// ================= Fallen =================
let bulletId = 0, teleports = 0;
function overlapRect(h, x, y, w, hh) { return h.x + h.w / 2 > x && h.x - h.w / 2 < x + w && h.y > y && h.y - h.h < y + hh; }
function updThings(dt) {
  for (const t of S.things) {
    const prev = t.t;
    t.t += dt;
    if (t.cd > 0) t.cd -= dt;
    if (t.anim > 0) t.anim -= dt;
    if (phase !== 'wave') continue;
    const st = stat(t), x = t.c * TS, y = t.r * TS;
    switch (t.type) {
      case 'spikes':
        for (const h of heroes) if (!h.dead && !h.def.float && overlapRect(h, x + 1, y + 8, 14, 8)) damage(h, st.dps * dt, 'spike');
        break;
      case 'flame':
        if (flameOn(t, t.t)) for (const h of heroes) if (!h.dead && overlapRect(h, x + 3, y - 2 * TS, 10, 3 * TS)) damage(h, st.dps * dt, 'fire');
        break;
      case 'firebar': {
        const a = t.t * st.spd;
        for (let k = 1; k <= st.n; k++) {
          const bx = x + 8 + Math.cos(a) * k * 7, by = y + 8 + Math.sin(a) * k * 7;
          for (const h of heroes) if (!h.dead && h.fbCd <= 0 && overlapRect(h, bx - 3, by - 3, 6, 6)) { damage(h, st.dmg, 'fire'); h.fbCd = .4; }
        }
      } break;
      case 'thwomp':
        if (t.state === 'up') {
          if (t.cd <= 0 && heroes.some(h => !h.dead && Math.abs(h.x - (x + 8)) < 14 && h.y > t.y + TS)) { t.state = 'fall'; t.vy = 0; t.hits = new Set(); }
        } else if (t.state === 'fall') {
          t.vy += 1400 * dt; t.y += t.vy * dt;
          for (const h of heroes) if (!h.dead && !t.hits.has(h) && overlapRect(h, x, t.y, TS, TS)) { t.hits.add(h); damage(h, st.dmg, 'crush'); }
          const r = Math.floor((t.y + TS) / TS);
          if (r >= ROWS + 1) { t.y = t.r * TS; t.state = 'up'; }
          else if (isSolid(t.c, r) && t.y + TS >= r * TS) {
            t.y = r * TS - TS; t.state = 'down'; t.cd = .9;
            for (let k = 0; k < 6; k++) parts.push({ x: x + rnd(0, 16), y: t.y + TS, vx: rnd(-50, 50), vy: rnd(-60, -10), life: .4, max: .4, col: '#c9c9d9', g: 300 });
            shake = Math.max(shake, .1);
          }
        } else if (t.state === 'down') { if (t.cd <= 0) t.state = 'rise'; }
        else if (t.state === 'rise') { t.y -= 30 * dt; if (t.y <= t.r * TS) { t.y = t.r * TS; t.state = 'up'; t.cd = .8; } }
        break;
      case 'cannon':
        if (t.hp > 0 && (prev % st.per) > (t.t % st.per)) { bullets.push({ id: ++bulletId, x: x - 2, y: y + 8, vx: -70, dmg: st.dmg }); t.anim = .2; }
        break;
      case 'spring':
        if (t.cd <= 0) for (const h of heroes) if (!h.dead && !h.def.float && h.vy >= 0 && overlapRect(h, x + 2, y + 8, 12, 8)) {
          h.vy = -330; h.vx = -(st.push * TS) / (2 * 330 / G); h.kb = 2 * 330 / G; h.onGround = false; h.plans = {};
          t.cd = st.cd; t.anim = .3; break;
        }
        break;
    }
  }
  for (const b of bullets) {
    b.x += b.vx * dt;
    if (solidAt(b.x - 3, b.y) || b.x < -10) { b.dead = true; continue; }
    for (const h of heroes) if (!h.dead && overlapRect(h, b.x - 4, b.y - 3, 8, 6)) { damage(h, b.dmg, 'shot'); b.dead = true; break; }
  }
  bullets = bullets.filter(b => !b.dead);
}

// ================= Dunkler Lord =================
const LORD_KEY = 'fallenfuerst_lord_v1', LORD_MAX = 10;
const LORD_SKILLS = {
  dmg: { name: 'Wurfkraft', txt: l => `${stoneDmg(l)} Schaden` },
  cd:  { name: 'Nachladen', txt: l => `alle ${stoneCd(l).toFixed(2)} s` },
  rad: { name: 'Einschlag', txt: l => `${stoneRad(l)} Radius` },
};
const stoneDmg = (l = lord.pts.dmg) => 18 + l * 10;
const stoneCd = (l = lord.pts.cd) => 1.5 - l * .11;
const stoneRad = (l = lord.pts.rad) => 10 + l * 2;
const lordXpFor = lv => Math.round(25 * Math.pow(lv - 1, 1.6));
function lordLevel() { let l = 1; while (lordXpFor(l + 1) <= lord.xp) l++; return l; }
const lordFree = () => Math.max(0, lordLevel() - 1 - (lord.pts.dmg + lord.pts.cd + lord.pts.rad));
function loadLord() {
  try { const d = JSON.parse(localStorage.getItem(LORD_KEY)); if (d && d.pts) return { xp: d.xp || 0, pts: { dmg: 0, cd: 0, rad: 0, ...d.pts } }; } catch (e) {}
  return { xp: 0, pts: { dmg: 0, cd: 0, rad: 0 } };
}
function saveLord() { try { localStorage.setItem(LORD_KEY, JSON.stringify(lord)); } catch (e) {} }
function resetLord() { lord = { xp: 0, pts: { dmg: 0, cd: 0, rad: 0 } }; saveLord(); }
let lord = loadLord();
let stones = [], stoneT = 0, lordThrow = 0;
const lordPos = () => ({ x: CASTLE_C * TS + 40, y: 2 * TS - 8 });
const STONE_G = 600;
// Der Stein fliegt im Bogen zum Boden unter der Tippstelle und schlägt dort auf, außer er trifft vorher einen Helden
function throwStone(wx) {
  if (stoneT > 0) return;
  launchStone(lordPos(), wx, stoneDmg(), false);
  stoneT = stoneCd(); lordThrow = .3;
}
function launchStone(o, wx, dmg, auto) {
  const tx = clamp(wx, 0, NC * TS);
  let ty = GROUND * TS - 2; const top = colTop(Math.floor(tx / TS)); if (top !== null) ty = top - 2;
  const T = .35 + Math.abs(tx - o.x) / 500;
  stones.push({ x: o.x, y: o.y, vx: (tx - o.x) / T, vy: (ty - o.y - .5 * STONE_G * T * T) / T, t: 0, lx: tx, ly: ty, dmg, auto, T });
}
// Schergen auf der Burg werfen selbstständig auf den vordersten Helden (mit Vorhalt)
let schergeT = [0, 0, 0], schergeAnim = [0, 0, 0];
const schergePos = k => ({ x: CASTLE_C * TS + 8 + k * 22, y: GROUND * TS - 36 });
function updSchergen(dt) {
  const n = schergenCount();
  for (let k = 0; k < n; k++) {
    schergeT[k] -= dt; if (schergeAnim[k] > 0) schergeAnim[k] -= dt;
    if (schergeT[k] > 0) continue;
    let tg = null; for (const h of heroes) if (!h.dead && (!tg || h.x > tg.x)) tg = h;
    if (!tg) continue;
    const o = schergePos(k), lead = tg.def.spd * (.35 + Math.abs(tg.x - o.x) / 500);
    launchStone(o, tg.x + lead, stoneDmg() * .6, true);
    schergeT[k] = 2.6; schergeAnim[k] = .3;
  }
}
function stoneImpact(st, x, y) {
  st.done = true;
  const R = stoneRad();
  for (const h of heroes) if (!h.dead && Math.hypot(h.x - x, h.y - h.h / 2 - y) <= R + 4) damage(h, st.dmg ?? stoneDmg(), 'stone');
  for (let k = 0; k < 8; k++) parts.push({ x, y, vx: rnd(-70, 70), vy: rnd(-110, -20), life: rnd(.3, .6), max: .6, col: k % 2 ? '#c9c9d9' : '#7c7c94', g: 500 });
  shake = Math.max(shake, .06);
}
function updStones(dt) {
  if (stoneT > 0) stoneT -= dt;
  if (lordThrow > 0) lordThrow -= dt;
  for (const st of stones) {
    st.t += dt; st.vy += STONE_G * dt; st.x += st.vx * dt; st.y += st.vy * dt;
    const hit = heroes.find(h => !h.dead && Math.abs(h.x - st.x) < h.w / 2 + 3 && st.y > h.y - h.h && st.y < h.y + 2);
    if (hit) { stoneImpact(st, st.x, st.y); continue; }
    if (st.vy > 0 && solidAt(st.x, st.y + 2)) { stoneImpact(st, st.x, st.y); continue; }
    if (st.y > ROWS * TS + 20 || st.x < -20 || st.x > NC * TS + 20) st.done = true;
  }
  stones = stones.filter(s => !s.done);
}

// ================= Effekte & Update =================
function spark(x, y, col, n) { for (let k = 0; k < n; k++) parts.push({ x, y, vx: rnd(-30, 30), vy: rnd(-60, -10), life: rnd(.2, .45), max: .45, col, g: 400 }); }
function updFx(dt) {
  for (const p of parts) { p.life -= dt; if (p.ring) continue; if (p.ghost) { p.y += p.vy * dt; continue; } p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.life > 0);
  if (parts.length > 500) parts.splice(0, parts.length - 500);
  for (const t of texts) { t.life -= dt; t.y -= 16 * dt; }
  texts = texts.filter(t => t.life > 0);
}
function update(dt) {
  time += dt;
  if (lordLaugh > 0) lordLaugh -= dt;
  if (shake > 0) shake -= dt;
  updThings(dt);
  if (phase === 'wave') {
    waveT += dt;
    while (spawnQ.length && spawnQ[0].t <= waveT) spawnHero(spawnQ.shift().type);
    updMinions(dt);
    const dyn = dynObstacles();
    for (const h of heroes) if (!h.dead) updHero(h, dt, dyn);
    heroes = heroes.filter(h => !h.dead);
    updSchergen(dt);
    updStones(dt);
    if (!spawnQ.length && !heroes.length) endWave();
  } else if (minions.length) {
    // In der Bauphase laufen die Gegner zur Vorschau herum
    updMinions(dt);
  }
  updFx(dt);
}

// ================= Zeichnen =================
// Gemalte Optik: Nebel- und Silhouetten-Ebenen, Randlicht, weiche Leuchtpunkte, dunkle Figuren mit hellen Masken.
const cv = document.getElementById('game');
let c = cv.getContext('2d');
let dpr = 1, SC = 5, viewW = 200, viewH = 160, levelTop = 16, cssW = 0, cssH = 0;
function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cssW = r.width; cssH = r.height;
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  SC = cv.height / (ROWS * TS + 14);
  viewW = cv.width / SC; viewH = cv.height / SC;
  levelTop = viewH - ROWS * TS;
  clampCam();
}
function clampCam() { camX = clamp(camX, 0, Math.max(0, NC * TS - viewW)); }

// feste Zufallsfolgen für Hintergrund-Formen
function seeded(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
const BG = THEMES.map((th, i) => {
  const r = seeded(11 + i * 7);
  return {
    far: Array.from({ length: 14 }, (_, k) => ({ x: k * 70 + r() * 40, w: 8 + r() * 14, h: 60 + r() * 90, t: r() })),
    mid: Array.from({ length: 12 }, (_, k) => ({ x: k * 90 + r() * 50, w: 14 + r() * 20, h: 30 + r() * 60, t: r() })),
    motes: Array.from({ length: 36 }, () => ({ x: r() * 900, y: r() * 150, s: .6 + r() * 1.2, p: r() * 6 })),
  };
});
const wrap = (x, span) => ((x % span) + span) % span;
function glow(x, y, r, col, a = 1) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.globalAlpha = a; c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); c.globalAlpha = 1;
}
function rrect(x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

function drawBg(th, ti) {
  const b = BG[ti], base = GROUND * TS;
  // Grundverlauf
  const g = c.createLinearGradient(0, -levelTop, 0, base);
  g.addColorStop(0, th.bg[0]); g.addColorStop(.55, th.bg[1]); g.addColorStop(1, th.bg[2]);
  c.fillStyle = g; c.fillRect(camX - 20, -levelTop - 20, viewW + 40, viewH + 40);
  // Lichtschächte
  if (ti !== 2) {
    c.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 4; k++) {
      const x = camX + wrap(k * 170 - camX * .15, 680) - 60;
      const lg = c.createLinearGradient(x, -levelTop, x + 60, base);
      lg.addColorStop(0, th.fog + '0.10)'); lg.addColorStop(1, th.fog + '0)');
      c.fillStyle = lg; c.beginPath(); c.moveTo(x, -levelTop); c.lineTo(x + 22, -levelTop); c.lineTo(x + 90, base); c.lineTo(x + 50, base); c.closePath(); c.fill();
    }
    c.globalCompositeOperation = 'source-over';
  }
  // ferne Silhouetten
  const span = 980;
  for (const e of b.far) {
    const x = camX + wrap(e.x - camX * .2, span) - 60;
    c.fillStyle = th.far;
    if (ti === 0) { c.fillRect(x, base - e.h - 30, e.w * .5, e.h + 30); c.beginPath(); c.ellipse(x + e.w * .25, base - e.h - 30, e.w * 1.6, e.w, 0, 0, 7); c.fill(); }
    else if (ti === 1) { c.beginPath(); c.moveTo(x - e.w, base); c.lineTo(x, base - e.h); c.lineTo(x + e.w * .6, base); c.fill(); }
    else { c.fillRect(x, base - e.h, e.w, e.h); c.beginPath(); c.moveTo(x - 2, base - e.h); c.lineTo(x + e.w / 2, base - e.h - e.w * 1.8); c.lineTo(x + e.w + 2, base - e.h); c.fill(); }
  }
  // Nebel
  const fg = c.createLinearGradient(0, base - 90, 0, base);
  fg.addColorStop(0, th.fog + '0)'); fg.addColorStop(1, th.fog + '0.22)');
  c.fillStyle = fg; c.fillRect(camX - 20, base - 90, viewW + 40, 90);
  // mittlere Silhouetten

    const x = camX + wrap(e.x - camX * .5, 1080) - 80;

    if (ti === 0) { c.beginPath(); c.ellipse(x, base, e.w * 1.4, e.h * .45, 0, Math.PI, 0); c.fill(); c.fillRect(x - 1, base - e.h, 2, e.h); }
    else if (ti === 1) { c.beginPath(); c.moveTo(x - e.w * .5, -levelTop); c.lineTo(x, -levelTop + e.h); c.lineTo(x + e.w * .5, -levelTop); c.fill(); glow(x, -levelTop + e.h, 6, th.glow, .5); }

    const x = camX + wrap(m.x - camX * .7 + Math.sin(time * .5 + m.p) * 6, 900) - 40;

function drawTerrain(th, c0, c1) {

  for (let col = c0; col <= c1; col++) {

// aufgehäufte helle Masken der gefallenen Helden
function drawBones(x, y, h) {

function drawPortal() {
  const x = 16, y = GROUND * TS;

  hideCard(); updateUI();
  tryFullscreen();
  if (!S.things.length) setTimeout(() => toast('Wähle unten ein Bauteil und tippe aufs Raster', 3000), 300);
}
function tryFullscreen() {
  const el = document.documentElement;
  try { if (!document.fullscreenElement && el.requestFullscreen && matchMedia('(pointer:coarse)').matches) el.requestFullscreen().then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {}); } catch (e) {}
}
function showLord(resume) {
  const wasPaused = resume === undefined ? paused : resume; paused = true;
  const lv = lordLevel(), cur = lordXpFor(lv), nxt = lordXpFor(lv + 1), free = lordFree();
  const rows = Object.entries(LORD_SKILLS).map(([k, sk]) => {
    const l = lord.pts[k], max = l >= LORD_MAX;
    return `<div class="lrow"><div><b>${sk.name}</b> <span class="muted">${l}/${LORD_MAX}</span><br><span class="muted">${sk.txt(l)}${max ? '' : ` > </span><span class="gold">${sk.txt(l + 1)}`}</span></div>
      <button class="btn lup" data-k="${k}" ${!free || max ? 'disabled' : ''}>+</button></div>`;
  }).join('');
  showCard(`<div class="hrow"><h2>Lord · Stufe ${lv} <span class="${free ? 'gold' : 'muted'}" style="font-size:8px">${free} Punkt${free === 1 ? '' : 'e'} frei</span></h2>${infoBtn('mInfo')}</div>
    <div class="bar xp"><i style="width:${Math.min(100, (lord.xp - cur) / (nxt - cur) * 100)}%"></i></div>
    ${rows}
    <div class="row"><button class="btn pri" id="mBack">Zurück</button></div>`);
  document.querySelectorAll('.lup').forEach(b => b.onclick = () => { if (lordFree() <= 0 || lord.pts[b.dataset.k] >= LORD_MAX) return; lord.pts[b.dataset.k]++; saveLord(); showLord(wasPaused); updateUI(); });
  $('mBack').onclick = () => { paused = wasPaused; hideCard(); updateUI(); };
  $('mInfo').onclick = () => showInfo('Dunkler Lord', `<p>${lord.xp - cur} / ${nxt - cur} Erfahrung bis Stufe ${lv + 1}. Jeder getötete Held gibt 1 Erfahrung, ein Paladin 10. Jede Stufe gibt einen Punkt.</p>
    <p>In der Runde auf die Strecke tippen: der Lord wirft einen Stein dorthin.</p><p>Der Lord behält seine Stufe über alle Runden, bis du ein neues Spiel startest.</p>`, () => showLord(wasPaused));
}
function showCastle(resume, back) {
  const wasPaused = resume === undefined ? paused : resume; paused = true;
  const next = UNLOCKS.find(u => u.lvl === META.lvl + 1), cost = castleCost(META.lvl), can = META.pts >= cost;
  const rows = UNLOCKS.map(u => `<span class="tag ${u.lvl <= META.lvl ? '' : 'off'}">${u.lvl}: ${unlockText(u)}</span>`).join('');
  showCard(`<div class="hrow"><h2>Deine Burg · Stufe ${META.lvl} <span class="gold" style="font-size:15px">${META.pts} Burgpunkte</span></h2>${infoBtn('mInfo')}</div>
    <p>${next ? `Nächste Stufe: <b>${unlockText(next)}</b>` : 'Alles freigeschaltet. Jede weitere Stufe macht Fallen und Kreaturen stärker.'} · Fallen und Kreaturen +${Math.round((castleMul() - 1) * 100)} %</p>
    <div class="tags">${rows}</div>
    <div class="row"><button class="btn pri" id="mUp" ${can ? '' : 'disabled'}>Ausbauen<small>${cost} Burgpunkte</small></button><button class="btn" id="mBack">Zurück</button></div>`);
  $('mUp').onclick = () => {
    if (META.pts < cost) return;
    META.pts -= cost; META.lvl++; saveMeta();
    const u = UNLOCKS.find(x => x.lvl === META.lvl);
    toast(u ? 'Freigeschaltet: ' + unlockText(u) : 'Burg ausgebaut: Fallen stärker', 2400);
    refreshPalette(); updateUI(); showCastle(wasPaused, back);
  };
  $('mBack').onclick = back || (() => { paused = wasPaused; hideCard(); updateUI(); });
  $('mInfo').onclick = () => showInfo('Deine Burg', `<p>Kommst du nicht mehr weiter, setzt du die Burg zurück: der Durchgang startet neu bei Runde 1, und du bekommst einen Burgpunkt pro Stern, den du in diesem Durchgang geholt hast.</p>
    <p>Mit Burgpunkten baust du die Burg aus. Jede Stufe schaltet eine Falle, eine Kreatur oder einen Schergen frei, der von der Burg aus selbst Steine wirft. Außerdem werden alle Fallen und Kreaturen pro Stufe 3 % stärker.</p>
    <p>Burgstufe und Burgpunkte bleiben für immer, auch beim Zurücksetzen.</p>`, () => showCastle(wasPaused, back));
}
// Burg zurücksetzen: neuer Durchgang ab Runde 1, Sterne werden zu Burgpunkten
function resetCastle() {
  const pts = runPoints();
  META.pts += pts; META.runs++; saveMeta();
  paused = false; S = newState(); save(); resetLord(); begin();
  showCastle(false);
  toast(`+${pts} Burgpunkte`, 2400);
}
function resetButton(id) {
  const b = $(id); if (!b) return;
  b.onclick = () => {
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.innerHTML = `Wirklich?<small>Neustart ab Runde 1, +${runPoints()} Burgpunkte</small>`; b.classList.add('danger'); return; }
    resetCastle();
  };
}

function showMenu(resume) {
  const wasPaused = resume === undefined ? paused : resume; paused = true;
  showCard(`<div class="hrow"><h2>Pause</h2>${infoBtn('mInfo')}</div>
    <div class="res"><span>Runde</span><b>${S.wave}</b><span>Welt</span><b>${themeFor(S.wave).name}</b><span>Helden getötet (gesamt)</span><b>${S.kills}</b><span>Durchgekommen (gesamt)</span><b>${S.leaks}</b><span>Sterne</span><b>${Object.values(S.stars).reduce((a, b) => a + b, 0)} / ${(S.wave - 1) * 3}</b></div>
    <div class="row"><button class="btn pri" id="mRes">Weiter</button><button class="btn" id="mReset">Burg zurücksetzen<small>+${runPoints()} Burgpunkte</small></button></div>
    <div class="row"><button class="btn alt" id="mNew">Alles löschen<small>auch Burgstufe</small></button></div>`);
  $('mInfo').onclick = () => showInfo('So wird gespielt', HELP, () => showMenu(wasPaused));
  resetButton('mReset');
  $('mRes').onclick = () => { paused = wasPaused; hideCard(); updateUI(); };
  $('mNew').onclick = e => {
    const b = e.currentTarget;
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.innerHTML = 'Wirklich alles?<small>Burg und Fortschritt weg</small>'; b.classList.add('danger'); return; }
    META = { pts: 0, lvl: 1, runs: 0 }; saveMeta(); refreshPalette();
    paused = false; S = newState(); save(); resetLord(); begin();
  };
}
const STAR_NAMES = ['', 'Bronze', 'Silber', 'Gold'];
const HERO_INFO = { rogue: 'schnell und springt sehr weit und hoch.', knight: 'gepanzert, langsam, springt kaum.', cleric: 'heilt Helden in der Nähe.', mage: 'schwebt über Lücken und Fallen am Boden. Nur Feuer, Stampfer, Kanonen und Flatterer erwischen ihn.' };
function starRow(n) { return `<span class="stars">${ico('star').repeat(n)}${ico('stard').repeat(3 - n)}</span>`; }
function showResult(w, stars) {
  const passed = stars > 0, choice = stars === 1 || stars === 2, advanced = stars === 3;
  const nextW = choice ? w + 1 : S.wave, next = heroMix(advanced ? S.wave : w);
  const names = Object.entries(next).map(([t, n]) => `${n}× ${HT[t].name}`).join(', ');
  const newTypes = advanced && { 2: 'rogue', 3: 'knight', 4: 'cleric', 5: 'mage' }[S.wave];
  const pct = Math.round(W.leaks / waveTotal * 100);
  const newWorld = passed && isBoss(w);
  showCard(`<div class="hrow"><h2>Runde ${w} ${passed ? 'bestanden' : 'nicht bestanden'}</h2>${infoBtn('mInfo')}</div>
    <div class="big ${passed ? '' : 'bad'}" style="color:${['', 'var(--orange)', 'var(--light)', 'var(--gold)'][stars]}">${starRow(stars)} ${passed ? STAR_NAMES[stars] : ''}</div>
    <div class="res">
      <span>Durchgekommen</span><b class="${W.leaks ? 'bad' : 'good'}">${W.leaks} von ${waveTotal} (${pct} %)</b>
      <span>Getötet</span><b>${W.kills}</b>
      ${advanced ? `<span>Budget für Runde ${S.wave}</span><b class="gold">${S.gold}</b>` : `<span>Gold durch Kills${S.retry > 1 ? ' (halbiert)' : ''}</span><b class="gold">+${W.gold}</b>`}
    </div>
    ${choice ? `<p>Nicht perfekt. Willst du die Runde nochmal spielen, um mehr Sterne zu holen, oder weiterziehen?</p>` : `<p><b>${advanced ? 'Nächste Runde' : 'Nochmal'}:</b> ${names}</p>`}
    <div class="tags">${newWorld ? `<span class="tag l">Neue Welt: ${themeFor(w + 1).name}</span>` : ''}${newTypes ? `<span class="tag">Neu: ${HT[newTypes].name}</span>` : ''}${!choice && next.paladin ? '<span class="tag b">Bossrunde</span>' : ''}${lordFree() ? `<span class="tag l">Lord: ${lordFree()} Punkt${lordFree() === 1 ? '' : 'e'} frei</span>` : ''}</div>
    <div class="row">${choice
      ? `<button class="btn" id="mRetry">Nochmal<small>Gold bleibt, Kills halbes Gold</small></button><button class="btn pri" id="mNext">Weiter<small>Runde ${nextW} · Budget ${budget(nextW)}</small></button>`
      : `<button class="btn pri" id="mOk">${passed ? 'Bauen' : 'Nochmal bauen'}</button>${!passed && runPoints() > 0 ? `<button class="btn" id="mReset">Burg zurücksetzen<small>+${runPoints()} Burgpunkte</small></button>` : ''}`}</div>`);
  if (choice) {
    $('mRetry').onclick = () => { S.retry = (S.retry || 0) + 1; save(); hideCard(); updateUI(); };
    $('mNext').onclick = () => {
      advance(w); rebuildTM(); resetLevelRuntime(); save(); hideCard(); updateUI();
      if (newWorld) toast('Neue Welt: ' + themeFor(S.wave).name, 2200);
    };
  } else $('mOk').onclick = () => { hideCard(); updateUI(); };
  resetButton('mReset');
  $('mInfo').onclick = () => showInfo('Runde ' + w, `<p>${choice
      ? 'Bestanden, aber nicht perfekt. Nochmal: du behältst dein Gold und deine Bauten, Kills geben nur halbes Gold. Weiter: Restgold verfällt, die nächste Runde startet mit festem Budget.'
      : passed ? (newWorld ? 'Boss besiegt! Es geht in eine neue Welt: leeres Feld und großes Budget.' : `Restgold verfällt, deine Bauten bleiben stehen.${colsFor(S.wave) > colsFor(w) ? ' Die Strecke wird länger.' : ''}`)
      : 'Bestanden ist die Runde erst unter 10 % Durchbrüchen. Dein Gold behältst du, in Wiederholungen gibt es aber nur halbes Gold pro Kill.'}</p>
    <p>Bronze: unter 10 % · Silber: höchstens 5 % · Gold: keiner durch</p>
    ${newTypes ? `<p>Neu: ${HT[newTypes].name} - ${HERO_INFO[newTypes]}</p>` : ''}
    ${!choice && next.paladin ? `<p>Bossrunde: ${next.paladin > 1 ? next.paladin + ' Paladine kommen' : 'Ein Paladin kommt'}. Er klettert sogar aus Löchern.</p>` : ''}`, () => showResult(w, stars));
}

// ================= Loop =================
let last = performance.now(), uiT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!paused && !menuOpen) for (let k = 0; k < speed; k++) update(dt);
  else if (menuOpen && phase === 'build') update(dt * .5);
  draw();
  uiT -= dt;
  if (uiT <= 0) { uiT = .15; updateUI(); }
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => setTimeout(resize, 50));
S = load() || newState();
applyLength(S.wave); rebuildTM(); resetLevelRuntime();
resize();
updateUI();
showStart();
requestAnimationFrame(frame);

// für automatisierte Tests
window.__game = {
  get S() { return S; }, get phase() { return phase; }, get heroes() { return heroes; }, get minions() { return minions; }, get W() { return W; },
  get teleports() { return teleports; }, startWave, update, hideCard, canPlace, place: (t, col, r) => placeThing(t, col, r), isSolid, get NC() { return NC; },
};
})();

</script>
